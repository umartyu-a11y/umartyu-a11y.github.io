<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Матн — заучивание</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8f5;--surface:#fff;--surface2:#edf3ee;--ink:#17211d;--muted:#6d7973;--line:#dce6df;--jade:#0d5c4b;--jade2:#dceee7;--gold:#b98b43;--red:#b54747;--yellow:#a66a16;--shadow:0 14px 40px #12352d0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}.shell{max-width:1180px;margin:auto;min-height:100vh;display:grid;grid-template-columns:230px 1fr;gap:28px;padding:24px}.rail{position:sticky;top:24px;height:calc(100vh - 48px);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;margin:4px 8px 34px;font-weight:700;font-size:18px}.mark{width:32px;height:32px;border:2px solid var(--gold);border-radius:10px 10px 10px 3px;display:grid;place-items:center;color:var(--jade);font-family:Amiri;font-size:21px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:2px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:var(--muted);font-weight:600}.nav button.active,.nav button:hover{background:var(--jade2);color:var(--jade)}.nav .ico{display:inline-block;width:25px;color:var(--gold)}.rail-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:14px}.main{min-width:0}.top{display:flex;align-items:start;justify-content:space-between;gap:12px;margin:5px 0 24px}.eyebrow{color:var(--jade);font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:700}.top h1{font-size:27px;letter-spacing:-.04em;margin:5px 0}.top p{color:var(--muted);margin:0}.top-actions{display:flex;gap:8px}.icon-btn,.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 13px;font-weight:600}.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}.btn.gold{background:#fbf3e6;border-color:#ead5ad;color:#805c22}.btn.danger{color:var(--red)}.icon-btn{width:40px;padding:10px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.card h2{font-size:16px;margin:0 0 14px}.hero{background:linear-gradient(135deg,#e8f1ec,#fbf3e7);min-height:238px;display:flex;flex-direction:column;justify-content:space-between}.hero h2{font-size:25px;max-width:450px;margin:0}.hero .ar{font-size:31px;margin-top:18px}.ar{direction:rtl;font-family:Amiri,serif}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kpi{background:var(--surface2);border-radius:13px;padding:14px}.kpi b{display:block;font-size:25px}.kpi span{color:var(--muted);font-size:12px}.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:11px 0}.progress i{display:block;height:100%;background:var(--jade);border-radius:6px}.split{display:flex;align-items:center;justify-content:space-between;gap:12px}.list{display:flex;flex-direction:column;gap:9px}.rowitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px}.rowitem:hover{border-color:var(--jade)}.rowitem .title{font-weight:600}.rowitem small{color:var(--muted);display:block;margin-top:3px}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:var(--jade2);color:var(--jade);white-space:nowrap}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}.toolbar input{max-width:300px}.chips{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.chip{white-space:nowrap;background:var(--surface);border:1px solid var(--line);padding:8px 11px;border-radius:20px;color:var(--muted)}.chip.active{background:var(--jade);border-color:var(--jade);color:#fff}.matn-shell{max-width:860px}.matn-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.matn-title{font-size:24px;margin:4px 0}.matn-text{background:#f8f1e4;border-radius:16px;padding:26px 22px;font-size:34px;line-height:2.15;text-align:right;min-height:170px;margin:18px 0;color:#222}.dark .matn-text{background:#2c3029;color:#f3ebd9}.masked{filter:blur(11px);user-select:none}.level{display:flex;gap:6px;flex-wrap:wrap}.level button{padding:8px 10px;background:var(--surface2);border-radius:9px;color:var(--muted)}.level button.active{background:var(--jade);color:#fff}.record{display:flex;justify-content:center;gap:9px;margin:16px 0}.recording{background:var(--red)!important;color:#fff}.result{border-left:3px solid var(--jade);padding:12px 14px;background:var(--surface2);border-radius:0 12px 12px 0}.diff{font-family:Amiri;font-size:27px;line-height:1.9;direction:rtl}.match{color:#248049}.missing{color:var(--red);background:#ffe3e0;text-decoration:line-through}.extra{color:var(--yellow);background:#fff0d3}.replace{color:#7650a4;background:#eee5fa}.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px}.legend span{padding:3px 6px;border-radius:5px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.bigstat{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px}.bigstat b{font-size:27px;display:block}.bigstat span{color:var(--muted);font-size:12px}.bars{height:170px;display:flex;align-items:end;gap:9px;padding-top:20px}.barcol{flex:1;text-align:center;color:var(--muted);font-size:11px}.bar{background:var(--jade);min-height:5px;border-radius:6px 6px 0 0;margin-bottom:6px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-weight:600;font-size:13px}.field textarea{min-height:130px;resize:vertical}.notice{padding:12px 14px;background:#fff4dc;border:1px solid #efd49b;color:#805c22;border-radius:11px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:28px}.bottom{display:none}.modal{position:fixed;inset:0;background:#0d211c88;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modal-box{background:var(--surface);border-radius:18px;padding:22px;max-width:540px;width:100%;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#17211d;color:#fff;border-radius:10px;padding:11px 15px;display:none;z-index:20}.toast.show{display:block}.rtl-ui{direction:rtl}.rtl-ui .nav button{text-align:right}@media(max-width:780px){.shell{display:block;padding:16px 16px 84px}.rail{display:none}.top{margin-bottom:18px}.top h1{font-size:23px}.grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.bottom{position:fixed;display:flex;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding:7px 8px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.bottom button{background:none;color:var(--muted);font-size:10px}.bottom button.active{color:var(--jade);font-weight:700}.bottom .ico{display:block;font-size:19px}.matn-text{font-size:28px}.kpis{gap:6px}.kpi{padding:11px}.kpi b{font-size:21px}}
</style></head>
<body><div class="shell"><aside class="rail"><div class="brand"><div class="mark">ن</div><div>Matn<small>заучивание</small></div></div><div class="nav" id="nav"></div><div class="rail-foot">Локальный MVP<br><span class="muted">Прогресс хранится на устройстве</span></div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow">طالب العلم · DAILY STUDY</div><h1 id="pageTitle">Продолжите обучение</h1><p id="pageSub">Один фрагмент сегодня — уверенность завтра.</p></div><div class="top-actions"><button class="icon-btn" onclick="openSettings()" title="Настройки">⚙</button><button class="btn primary" onclick="showView('library')">+ Новый матн</button></div></header><div id="views"></div></main></div><nav class="bottom" id="bottom"></nav><div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='matn-memorizer-v2';
const seed=[
{id:'ajrumiyya',title:'المقدمة الآجرومية',ru:'Аль-Аджрумия',author:'ابن آجروم',discipline:'النحو',desc:'Краткое введение в арабскую грамматику.',frags:['الْكَلَامُ هُوَ اللَّفْظُ الْمُرَكَّبُ الْمُفِيدُ بِالْوَضْعِ','وَأَقْسَامُهُ ثَلَاثَةٌ اسْمٌ وَفِعْلٌ وَحَرْفٌ جَاءَ لِمَعْنًى','فَالِاسْمُ يُعْرَفُ بِالْخَفْضِ وَالتَّنْوِينِ وَدُخُولِ الْأَلِفِ وَاللَّامِ','وَالْفِعْلُ يُعْرَفُ بِقَدْ وَالسِّينِ وَسَوْفَ وَتَاءِ التَّأْنِيثِ السَّاكِنَةِ']},
{id:'bayquniyya',title:'المنظومة البيقونية',ru:'Аль-Байкуния',author:'عمر بن محمد البيقوني',discipline:'الحديث',desc:'Небольшая поэма о терминологии хадиса.',frags:['أَبْدَأُ بِالْحَمْدِ مُصَلِّيًا عَلَى مُحَمَّدٍ خَيْرِ نَبِيٍّ أُرْسِلَا','وَذِي مِنْ أَقْسَامِ الْحَدِيثِ عِدَّةٌ وَكُلُّ وَاحِدٍ أَتَى وَحَدَّهُ','أَوَّلُهَا الصَّحِيحُ وَهْوَ مَا اتَّصَلْ إِسْنَادُهُ وَلَمْ يَشُذَّ أَوْ يُعَلَّ']},
{id:'talib',title:'متون طالب العلم',ru:'Матны طالب العلم',author:'عبد المحسن بن محمد القاسم',discipline:'متنوع',desc:'Собрание полезных основ для учащегося.',frags:['الْعِلْمُ الشَّرْعِيُّ مِنْ أَجَلِّ الْقُرُبَاتِ وَأَرْفَعِ الدَّرَجَاتِ','وَالْعِلْمُ يُطْلَبُ بِالْحِفْظِ وَالْفَهْمِ وَالْمُرَاجَعَةِ','مَنْ حَفِظَ الْأُصُولَ غَنِيَ عَنِ الْفُضُولِ وَمَنْ ضَيَّعَ الْأُصُولَ حُرِمَ الْوُصُولَ']}
];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{view:'home',matn:'ajrumiyya',frag:0,mask:0,cat:'Все',progress:{},reviews:{},sessions:[],custom:[],theme:'light',lang:'ru',font:34};
const cats=['Все','النحو','الصرف','العقيدة','الفقه','الحديث','أصول الفقه','التجويد','التفسير','الأدب'];
const all=()=>[...seed,...state.custom];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}
function current(){return all().find(x=>x.id===state.matn)||all()[0]}
function pct(m){let n=m.frags.length,done=m.frags.filter((_,i)=>state.progress[m.id+'-'+i]?.score>=.8).length;return Math.round(done/n*100)}
function navItems(){return [['home','⌂','Главная'],['library','▦','Библиотека'],['my','▤','Мои матны'],['review','↻','Повторение'],['profile','◉','Профиль']]}
function renderNav(){let h=navItems().map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="showView('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');document.getElementById('nav').innerHTML=h;document.getElementById('bottom').innerHTML=h}
function setHead(title,sub){document.getElementById('pageTitle').textContent=title;document.getElementById('pageSub').textContent=sub}
function showView(v){state.view=v;save();render()}
function render(){renderNav();let el=document.getElementById('views');el.innerHTML=state.view==='home'?home():state.view==='library'?library():state.view==='my'?my():state.view==='review'?review():profile();document.querySelectorAll('.view').forEach(x=>x.classList.add('active'));applyTheme()}
function home(){setHead('Продолжите обучение','Один фрагмент сегодня — уверенность завтра.');let m=current(), p=pct(m), due=Object.values(state.reviews).filter(x=>x<=Date.now()).length;return `<section class="view active"><div class="grid"><div class="card hero"><div><div class="eyebrow">СЕГОДНЯ · ${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div><h2>${due?`У вас ${due} фрагм. к повторению`:'Ваш следующий шаг — один фрагмент'}</h2><div class="ar">${m.title}</div><p class="muted">${m.author} · ${m.discipline}</p></div><div><div class="split"><span class="muted">Прогресс матна</span><b>${p}%</b></div><div class="progress"><i style="width:${p}%"></i></div><button class="btn primary" onclick="start('${m.id}')">${p?'Продолжить':'Начать изучение'} →</button></div></div><div class="card"><h2>Ваш ритм</h2><div class="kpis"><div class="kpi"><b>${due}</b><span>к повторению</span></div><div class="kpi"><b>${state.sessions.length}</b><span>сессий</span></div><div class="kpi"><b>${streak()}</b><span>дней подряд</span></div></div><p class="muted" style="margin-bottom:0">Малые регулярные шаги лучше редких марафонов.</p></div></div><div class="grid" style="margin-top:16px"><div class="card"><div class="split"><h2>Мои матны</h2><button class="btn" onclick="showView('my')">Все</button></div><div class="list">${all().slice(0,3).map(item).join('')}</div></div><div class="card"><div class="split"><h2>Быстрый старт</h2><span class="pill">6 режимов</span></div><p class="muted">Изучение, повторение за диктором, проверка по памяти, постепенное скрытие, воспроизведение с начала и объединение фрагментов.</p><button class="btn gold" onclick="start('${m.id}',true)">Проверить себя</button></div></div></section>`}
function item(m){return `<div class="rowitem" onclick="start('${m.id}')"><div><div class="title">${m.ru}</div><small>${m.author} · ${m.frags.length} фрагм.</small></div><span class="pill">${pct(m)}%</span></div>`}
function library(){setHead('Библиотека','Выберите матн для спокойной ежедневной практики.');let q=window.libQ||'';let list=all().filter(m=>(state.cat==='Все'||m.discipline===state.cat)&&(`${m.ru} ${m.title} ${m.author}`.toLowerCase().includes(q.toLowerCase())));return `<section class="view active"><div class="toolbar"><input placeholder="Поиск по названию или автору" value="${q}" oninput="window.libQ=this.value;render()"><button class="btn gold" onclick="openImport()">Импорт текста</button></div><div class="chips">${cats.map(c=>`<button class="chip ${state.cat===c?'active':''}" onclick="state.cat='${c}';render()">${c}</button>`).join('')}</div><div class="list">${list.length?list.map(m=>`<div class="card"><div class="split"><div><div class="eyebrow">${m.discipline}</div><h2 style="margin:4px 0">${m.ru}</h2><div class="ar" style="font-size:23px">${m.title}</div><p class="muted">${m.author} · ${m.frags.length} фрагмента</p></div><span class="pill">${pct(m)}%</span></div><p class="muted">${m.desc}</p><div class="row"><button class="btn primary" onclick="start('${m.id}')">Открыть</button><button class="btn" onclick="addToCollection('${m.id}')">${pct(m)?'В моей коллекции':'Добавить'}</button></div></div>`).join(''):'<div class="empty">Ничего не найдено</div>'}</div></section>`}
function my(){setHead('Мои матны','Ваша личная коллекция и собственные тексты.');return `<section class="view active"><div class="card"><div class="split"><div><h2>Коллекция</h2><p class="muted">Официальные и добавленные вами матны доступны офлайн на этом устройстве.</p></div><button class="btn primary" onclick="openImport()">+ Добавить свой</button></div><div class="list">${all().map(item).join('')}</div></div></section>`}
function review(){setHead('Повторение','Интервалы подстраиваются под ваши результаты.');let due=Object.entries(state.reviews).filter(([,v])=>v<=Date.now());let upcoming=Object.entries(state.reviews).filter(([,v])=>v>Date.now()).sort((a,b)=>a[1]-b[1]);return `<section class="view"><div class="grid"><div class="card"><h2>Сегодня</h2>${due.length?`<div class="list">${due.map(([key])=>{let [id,i]=key.split('-');let m=all().find(x=>x.id===id);return m?`<div class="rowitem"><div><b>${m.ru}</b><small>Фрагмент ${+i+1}</small></div><button class="btn primary" onclick="start('${id}',false,${i})">Повторить</button></div>`:''}).join('')}</div>`:'<div class="empty">Сегодня всё повторено.<br>Добавьте новый фрагмент или возвращайтесь завтра.</div>'}</div><div class="card"><h2>Принцип интервалов</h2><p class="muted">Успех увеличивает интервал, ошибка возвращает фрагмент на короткое повторение.</p><div class="list"><div class="rowitem"><span>Следующий шаг</span><b>10 мин</b></div><div class="rowitem"><span>После успеха</span><b>1 день</b></div><div class="rowitem"><span>Уверенное знание</span><b>30 дней</b></div></div></div></div><div class="card" style="margin-top:16px"><h2>Запланировано</h2>${upcoming.length?upcoming.slice(0,8).map(([key,d])=>{let [id,i]=key.split('-'),m=all().find(x=>x.id===id);return m?`<div class="rowitem"><span>${m.ru} · фрагмент ${+i+1}</span><small>${new Date(d).toLocaleString('ru-RU')}</small></div>`:''}).join(''):'<div class="empty">Пока нет будущих повторений.</div>'}</div></section>`}
function profile(){setHead('Профиль','Настройки чтения, темы и локальные данные.');let total=all().reduce((a,m)=>a+m.frags.length,0),done=all().reduce((a,m)=>a+m.frags.filter((_,i)=>state.progress[m.id+'-'+i]?.score>=.8).length,0);return `<section class="view"><div class="stat-grid"><div class="bigstat"><b>${all().length}</b><span>матнов</span></div><div class="bigstat"><b>${done}</b><span>фрагментов</span></div><div class="bigstat"><b>${state.sessions.length}</b><span>повторений</span></div><div class="bigstat"><b>${total?Math.round(done/total*100):0}%</b><span>освоено</span></div></div><div class="grid"><div class="card"><h2>Статистика за 7 дней</h2><div class="bars">${[2,4,1,6,3,5,7].map((n,i)=>`<div class="barcol"><div class="bar" style="height:${n*14}px"></div>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</div>`).join('')}</div></div><div class="card"><h2>Настройки</h2><div class="field"><label>Язык интерфейса</label><select onchange="state.lang=this.value;render()"><option value="ru" ${state.lang==='ru'?'selected':''}>Русский</option><option value="ar" ${state.lang==='ar'?'selected':''}>العربية</option></select></div><div class="field"><label>Размер арабского текста: <b>${state.font}px</b></label><input type="range" min="24" max="48" value="${state.font}" oninput="state.font=+this.value;save();render()"></div><div class="row"><button class="btn" onclick="toggleTheme()">${state.theme==='dark'?'☀ Светлая тема':'◐ Темная тема'}</button><button class="btn danger" onclick="resetData()">Сбросить данные</button></div></div></div><div class="card" style="margin-top:16px"><h2>Что дальше</h2><div class="notice">Этот MVP работает без аккаунта и сервера: прогресс хранится локально. Для синхронизации между устройствами, настоящего Whisper/Arabic ASR, облачного аудио, ролей преподавателя и подписок понадобится подключить Supabase и серверный ASR-модуль.</div></div></section>`}
function start(id,check=false,frag=null){state.matn=id;state.frag=frag===null?0:+frag;state.mask=check?5:0;state.view='study';save();renderStudy()}
function renderStudy(){renderNav();let m=current(),i=Math.min(state.frag,m.frags.length-1),text=m.frags[i],key=m.id+'-'+i,score=state.progress[key]?.score;document.getElementById('pageTitle').textContent='Заучивание';document.getElementById('pageSub').textContent=m.ru+' · фрагмент '+(i+1)+' из '+m.frags.length;document.getElementById('views').innerHTML=`<section class="view active matn-shell"><div class="card"><div class="matn-head"><div><div class="eyebrow">${m.discipline} · ${m.author}</div><div class="matn-title">${m.ru}</div></div><button class="btn" onclick="showView('library')">← К библиотеке</button></div><div class="level">${['Виден','Слова','Половина','Первые слова','Скрыт'].map((x,n)=>`<button class="${state.mask===n?'active':''}" onclick="state.mask=${n};save();renderStudy()">${x}</button>`).join('')}</div><div class="matn-text ar ${state.mask===4?'masked':''}">${maskedText(text,state.mask)}</div><div class="split"><span class="muted">Фрагмент ${i+1} из ${m.frags.length} · ${state.progress[key]?'изучался':'еще не изучался'}</span><button class="btn gold" onclick="speak('${text.replace(/'/g,"\\'")}')">▶ Слушать</button></div><div class="record"><button id="rec" class="btn primary" onclick="toggleRec()">● Записать и проверить</button></div><div id="result">${score?result(score,text,'Сохранённый результат'):''}</div><div class="split"><button class="btn" ${i===0?'disabled':''} onclick="state.frag--;save();renderStudy()">← Назад</button><button class="btn primary" ${i===m.frags.length-1?'disabled':''} onclick="state.frag++;save();renderStudy()">Далее →</button></div></div><div class="card"><h2>Режимы практики</h2><div class="row"><button class="btn" onclick="state.mask=0;save();renderStudy()">Изучение</button><button class="btn" onclick="state.mask=4;save();renderStudy()">Проверка по памяти</button><button class="btn" onclick="speak('${text.replace(/'/g,"\\'")}')">Повторять за диктором</button></div><p class="muted">Зеленый — совпадение, красный — пропуск, желтый — добавление. Ошибка распознавания не считается ошибкой ученика без повторной проверки.</p></div></section>`;document.querySelectorAll('.view').forEach(x=>x.classList.add('active'));document.documentElement.style.setProperty('--matn-size',state.font+'px');applyTheme()}
function maskedText(t,n){if(n===0)return t;let w=t.split(' ');if(n===4)return '••• ••• ••• •••';let keep=n===1?Math.ceil(w.length*.7):n===2?Math.ceil(w.length*.5):1;return w.map((x,i)=>i<keep?x:'◌◌◌').join(' ')}
function tokenize(s){return s.replace(/[ًٌٍَُِّْـٰ]/g,'').replace(/[،؛,.!?؟]/g,'').trim().split(/\s+/).filter(Boolean)}
function diff(expected,said){let a=tokenize(expected),b=tokenize(said),out=[],ok=0;for(let i=0;i<Math.max(a.length,b.length);i++){if(a[i]&&b[i]&&a[i]===b[i]){out.push(`<span class="match">${a[i]}</span>`);ok++}else if(a[i]&&!b[i])out.push(`<span class="missing">${a[i]}</span>`);else if(!a[i]&&b[i])out.push(`<span class="extra">${b[i]}</span>`);else out.push(`<span class="replace">${b[i]}<small>(${a[i]})</small></span>`)}return {html:out.join(' '),score:ok/Math.max(a.length,b.length),expected:a.length,said:b.length}}
function result(score,text,label){let cls=score>=.8?'good':score>=.55?'mid':'low';return `<div class="result"><div class="split"><b class="acc ${cls}">${Math.round(score*100)}% совпадения</b><small class="muted">${label||'Проверка слов'}</small></div><div class="legend"><span class="match">совпало</span><span class="missing">пропущено</span><span class="extra">добавлено</span><span class="replace">заменено</span></div></div>`}
let recognition=null;function toggleRec(){let btn=document.getElementById('rec');if(recognition){recognition.stop();return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Распознавание речи не поддерживается — используйте Safari/Chrome');return}recognition=new SR();recognition.lang='ar-SA';recognition.interimResults=false;recognition.maxAlternatives=3;btn.textContent='■ Идет распознавание…';btn.classList.add('recording');recognition.onresult=e=>{let said=e.results[0][0].transcript,m=current(),text=m.frags[state.frag],d=diff(text,said);state.progress[m.id+'-'+state.frag]={score:d.score,said,at:Date.now()};state.reviews[m.id+'-'+state.frag]=Date.now()+interval(d.score);state.sessions.push(Date.now());save();document.getElementById('result').innerHTML=`<div class="result"><div class="split"><b class="acc ${d.score>=.8?'good':d.score>=.55?'mid':'low'}">${Math.round(d.score*100)}% совпадения</b><small class="muted">Распознано: ${said}</small></div><div class="diff">${d.html}</div><div class="legend"><span class="match">совпало</span><span class="missing">пропущено</span><span class="extra">добавлено</span><span class="replace">заменено</span></div></div>`;toast('Результат сохранен на устройстве')};recognition.onerror=()=>{toast('Не удалось надежно распознать речь. Повторите в тихом месте.');resetRec()};recognition.onend=resetRec;recognition.start()}
function resetRec(){recognition=null;let b=document.getElementById('rec');if(b){b.textContent='● Записать и проверить';b.classList.remove('recording')}}function interval(s){return s>=.9?30*864e5:s>=.8?14*864e5:s>=.6?3*864e5:10*60e3}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.78;speechSynthesis.speak(u)}else toast('Озвучивание не поддерживается')}
function addToCollection(id){state.matn=id;save();toast('Матн добавлен в коллекцию')}
function openImport(){openModal(`<div class="modal-head"><h2>Добавить собственный матн</h2><button class="icon-btn" onclick="closeModal()">×</button></div><p class="muted">Импорт открывает локальный черновик. Перед заучиванием проверьте разделение на фрагменты и точность текста.</p><div class="field"><label>Название</label><input id="impTitle" placeholder="Например: متن في العقيدة"></div><div class="field"><label>Автор / дисциплина</label><input id="impAuthor" placeholder="Автор · النحو"></div><div class="field"><label>Текст (разделяйте фрагменты пустой строкой)</label><textarea id="impText" placeholder="Вставьте арабский текст…"></textarea></div><div class="field"><label>Файл TXT, DOCX или PDF</label><input type="file" accept=".txt,.docx,.pdf,text/plain" onchange="readFile(this)"></div><div class="notice">PDF/DOCX сохраняются как черновик для подтверждения. Автоматический OCR и серверная синхронизация подключаются на backend-этапе.</div><button class="btn primary" onclick="importMatn()">Сохранить локально</button>`)}
function readFile(input){let f=input.files[0];if(!f)return;if(f.type==='text/plain'||f.name.endsWith('.txt')){let r=new FileReader();r.onload=()=>document.getElementById('impText').value=r.result;r.readAsText(f)}else toast('Файл выбран. Вставьте распознанный текст для проверки.')}
function importMatn(){let title=document.getElementById('impTitle').value.trim()||'Мой новый матн',text=document.getElementById('impText').value.trim();if(!text){toast('Добавьте текст перед сохранением');return}let m={id:'custom-'+Date.now(),title,ru:title,author:document.getElementById('impAuthor').value||'Мой источник',discipline:'Моё',desc:'Локально добавленный матн.',frags:text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)};state.custom.push(m);state.matn=m.id;save();closeModal();showView('my');toast('Матн сохранен на устройстве')}
function openSettings(){openModal(`<div class="modal-head"><h2>Быстрые настройки</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="field"><label>Размер арабского текста</label><input type="range" min="24" max="48" value="${state.font}" oninput="state.font=+this.value;save();render()"></div><button class="btn" onclick="toggleTheme();closeModal()">Переключить тему</button>`)}function openModal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();applyTheme();render()}function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark');document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty('--matn-size',state.font+'px');document.body.classList.toggle('rtl-ui',state.lang==='ar')}function streak(){if(!state.sessions.length)return 0;let days=new Set(state.sessions.map(x=>new Date(x).toDateString()));let n=0,d=new Date();while(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n}function resetData(){if(confirm('Удалить весь локальный прогресс?')){localStorage.removeItem(KEY);location.reload()}}
render();
</script></body></html>
