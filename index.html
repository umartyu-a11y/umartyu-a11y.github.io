<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Матн — заучивание</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&display=swap">
<style>
:root {
  --bg: #fbfaf7;
  --fg: #1f2328;
  --muted: #667085;
  --card: #ffffff;
  --border: #e3e0d8;
  --accent: #0f5c4d;
  --accent-fg: #ffffff;
  --accent-soft: #e2f1ec;
  --text-bg: #f4efe0;
  --good: #1b7a3a;
  --bad: #b42318;
  --bad-bg: #fde8e6;
  --warn: #b25a00;
  --warn-bg: #fff0dc;
  --repl: #6b3fa0;
  --repl-bg: #efe7f8;
  --swap: #0b6aa2;
  --swap-bg: #e0f0fa;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181a; --fg: #e8eaec; --muted: #9aa4ad; --card: #1c2225; --border: #2e373b;
    --accent: #4cc0a3; --accent-fg: #07211b; --accent-soft: #17332d; --text-bg: #242a24;
    --good: #5fd080; --bad: #ff8a80; --bad-bg: #3a1f1d; --warn: #ffb866; --warn-bg: #3a2a14;
    --repl: #c8a2f0; --repl-bg: #2e2340; --swap: #7cc4f0; --swap-bg: #152c3b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181a; --fg: #e8eaec; --muted: #9aa4ad; --card: #1c2225; --border: #2e373b;
  --accent: #4cc0a3; --accent-fg: #07211b; --accent-soft: #17332d; --text-bg: #242a24;
  --good: #5fd080; --bad: #ff8a80; --bad-bg: #3a1f1d; --warn: #ffb866; --warn-bg: #3a2a14;
  --repl: #c8a2f0; --repl-bg: #2e2340; --swap: #7cc4f0; --swap-bg: #152c3b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.ar { direction: rtl; font-family: "Amiri", "Scheherazade New", serif; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.stats { display: flex; gap: 16px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); }

nav { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); padding: 4px; border-radius: 12px; }
nav button { flex: 1; min-width: 0; padding: 9px 8px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
nav button[aria-current="true"] { background: var(--accent); color: var(--accent-fg); }

button, select, textarea, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.rec-on { background: var(--bad); color: #fff; border-color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row > * { min-width: 0; }
.grow { flex: 1; }

select, input[type="text"], textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }
textarea { min-height: 84px; resize: vertical; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.matn { background: var(--text-bg); border-radius: 12px; padding: 18px 16px; font-size: 26px; line-height: 2; min-height: 72px; }
.matn.masked { color: var(--muted); letter-spacing: 0.15em; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.msg { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }

.acc { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.acc.good { color: var(--good); } .acc.mid { color: var(--warn); } .acc.low { color: var(--bad); }
.diff { font-size: 24px; line-height: 2.1; }
.w { padding: 0 3px; border-radius: 4px; }
.w.match { color: var(--good); }
.w.missing { color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }
.w.extra { color: var(--warn); background: var(--warn-bg); }
.w.replace { color: var(--repl); background: var(--repl-bg); }
.w.swap { color: var(--swap); background: var(--swap-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { font-style: normal; padding: 0 6px; border-radius: 4px; margin-inline-end: 4px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.item .t { font-size: 20px; min-width: 0; }
h2 { font-size: 16px; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }

/* ===== Дополнения ===== */
.matn { font-size: var(--matn-size, 26px); }
.diff { font-size: calc(var(--matn-size, 26px) * 0.9); }
.ctx { color: var(--muted); font-size: calc(var(--matn-size, 26px) * 0.7); line-height: 1.9; display: flex; flex-direction: column; }
.ctx small { direction: ltr; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }

.seg { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); padding: 3px; border-radius: 10px; }
.seg button { flex: 1; min-width: 0; padding: 7px 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grade .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; }
.grade small { font-weight: 400; font-size: 12px; opacity: 0.8; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-size: 24px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 13px; }

.bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; }
.barcol { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; }
.bar { width: 100%; background: var(--border); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar.hit { background: var(--accent); }
.barval, .barlbl { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 14px; }

.progress { height: 8px; border-radius: 4px; background: var(--border); position: relative; overflow: hidden; margin-top: 4px; }
.progress i { position: absolute; inset: 0 auto 0 0; display: block; }
.progress .p1 { background: var(--accent-soft); outline: 1px solid var(--accent); outline-offset: -1px; border-radius: 4px; }
.progress .p2 { background: var(--accent); border-radius: 4px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="number"] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }

</style>
</head>

<div id="root"></div>
