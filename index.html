وَالنّسَائِيَ» وَأَبْنِ حِبَّانَ في «صَحِيجوا : المُسَْدُ مِنْهُ. وَعَنٍ أَبِنٍ عَبَاسٍ '#ها قَالَ: قَالَ لد بف 20 ع ل رت سك جو وا نوكر رَسَول الله يَكةِ: «مَنِ افتبس شُغبَة مِنّ النجوم؛ ا 1 نقد افتبّس شغبة مِنَ السّخرء رَادَ ما زَّادَ) رَوَاه َبُو دَاوُدَء بإِسْنَادٍ صَحِيح . وَلِلنّسَائِيَ : مِنْ حَدِيثٍ أبي هْرَئْرةَ لله : ع مرطينة و ولاق ور اس للد ب هد لتو روم من عَقَدَ عُقْدَة ثم نَقَتْ فِيهَا كَقَد سحرء وَمَنْ ع ل لها ع الك حيصي فد سَحَرَ فَقَدْ أَشْرَكَ وَمَنْ تَعَلّقَ شَيْئا وكِل إلَيده. رع أل: مَشث د ولك أَنَّ دك لَ الله يلق عن أن منرم طم أن شرل الذد كل قَالَ: «ألَا هل أَنَيكُ َبَككُمْ ما العَضه؟ هِمّ التَمِيمَةٌ 0 مم ع 5 - القالة بين النَاسّنّ -» رَوَاهُ مُسْلِمْ . وَلَهُمَا: عَنٍ أَبْنِ عُمَرَ ميا أن وَسُْولَ الله يكن 0ه وكسوسم يولم قالَ: «إن مِنَ البيَّانِ لسخرأ»."},{"id":"talib-alilm-p141","text":"تان الثؤجيدٍ الذي هُوَ حَقْ الله على القبيب عل 11] بان ا ويتمييرعة ...عطاس ما جَاءَ فِي الكمّانٍ وَنَحُوِجِمْ رَوَى مُسْلِمٌ في ١صَحِيحِوا:‏ عَنْ بَخْضَ أَزْوَاجٍ النَبِيَ يكل عَنِ النَبِيٍ يله نّم قَالَ: \"من أَنَى عَرّافاً َسَأَلَهُ عَنْ شي قُصَدَقَهُ لَمْ يوسي بوكر عم مساق ل 0# وَعَنْ أبي هُرَيْرَةَ نه أنَّ رَسُولَ اللو كن كَالَ: ١مَنْ‏ أَتَى كاهناً تَصَدَّكَهُ بمَا يَقُولُ؛ ََدَ كقر يما أَنْزِل على مُحَمَدٍ تلا رَدَاه بداو وَلِْدرْبَعَةِ وَالحَاكِمِ ‏ وَقَالَ: ١صَحِيحٌ‏ عَلَى شَرْطهِمًا» -: عَنٍ الي يل: ١مَنْ‏ أَنَى عراف أو"},{"id":"talib-alilm-p142","text":"14 متون طالب العلم و موك 2 ايت ا مد كَاهِناً مَصَدَّقَهُ بم يََولَ؛ كَقَدْ كَفْرَيِمَا أَنْزِلَ عَلَى وَلِأَبِي يَعْلَى - بِسَنَدٍ جَيّدِ ‏ عَنِ آَبْنِ مَسْعُودٍ يي مِثْلهُ : مَؤقوفاً . وَعَنْ عِمْرَانَ بْنِ حصَيْنِ ذه مَرْفُوعاً: 2 121 01 اليس مِنا من تَطَيرَ أو تظير لهء أو تَكَمّنَ أؤ ام ال 2 نَكهّنَ له أو سَحَرَّ أؤْ سجر لَهُء وَمَنْ أنى سس سوج | شه لم عوسد ران لشي وسصييع كامِنا فُصَدقَه بمَا يَقَولَ؛ فُقَد كفر بمَا أنزلٌ عَلَى مُحَمَدٍ 1 رَوَاهُ رار ساد جَيدِ. وَرَوَاهُ الطَبَرَانِيُ بِإِسْنَادٍ حَسَنٍ مِنْ حَدِيثٍ م 0 1\" | 26 0-51 َبْنِ عَبَّاسٍ وهّا: ذدُونْ قَوْلِهِ: «وَمَنْ أَنَى ...» ِلَى آخِرِو."},{"id":"talib-alilm-p143","text":"كِتَابُ التُوْجِيدٍ انّذِي هُوَ حَقُ الله عَلَى العَبِيدٍ 14 قَالَ البَعَويُ: «العَرَّافُ: الَّذِي يَدَعِي مَعْرِقَةَ الأور يِمَعَدْمَات فقيل بها على المشورقة وَمَكَانٍ الضَّالَّدَه وَنَخْو ذُلِكَ؛. وَالكَامِنُ: هُوَ الَذِي يُخْبِرُ عَنِ المُعَينَاتِ في | مُسْتَفْبلٍ . وَقِيلَ: هُوَ الَذِي يُخبِرٌ عَمّا في الصَّمِيرٍ وَقَالَ أَبُو العَيّاسٍ أَبْنُ تَيمِيّه: «العَرّاف: أَسْمْ ِلْكَامِنِء وَالمُتَجَمء وَالرّئَاِ وَنَحْوِهِمْ مِمّنْ يتكلم في مَْرِقَةٍ الأمُورٍ بِهَذِه الطرْق) . َثَالَ آبْنُ عَبّاسٍ فِي تم يَكُبُونَ «أبَا جاده وَينْظرُونَ في النجوم: «مَا أرَى مَنْ فَعَلَ ذَلِكَ لَهُ عِنْدَ اللّهِ مِنْ خَلَاق»."},{"id":"talib-alilm-p144","text":"14 متون طالب العلع إفنقا بَابُ ما جَاءَ فِي التُشْرَةٍ عَنْ جار : «أنَّ وَسُولَ اللّهِ يك سْيِلَ عَنٍ النُمْرَة؟ قَقَالَ: هِي مِنْ عَمَلٍ الشَّيْطانِ» رَوَاهُ أتقهذ بصق جِيد رأبو فرك ركان نيل عع عَنّْها؟ فقَالَ: أبن مَسْعُوةٍ يَكْرهُ هَذَا كُلَه. وَفِي «البُخَارِيَ»: عَنْ قَعَادَةَ: «قُلْتُ أَمْرَأتِه؛ أَيْحَلّ عَنْهُ أز يُتَشَّرْ؟ قَالَ: لا بَأْسنَ به نما يُرِيدُونَ به الإضلاح» كَأَمّا مَا يَْمَعُ '"},{"id":"talib-alilm-p145","text":"كِتَابُ التُوْجِيدٍ انّذِي هُوَ حَقُ الله عَلَى العَبِيدٍ 11 َرْوِيَ عَنِ الحَمَنٍ: «لا يَحْلَ المْخر إلا سَاجِر) . 1 1 قَالَ أَبْنُ القَيّم : «التُشْرَةُ: ع السَّحخْرٍ عَنِ المَسْحُورِء وُه تقان: حَلّ بيخْر مِنْلِهء وَمُرَ انّذِي مِنْ عَمَلٍ التَاشِرُوَالمنْعَهِرُ ِلَى الشَّيَْانٍ بمَا يِب وَالنَانِي: التُشْرَةٌ بِالرّقْيَة وَالتَعَوُدَاتِ وَالدّعَوَاتِءِ وَالأَدوِيَةِ المُبَاحَة؛ٍ قَهَذّا جَايرٌا . ‎١‏ ا اه"},{"id":"talib-alilm-p146","text":"144 متون طالب العلم إلكذا بَابُ ما جَاءَ فِي التَطّيْرِ وَكَوْلُ الله تَعَالَى : «آلة إِنَمَا طبهم عند مر ولك آَحَزهُمْ [ لمن 4 . َعَلة: «قا لكك تمكر» الآية. عَنْ أبي مُرَيْرَةَ ضفن أَنَّ رَسُولَ الله يه كَالَ: «لَا عَذْوّىء وَلَا طِيَرَهَ وَلَا هَامَةَ وَلَا موه أخرجاة. زَادَ مُسْلِمْ: دولا تو ولا قول». وَسُولُ الله ية: «لا عَذوَىء ولا يلير وَيُمْجِبيِي المَألُ» فَانُوا: وَمَا المَأل؟ كَالَ: الكَلِمَةٌ اميد ."},{"id":"talib-alilm-p147","text":"كاب الُؤجيدٍ اي هوق الل على القبيد لل وَلِأبِي دَاوْه بِسَئَوِ صَحِيح: عَنْ عُفْبَة بن عَامِر ذه قَالَ: «ذُكِرَتٍ الظَيِّرَةُ عِنْدَ يُشُولٍ الله يك قَثَالَ: أَحْسَنْهَا المَألُ؛ وَلَا تَرْدُ مُسلماًء فَإِدًا رَآَى أَحَدُكُمْ مَايَكْرٌَهُ؛ٍ وَلَا يَدْمَعُ السَّبَّاتٍ إِلّا آَنْتَء وَلَا حَوْلَ وَلَا ل إِلا بك وَعَنِ أَبْنِ مَسْعُودٍ ذه مَرْفُوعاً : «الظيَرَةُ شِرْكُء الظَيرَةُ شِرْكٌ رَمَا مِنَا إلا وَلَكِنّ الله يذْمِبْهُ ِالتَوَكُلٍ) رَوَاهُ أبُو دَاوَ وَالتَرْمِذِيّ وَصَسحَهُ وبين أنَآِرَهُ مِنْ قَوْلٍ آبْنِ مَسْعُود. وَلِأَحْمَّدَ: مِنْ حَدِيتِ أَبْنٍ عَمْرِو وها: من رَدَنْهُ الطَيَرَة من حَاجيهِ؛ كُقد شرك"},{"id":"talib-alilm-p148","text":"14 'متون طالب العلم كَانُوا: كمَا كَمَارَةُ ذَلِكَ؟ ثَالَ: أنْ تَقُولَ: اللّهُمّ لا حبر إلا حَيرة وَلَا طيِرٌ إِّا يرك وَلَا إِلَهَ غيْرُكَ». وَلّهُ: مِنْ حَدِيثٍ الفَضْل بْنِ عَبَّاسٍ و#ا: «إنَمَا الطَيرَة مَا أَمْضَاكَ أَؤْ رَدكَ. ل اه"},{"id":"talib-alilm-p149","text":"كِتَابُ التُوْجِيدٍ انّذِي هُوَ حَقُ الله عَلَى العَبِيدٍ 14 1] بَابُ ما جَاءَ فِي التّنْجِيم قَالَ البُخَارِيُ فِي «١صَحِيحِه):‏ قَالَ قَتَاكَةُ: 'حَلَقَ اللَّهُ هَذِِ النُجُومَ لِعَاثِ: زِيئةُ لِلسّمَاى وَرُجُوماً لِلشَّيَاطِينِء وَعَلَاَاتٍ يُهْتَدَى بِهَاء كَمَنْ تَأَوّلَ فِيهًا غَيْرَ دَلِكَ؛ أخطأء وَأْضَعَ نَصِيبَهُ وَتكَلّت مَا لا عِلْمَ لَهُ بها انْتهَى . وَكَرِءَ قَتَادَةُ: تَعَلَمَ مَنَازِلٍ المّمَرِ وَلَمْ وَرَخصٌ فِي تَعَلُّم المَّنَازِلٍ: أَخْمَثُ وَإِسْحَاقُ ."},{"id":"talib-alilm-p150","text":"14 متون طالب العلم وَعَنْ أبي مُوسَى يه قَالَ: قَالَ رَسُولُ اللَّه يكِةِ: «مَلَانَةٌ لا يَدْخُلُونَ الجن : مُدْيِنُ الكَمْرِء وَتَاطِعٌ الرّحِمء وَمُصَدَّقُ بالسَخر رَوَاُ أَحْمَثُ وَآَبْنُ حِبَّانَ في الصحيجوا . 5-75"},{"id":"talib-alilm-p151","text":"كِتَابُ التُْجِيدٍ الَذِي هُوَ حَق الله عَلَى العَبيدٍ هنا إلغياا بَابُ ما جَاءَ فِي الأسْتِسْفَاءِ بِالأَنْوَاءِ وَكَوْلُ الله تَعَالَى : طمَيملْنَ نفك م ك4 . عَنْ أبي مَالِكِ الأَضْمَرِي طك أن رَسُوَلَ الله كله َال «أربَعْ في أَمْين مِنْ أمر الجَاجِلِيّةٍ َا يثْرْكُونَهُنَ : المَخْرٌ بالأَخْسّاب» وَالطََّمْنُ ني الأنْسَابٍء وَالِسْتِسْقَاءُ بالنجُوم» وَالنَيَاحَةٌ وَكَالَ: النَّائِحَةٌ إِذَا لَمْ نَعْبْ قَبْلَ مَوْتَهَا؛ تُقَامُ يَوْمَ القِيَامَةٍ وَعَلَيْهَا سِرْيَالٌ مِنْ قَطِرَانِء وَدِرْعٌ مِنْ جَرّب» رَوَاهُ مُسْلمْ . وَلَهُمَا: عَنْ رَيْدِ بْنِ خَالِدٍ ضيه قَالَ: «صَلَّى لَنَا وَسُولُ الله يك صَلَاةَ الصُبْح"},{"id":"talib-alilm-p152","text":"لقا امتون طالب العلم اَي عَلَى إِثْرسَمَاءٍ كانت من اليل فلم أَنصَرَف؛ أفْبلَ عَلَى النّاسء كَقَالَ: هَلْ تَذْرُونَ مَاذًا قَالَ رَبكُم؟! قَانُوا: الله وَرَسُولَهُ أَعلم. قَالَ: ثَالَ: أَصْبَّحَ مِن عِبَادِي مُؤْمِنُ بي وَكَافِرٌ: َأَمّا مَنْ كَالَ: مُطِرْنًا بِفَضْلٍ الل وَرَحْمَه؛ وَأَمَا مَنْ َالَ: مُطِرْنَا بِنَوْءِ كذ وَكَذَاء وَلَهُما: مِنْ حَدِيتٍ أَبْنٍ عَبَّاسٍ ا: مَعْنَاه) وَفِيهِ: «قَالَ بَعْضْهُمْ : لَقَدْ صَدَقَ نَْءٌ كَذَا وَكَذَاء كَأَنْرَلَ اللَّهُهَذِه الآيَه: «قلآ أَنِيم بمؤقع الشُخرر » إِلَى قله : «تَكذوْ14."},{"id":"talib-alilm-p153","text":"تاب المؤجيدٍ الي هو حَقُ الله على القبيدٍ لكل 1 بَابُ قَوْلٍ الله تَعَالَى: «ومِرح ألنَاسِ من يَتَحِدٌ مِن دون أله أَنَدَامًا ْله : طقل إن كه مابلا تائم » إلى قَوْلِِ : «لَحبّ إإتحكم ين لله ورَْولد 4 الآية. عَنْ أنّس ذف أَنَّ رَسُولَ اللَّهِ يله َالَ: الأتزية اعت حش أكرة اعت الندسة وَلَدِِء وَوَالِدِ وَالنَّاسٍ أَجْمَعِينَ أَخْرّجَاهُ. وَلَهُمَا : عَنْهُ ضيه قَالَ: كَالَ رَسُولُ اللّد علة : اتَكَاثٌ مَنْ كُنّ فِبه؛ وَجَدَ حَلَارَةً الإيمان: أَنْ يَكُونَ النّهُ وَرسُونُهُ حب إِلَيْهِ ما سِوَاهُمًا ."},{"id":"talib-alilm-p154","text":"1 متون طالب العلع وَأَنْ يْحِبّ المزء لا بْحِبْهإِلّا للَِّ. وَأَنْ يَكْرَه أَنْ يَعُودَ فِي الكُفْرٍ بَعْدَ إِذ أنْقَدَهُ الله مِنّهُء كَمَا يَكْرّهُ آَنْ قف فِي الثّار. وَفِي رَايَةِ: «لَا يَجدُ أَحَدْ حَلَارَة الإيمّان حَنّى ...2 إِلَى آخِرو. عن أَئْنِ عَبّاسٍ يا قَالَ: من أَحَبٌ في اللو وَأبْحَضَ فِي اللّهمِرَرَالَى في الل وَعَادَى فِي اللَّ؛ مَإنَمَاتَُالُ وَلَايَةُ اللو بدَلِكَ نيد عبد هم الإيمَان- وَإن كْرث صَلاهُ وَصَوْمُهُ ‏ حَبَّى يَكُونَ كَذَّلِكَء وَقَدْ صَارَثْ عَامَةٌ مُوَاحَاةٍ النّاس عَلَى أَمْرٍ الدُنْيّاء وَدَلِكَ لا يُجْدِي َلَى أهْلِ َي روَا أن جحرير . وََالَ آبْنُ عَبّاسٍ في قَوْلِه: «لإوَبعطمَتَ بهم الْقَسْبَاثُ» ؛ قَالَ: المَوَدَها ."},{"id":"talib-alilm-p155","text":"كِتَابُ التُؤجيدٍ الذي هُوَ حَقُ الله على العَبيدٍ 6 إاففيذا بَابُ قَوْلٍ الله تَعَالَى: جإثنا كيك المَبطنُ بوث زليه كا حَاْهُمْ افون إن كت مُؤميَ» وَكَوْلُْهُ: طإِتمَا بتر سيد لله من تأت أنه وَئْْوَرِ الْآِرِ َنم لزه مان التسكرة إلا ك4 الآية. َقَوْلهُ : لون الاين مَن يَُولُ “امكا يله وق في لله جَعَلَ فِتَنَةَ الاين كَمَدَابِ للد الآية. عَنْ أبي سَعِيدٍ ذه مَرْفُوعاً: (إنَّ مِنْ صَعْفٍ البَقِينِ: أَنْ ثُرْضِيَ النّاسَ بِسَخْطِ اللو وَأَنْ تَحْمّدَهُمْ عَلَى رِرْقٍ اللو وَأَنْ تَذْمَهُمْ"},{"id":"talib-alilm-p156","text":"164 متون طالب العلع عَلَى مَا لَمْ يُْتِكَ الله إِنَّ ِرْقَ الله لا يَحُرُهُ حِرْصُ حَرِيص » وَلَا يَرُدهُ كَرَاهِيَةٌ كارِوا. وَعَنْ عَائِمَةَ دنا أَنَّ رَسُولَ الله بل ثَالَ: امن آلْتَمَسى رضًا اللو بسك الئاس رُضِيَ الله قنك زارط قله انايو 00000 وَعنَ الكش رضًا الكاس ِشَكظ الله مكف الله علد وَاشكظ عليه اانه 155 أَبْنُ جِبَّانَ ني ١صَحِيجِوا‏ . و واي"},{"id":"talib-alilm-p157","text":"اننا بَابُ قَوْلٍ اللّهِ كل: لعل مه متكا إن كُمْر مُوْمِيِين» وَكَوْلْهُ: طِإنَمَا المَؤْبئب الْذِينَ دا ذكرٌ أمّه يلت و4 الآية. َكَوْلْهُ: «كايها لين َنب آنه وين اَمَك من وََوة: «ؤوت يتك عل له مهو حنة:. عَنِ آَبْنِ عَبَّاسٍ وها قَالَ: «طحَسَبْنَا لَه وَهْمَ لتحيل ؛ فَالَهَا إنْرَاجِيمْ يله جِيِنَ لْقِيَ فِي الَارِ وَكَالَهَا مُحَمَّدٌ يل جين الوا :لاإ لاس كد جَمَمُا لك كترم َرَادَهُمَ إِيسَمًا» الآيَةَ) رَوَاهُ البُخَارِي . ةج ا« اله"},{"id":"talib-alilm-p158","text":"لذلا متون طالب العلم إقايةا بَابُ قَوْلٍ اللَّهِ تَعَالَى: «أقَأمِا مَِكرٌ لَه قلا ين مَك رَ أله إلا الوم الْكَيسُون» وول :قال وس يقتلي تعمد ريده إلا م رده الصاوت »> . عَنٍ أَبْنِ عباس وِا: «أَنَوَسُولَ اللو يق سْيِلَ عَنٍ الكَبَائِرٍ؟ فَقَالَ: الشَّرْكُ بالل وَاليَأْسُ مِنْ رَوْح الل وَالأَمْنُ مِنْ مَكْرٍ اللا . وَعَنٍ أَبْنِ مَسْعُودٍ مَل َالَ: «أكبَرُ البَائِر: الإِشْرَاكُ بالل وَالأَمْنُ مِنْ مَكْرٍ الل وَالقنُوظ من رَحْمَةٍ الل اليس مِنْ رَوْح اللّوا رَوَاُ عَبْدُ اراق نا الت انه"},{"id":"talib-alilm-p159","text":"تا وجيب اندي هوَحَقُ اله على القبيد ا 1 بَابُ مِنَ الإيمَانٍ باللّه الصَبْرُ عَنَى أَقْدَارٍ الله ْله تَعالى : «وعك يمن يلل يبد بذ . قَالَ عَلْقَمَةُ: «هُوَ الرَجْلُ تُصِيبهُ المُصِيبَة: يلم أَنّهَا منْ عِنْدِ الله كيرضَى وَيُسَلَمُ. أن ول اللَّدِ كله قَالَ: «نْئَتَانِ فِي الناسٍ هُمَا بِهِمْ كُفْرٌ: الطَمْنُ فِي النَّسَبٍِء وَالنَيَاحَةٌ عَلَى المَيّْتكه. وَلَهُمَا: عَنِ أَبْنِ مَسْعُودٍ ذه مَرْفُوعاً: «لَيْس مِنا مَنْ صَرَّبَ الخُدُودَء وَسَقَّ اليو ودع يَعْوَى الجاهكق»."},{"id":"talib-alilm-p160","text":"وَعَنْ أنّس ذف أَنَّ رَسُولَ الله يكل َالَ: «إذًا أَرَادَ الله بِعَبْدِهِ الكَيْرَِ عَجَلَ لَهُ العُقُوبََ فق الدكا: وَإذا أَرَاةيَعبِدَة الشرء أنسك نه بدلبوة وَقَالَ النَبِي يله: «إنَّ عِظمَ الجَرَاءِ مَعّ عِطُم البلاء. وَإِنَّ الله تَعَالَى ذا أَحَبّ قَؤْماً آَبْتَلَاهُمْ: كُمَنْ رَضِيَ كَلَهُ الرَضَاء وَمَنْ سَخْط كَلَهُ الشُخْظ) حَسَنَهُ التَرْمِذِيُ. واشاث"},{"id":"talib-alilm-p161","text":"كِتَابُ التُوْجِيدٍ انّذِي هُوَ حَقُ الله عَلَى العَبِيدٍ لل لهذا بَابُ ما جَاءَ فِي الرٌيَاءِ َقَولْهُ تَعَالَى : طثُل إِتَمآ أنا بر يلكا بح د أنَآ تمك إِلَهُ مد الآية. عَنْ أبي مُرَيْرَءَ ذه أن وَسُولَ الله يلل كَالَ: «قَالَ اللَّهُ تَعَالَى : أن أَغْنَى الشُرَكَاء عَن الشَّرْكِء مَنْ عَمِلَ عَمَلاً أَشْرَكٌ فِيهِ مَعِي غَيْرِي ؛ تَرَكْنهُ وَشِرْكُه) رَوَاهُ مُسْلِم. وَعَنْ أبي سَمِيِدٍ ذه مَرْقُوعاً: لأا المَسِيح الدَّجََالِ؟ قُلْنَا: بَلَىء قَالَ: الشّرْكُ لِمَا يَرَى مِنْ نَظَرِ رَجُلٍ -» رَوَاهُ أَحْمَدُ."},{"id":"talib-alilm-p162","text":"1 متون طالب العلع إففاا بَابُ من الشّوّك إِرَادَةُ الإنْسَانِ بِعَمَلِهِ الدّئْيًا وَكَوْلُهُ تَعَالَى : «ص كن برِيدُ الكيّرة آلديا ينبا نوْقِ إِلتوم َمَسَلَهُمَ فيا الآيتيْنِ . فِي الصّحيح: عَنْ أبي مُرَيْرَةَ فك قَالَ: قال رَسْولُ للد ل: «تَيِسَ عَيْدُ الديَارِء تصن عَبْدُ الدّرْمَمء تَعِسٌ عَبْدُ الكَمِيصَةٍ تَعِسَ عَبْدُ الخَمِيلَة إِنْ أغطي رَضِيَء وَإِنْ لَمْ يفط سخ الل أَشْعَتَ رَأْسُهُ مُفْبَرَةِ كَدَمَاهُ إِنْ كَانَ ني"},{"id":"talib-alilm-p163","text":"نب لويد الي هو حو اله على القريد ا الحِرَاسَةٍ كَانَ فِي الحِرَاسَةٍء وَإِنْ كان بي السَّائَةٍ كان ني السَّاكَق إن أسْتأدنَ لم يُؤْدَنْ واحاث"},{"id":"talib-alilm-p164","text":"ذا متون طالب العلم اليا بَابُ مَنْ أَضَاعٌ العُلَمَاءٌ وَالّمَوَاءَ فِي تخريم ما أَحَلَّ الله وَتَحْلِيلٍ مَا حَرٌمَهُ؛ هَمَدِ أتَحَدَهُمْ أزبَابا وَقَالَ آَئْنُ عَبّاسِ و#ها: ايُوشِكُ أنْ تَنْزِلَ عَلَيْكُم حِجَارَةٌ مِنَّالْسَّمَاى أكُولٌ: كال رَسُولُ اللَّهِ كه وَتَقُولُونَ: كَالَ أَبُو بَكْرٍ وَعْمَر!). 1 وَقَالَ أخمةبنُ خنبل: هَعَحِبِتُ لِقؤم عَرَقُوا الإشئا وَصِسَمَهُ يَذْمَبُونَ إلى رَأي سُفْيَان وَاللَهُ تعالَى يَقُولُ: طَلِيَسْدَرِ أن يحَالِمُونَ عَنْ مرو أن ضُِِمْ ِنْنده الآيَقّ"},{"id":"talib-alilm-p165","text":"كِتَابُ التُوْجِيدٍ انّذِي هُوَ حَقُ الله عَلَى العَبِيدٍ ين َتَدْرِي مَا الفِثْتُ؟ الفِئئَةُ: الضَرْك؛ لَعَلَّه إذَا وَدَ نض كؤل أذ َع في كليو قي؛ من الأنغ؛ كَيَفْلِكَ2. عَنْ عَدِي بن حاتم وله : اأَنهْسَمِعَ النَبِيَ ل يَفْرَأ هَذِهِ الآيَه: «اتسذنا مسارم وَرْمَتَهُمْ أربابا ين ذو ألَهِ4 الآيَة فَقُلْتُ لَهُ: إِنَا لَسْنا تَعبُدُهُمْء قَالَ: أَلَيِْسَ يُحَرّمُونَ مَا أَحَلَ اللّهُ تَمُحَرّمُوئَهُ؛ وَيُحِلُونَ مَا حَرَّم اللّهُ مُحِنُوَه؟ فَقْلْتُ : بَلَى» قَالَ: كيلك عِبَاتهُم رَوَاهُ أَحْمَدُ وَالتَْمِذِيُ وَحَسَّنهُ. جات نه"},{"id":"talib-alilm-p166","text":"للق متون طالب العلم 1 بَابُ قَوْلٍ الله تَعَانَى: د ل توم لعي تدوع عو 4 ألم تر إِكَ لد بَرْعْمُونَ أنَهُم اموأ يمآ أَنزِلٌ لَك وَمآ أل ين مَك يردُودَ آن يتَسَاكَمُأ إلى لطت َك ركيد الايات وَمَوْلَُهُ: «رَدا يِلَ لَهُمَ لا تُنْيِدُوا في الأَنضٍ َاوأ مان مُصيخورت » . وَكَوْلُة: طلا دوا في الس يقد إِصْلّحِهًا)» . وَكَوْله: اندم لهي يود من سن هن أله حَكنا لِتَوَو ونون . عَنْ عَبْد اللُوِبْنٍ عَمْرر كنا أن رَسُولَ الله كل كَالَ: «لَا يُؤْمِنُ أَحَدُكُمْ حَنّى"},{"id":"talib-alilm-p167","text":"يَكُونَ مَوَاهُ عا لِمَا جنتُ بو' قَالَ النَوَِي: ١حَدِيتٌ‏ صَحِيحٌ رُوينَاهُ في كِتَابٍ الحُجَّةٍ بِإِسْنَادٍ صَحيج\". وَقَالَ المَّعْبِيُ: «كَانَ بَيْنَ رَجْلٍ مِنّ المُنَافِقِينَ وَرَجُلٍ مِنَ اليَهُودِ خُصُومَةٌ فَقَالَ الِيَهُودِيُ: نَتَحَاكُمْ إِلَى مُحَمَّدٍ ‏ عَرَفَ أَنهُ لا يَأَخُذُ الرَشْوَ -. وَكَالَ المَُافِقُ : نَتَحَاكُمْ إلى اليَهُودٍ - لِعلْمِهِ أنْهُمْ يأْخُدُونَ الرضْوَة -. كَاتَّمَهَا عَلَى أَنْ يَأْتِيَا كاهداً فِي جُهَيْئَة؛ َيَتَحَاكَمًا إِلَيْهِ؛ِ مَنَرَلَثْ: «آمّ كر يِل ارت ُو نهم منوأ يمآ إليْكَ)4 الآيقه."},{"id":"talib-alilm-p168","text":"0 3-3-0-0 #فوسسيصيم وَقِيلَ: انَرَلَتْ فِي رَجُلَيْنِ أَخْتَصَمَاء فَقَالَ أَحَدُهُمًا: نَتَرَاَعُإِلَى النَّبِيْ يل وَثَالَ الآحَرُ: إلى كغب إن الأشرّفٍ. ُمَ تَرَاقَمَا إلى عُمَرَ وه كَذَكَرَ لَهُ أَحَدُهُمَا القِصّةء كَمَالَ لي لَمْ يَرْض برَسْولٍ اللَّد كه أَكَدَبِكَ؟! قَالَ: نَعَمْء قَصَرَبَهُ بالسَّيْفٍ؛ٍ 5-5"},{"id":"talib-alilm-p169","text":"كِتَابُ التوْجِيدٍ الي هُوَ حقٌ الله على اليب 1 141 بَابُ مَنْ جَحَدَ شَيْئاً مِنَّ الأسْمَاءٍ وَالضَفَات وَمَوْلُ الله وك : «وَهم يَكَثرُونَ اليم » الآية. فِي ١صَحِيح‏ ع رِي\": عَنْ عَلِيّ 5-5 كَالَ: «حَدَتُوا النَّامنَ بِمَا يَعْرقُونَء أَتْرِيدُونَ أَنْ تكذعايلة شر وَرَوَى عَبْدُ الرَرَاقِ: عَنْ مَعْمَّرِء عَنِ َبْنٍ طَاوُوسٍ» عَنْ أبيد» عَنٍ أَبْنِ عَبّاسٍ وها : 'أنّهُ َأى رَجُلاً آنْمقَضٌ لَمّا سَمِعَ حَدِيئاً عَنٍ النّبيّ بل في الصَّفَاتِ؛ اسْيِنْكاراً لِذَلِكَ َقَالَ: ما قَرَقُ هَوْلَاءِ؟ يَجِدُونَ رِنَّهَ عِنْدَ"},{"id":"talib-alilm-p170","text":"نذا متون طالب العلم مُحْكمِدء وَيَفْلِكُونَ عِنْدَ مُتَشَابهد أْتَّهَى . وَلَمّا سَعِعَتْ قُرَيشلُ رَسُولَ اللو كله يَذْكُرٌ الرَّحْمَنَ؛ أَنْكَرُوا دَلِكَ؛ٍ كَأَنْرَلَ اللّهُ فِيهِم: «وَهم يَكْْروتَ أليَمن» . وات"},{"id":"talib-alilm-p171","text":"141 بَابُ قَوْلٍ اللّهِ كل: لِبِتْروْنَ يِنْمَتَ لله ثرّ و4 َالَ مُجَاجِدٌ ما مَعنَاُ: «مُوَ َوْلُ الرَجُلٍ : هَذَا مالي» وَل عن آباني. ْ وَكَالَ عَوْنَ بْن عَبْدِ اللّه: «يَقُولُونَ: لَوْلا لَان؛ لَمْ يَكُنْ كَذَاه. وَقَالَ آْنْ مُتَِبَة: «يَقُوُونَ: هَذَا يَمَاعَةٍ آلِهَينَا' . ا وََالَ أبُو العَبّاسٍ ‏ بَعْدَ حَدِيثِ رَيْدِ بْنِ حَالِدٍ ليه الَّذِي فِيهِ: «إنَّ الله َعَالَى كَال: أَصْبَحٌ مِنْ عِبَادِي مُوْمِنٌ بي وَكَافِرٌ ....» 000\" أ« الس الذشعية. ضلال نادي إخوان من عبل.العرى مع الات"},{"id":"talib-alilm-p172","text":"02 متون طالب العلم الحَدِيتٌء وَقَدْ تَقَدَّمَ -: «رَمَذَا كَثِيرٌ في الكِتَابٍ وَالسُِّنّة يَذّّ سْبْحَائَهُ مَنْ يُضِيكُ إِنْعَامَهُ إِلَى غَيْرِِ وَيُشْرِكُ بِه. قَالَ بَعْض السَّلَفٍ: هُوَ كَنَولِهِمْ : كَانَتٍ الرّيح طيَبَةَ وَالمَلاحح حَاذقا». وَنَشْرُ ذا مما هُوَ جَارٍ علَى أل كير . عت"},{"id":"talib-alilm-p173","text":"كاب الُؤجيدٍ اي هوق الل على القبيد قل إلذةا بَابُ قَوْلٍ اللَّهِ تَعَانَى: «كلا يْصَنوا يه داه وَأتُ تتتئوت » قَالَ أَبْنُ عَبّاسِ كنا فِي الآيَةِ: «الأَنْدَاةُ: هُوَ الشّرْكُء أَخْمّى ِن دَبِيبٍ التَملٍ عَلَى صََاةٍ سَوْدَاءَ فِي ظُلْمَةٍ اللَيلِ وَهْوَ آذ تَقُولَ؛ وَاللَّ وَحََاتِكِ يَا فلانة وَحَبّاتِي . وَتَقُوَْ: لَوْلَا كله هَذَا لَأثانَا الْضرصٌ» وَلَوْكَا الب في الدّارٍ لَأنَى اللُصُوصٌ . وَقَوْلُ الرَّجُْل لِصَاحِيهِ : ما شَاءَ الله وَشِفْتَ. َقَوْلُ البَجُل : لَوْلَا الله وَفْكَانٌ لا تَجِعَل هَذًَا كله به شِرْكُ) رَوَاهُ أَبْنُ أبي حَاتِم ."},{"id":"talib-alilm-p174","text":"لفن متون طالب العلم وَعَنْ تَُمَرَبْنٍ الخَطّابٍ طَلكِ أَنَّ رَسُولَ اللَّهِ يل ثَالَ: «مَنْ حَلّفَ بَِبْرٍ اللو كَقَدْ كَمَرَ أؤ أَشْرَكَ؛ رَوَاهُ التَرْمِذِئُ وَحَسَّئَكُ وَصحََحَهُ الحَاكِم . وَكَالَ نْنُ مَسْعُودٍ ضَلِك : «لأنْ أخلف بالل كاذباًء أحَبٌ إِلَيّ مِنْ أن أخليف بِمَيْرِهِ صَادقاً . وَعَنْ حُدَيِمَةَ منه عَنِ النَِيَ َل قَالَ: ملا تفقوتو نا قا الله وشا فلن ولق نُونُوا: مَا ضَاءَ الله ثُمَّ شَاء كُلَانُ رَيَاه َبُو دَاوْدَ بسَئدٍ صَحِيح . الرَّجُلٌ: أَعُودُ بالله وَبِكَ."},{"id":"talib-alilm-p175","text":"كِتَابُ التُوْجِيدٍ انّذِي هُوَ حَقُ الله عَلَى العَبِيدٍ ييل يد أذ يَُولَ: بالل ف بلك . وَلَا تَقُونُوا : لَوْلَا اللَّهُ وَمُلانُ» واشاث"},{"id":"talib-alilm-p176","text":"نكل متون طالب العلم [1] بَابُ عَنِ أَبْنِ عُمَرَ وها أَنَّ وَسُولَ اللَّه يل قَالَ: ١لا‏ تَْلِفُوا بآبَائكُم مَنْ حَلَف بالل لْيَضدُق. وَمَنْ لف لَهُ الله نَلْيَرَْضَء وَمَنْ لَمْ يَرْضَ لس ِنَ اللا رَوَاه ُْ مَاجه بسن حَسَنٍ . 00"},{"id":"talib-alilm-p177","text":"تاب وجيب الي هو حَقُ الله على القبي 06 ]44 بَابُ قَوْلٍ: ما شَاءَ اللّهُ وَشِنْتَ قَقَالَ: ِنَكُمْ تُشْرِكُونَ؛ تَقُولُونَ: مَاضَاءً اللَّهُ وَشِنْت وَتقُولُونَ: وَالكغية. َأَمَرَهُمْ التّيْ بك دا أَرَادُوا أَنْ يَحْلِقُوا أن يَقُولُوا: وَرَبّ الكَعْبّق وَأَنْ يَقُونُوا: مَاشَاءَ الله ثم شِنْتَ) رَوَاهُ النّسَائِيُ وَصَحْحَهُ . رَجُلاَ كَالَ لِلبِيَ يكه: مَا شَاء اللَّهُ وَهِنْكَ كَمَالَ: أَجَعَلتَنِي لَِّ ناً؟! قُلْ: ما َاء الله وَحْدَه."},{"id":"talib-alilm-p178","text":"هن متون طالب العلم وَلِأَبْنِ مَاجَهُ: عَنِ الطمَيْلٍ طله - أَخِي عَائِفَةَ كينا مها َال : «رَأَيْتْ كأني أََيتُ عَلَى تَفَرِمِنَ الِيَهُووء فَقُلْتُ: إِنَكُمْ أَنتُمْ القَزمُ لَؤلا أَنَكُمْ َقُولُونَ: عُرَيرٌ آبْنُ اللّه. قَانُوا: وَأنكمُ القَوْمُ لَوْلا أَنَكُمْ تَقُولُونَ: ا شاء الله وكناء: ميحمك» ُمّ مَرَرْتُ بتَفَرِ من الَصَارَى ‏ َقُلْتُ: إِنَكُمْ أنْثُمْ المَوْمُ لَوْلَا أَنَكُمْ تَقُونُونَ: المَسِيحُ أَبْنُ الله . ما شَاءَ اللّهُ وَقَاءَ مُحَمَد: كلكا أتنتضت» اأخترت بات أخرخه:"},{"id":"talib-alilm-p179","text":"تاب اميد الذي هو حَقُ الله على القبي كل أَخْبَرْتَ بها أحدا؟ قُلتُ: نَعَمْ. قَالَ: نَحَمِدَ الله وَأَنْنَى عَلَيْو ثُمَّ قَالَ: ما بعد كَإِنَّ ميلا رَأَى رُؤيَا حبر ِهَا مَنْ ذا وكذا ني أَنْهَاكُمْ عَنْهَا؛ كلا تَقُولُوا: ما نَاء الله وَسَاء نصكدذه» وَلكَن قولوا: ما شاء ا 07 واجداي"},{"id":"talib-alilm-p180","text":"ذا امتون طالب العلم [4] بَابُ مَنّ َب الدّهن هَمَد آذَى الله وَهَوْلُ اللَّه: «وواثوا ما من إِلَا جام لديا ثرت وَعبَاونَا يييكا إَِا تهرك الآية. أَبِنُ آدم: يَسْبُ الدّهْرّء وَأنَا الدّهْرُ أَكَلْبُ اللَيْلَ وَالنَهَارَ . وَفِي رِوَاية: ١لا‏ تَسْبُوا الدّهرَ؛ كَإنَّ الله هُوَ الدَّهْرٌ. الله ان"},{"id":"talib-alilm-p181","text":"4] بَابُ التّسَمْي بِقَاضِي القّضَاةٍ وَنَحُوهِ فِي الصّحِيح: عَنْ أبي هْرَئْرَة ذه عَنٍِ النَبِي ل قَالَ: «إِنَّ اكت أتورئنة اللي جل يُنَمّى مَلِكَالألَاكِ؛ لَا مَالِكَ له الله قَالَ سْفْيَانُ: «مِثلٌ: شَاهَانْ شَاه. دَفِي رِوَايَةٍ: «أَمْيَط رَجْلٍ عَلَى اللَّهِ يَْمَ القيامق وََخْنه . اي"},{"id":"talib-alilm-p182","text":"1 متون طالب العلع إفذاا بَابُ َختِرَام أَسْمَاء الله تَعَانَى؛ عَنْ أبي شرَنْح ذه : أَنّهُ كان يُكْنَى أبَا الحكى كَقَالَ لَهُ النّبِْ له : ضَ اكلةفه الحَكُمُ وَإلَيْهِ الحُكُمٌُ» كََالَ: إِنَّ كَوْمِي إدًا قَرَضِيَ كلا المَرِيِقَيْنِ قَقَالَ: ما أخسّنَّ هَذَا! كما لَّكَ مِنَ الوَلَدِ؟ ثُلْتُ: شُرَيِحُ وَمُسْلِمٌ وَعَبْدُ اللو قَالَ: كَمَنْ أَكْبَرُهُمْ؟ قُلْتُ: شْرَنِح' كَالَ: كَأنت أَبُو شُرَيْح' رَوَاه أبُو اود وَغَيْرهُ. وان"},{"id":"talib-alilm-p183","text":"كِتَابُ التُوْجِيدٍ انّذِي هُوَ حَقُ الله عَلَى العَبِيدٍ لتلا 441 ] بَابُ أو القّزآنِء أو الرّسُولٍ وَقَوْلُ اللَّوتَعَالَى : وكين حالتهز لبوك ِتمَا حتثنً عَوْسُ َكب ل لأ ولليو. ورَشُويد. كر تنتبرئُون» لا سكووأ كترم تند بي » . عن بن مر هه وَنْحَمْد بْنِ كفب» َي بْنِ أَسْلَمَ وَكاهة ‏ دكَلَ حَدِيثْ بَنضِهمْ فِي بَعْض -: (أَنَهُ قَالَ وجل في غَرْوَةِ تَبُوك: ما َال ايا هَؤْلَاء؛ أَرْحْبَ بظوناء وك أكذَّبَ أَلْسْناًء وَلَا أَجْبنَ عِنْدَ اللّقَاءِ ‏ يَْنِي: وَشَوْلَ اللراكل وَأضْكابَةُ القراءت:"},{"id":"talib-alilm-p184","text":".تخ _طف.'.-1-._«ن-. ‏ مُنَافِقُء لأخبرَن رَسُولَ الله كله» كَذَّمَبَ عَوْفٌ إِلَى رَسُولٍ الله كل لِيُخْبِرَهُ فَوَجَدَ القَرْآنَ كَدْ سَبَقَهُ. نَجَاءَ دَلِكَ الرَّجُلْ إلى رَسُولٍ الل كله وَكَدِ َرْتَحَلَ وَرَْبَ نَاقَتَهُ كَقَالَ: يا رَسُولَ اللَّوا بِيِسْعَةِ نَاقَةِ رَسُولٍ اللَّهِ يك وَإِنّ الحجَارَةَ َتَلسثُ4» فَيَقُولُ لَهُ رَسْولُ الله قه: «بَائ وي وَرَسوله. كُثْر تبون ؛ مَا يَلْعَفِتُ إِلَيْه وَمَا يَزِيدهُ علَيْوه . جات نه"},{"id":"talib-alilm-p185","text":"إلخذا بَابُ ما جَاءَ فِي قَوْلٍ اللّه تَعَالَى: «وَلَنَ أَدَضَهُ مََمَةٌ سنا مِنْ بد صَرَّهُ مَسَنَهُ لَبَقُولنَ عدا لي» الآية قَالَ مجَاهِدٌ : «هَذَا بِعَمَلِيء وَأَنَا مَحْقُوقٌ بوا. َكَل أن عباس : يريد : من عنيِي».. َكَل : ل إِننَآ أنه ل مذ» . قَالَ ََادَةُ: «عَلَى عِلْم مِنْي بِوُجُوهِ المَكايِب». وَكَالَآحَرُونَ : عَلَى عِلْم مِنَّ اللَّوأني لَهُأَهْل». وَهَذَا مَعْنَى كَوْلٍ مُجَاهِدٍ: «أوتِيتُهُ عَلَى شَرَفك وَعَنْ أبي هُرَئْرَةَ له : أَنَّهُ سَهِعَ"},{"id":"talib-alilm-p186","text":"144 متون طالب العلم رَسُولَ الله يله يَقُولُ: «إنَّكَكَانَةٌ مِنْ بنِي إِسْرَائِيلَ: أَبْرَصٌء وَأفْرَعَ» وَأَغمَّى. فَأَرَادَ كَدْ كَذِرَنِي النَّاسسُ. كَالَ: كَمَسَحَهُ كَذَهَبَ عَنْهُ كَذَوُهُ وَأغطي لَوناً حَسّناً وَجِلْداً حَسَناًء كَالَ: كَأَيّ المَالٍ أَحَبٌ إِلَيْكَ؟ قَالَ: الإيلُ أو البَمَرٌ ‏ مَك إِسْحَاقُ . تأُغطِي نَاقَةُ ُشَرَاء وَقَالَ: بَارَكَ اللّهُ لَك فِيهًا . كَالَ: كأتى الأفْرَعَء كَقَالَ: أي شَيْءٍ أَحَبُ ِلَِْكَ؟ قَالَ: سَعْرٌ حَسَنْء وَيَذْمَبُ عَنّي الَّذِي كَدْ كَذِرَنِي النَّاسُ."},{"id":"talib-alilm-p187","text":"كِتَابُ التُوْجِيدٍ الَذِي هُوَ حَق الله عَلَى العَبِيدٍ لد تقطن كتفت عن زأديان شير ل ل اا البَقرُ أو الإبل. كأَغطِي بَقَرَهَ حايلاً» وَكَالَ: بَارَكَ اللّهُ لَك فِيها . قَالَ: كأتى الأَعمّى: كَقَالَ: أي شَيْءٍ أحَبُ إِلَنِكَ؟ ثَالَ: أنْ يَرْدٌ اللّهُ إِلَيّ بَصَرِيء كَالَ: كَمَسَحَهُ كَرَدٌ الله إِليِْ َصَرَهُ كَالَ: َأَيْ المَالٍ أحَبٌ إِلَيِكَ؟ قَالَ: العم . تأغطي كا وَالِدا: كَأنْتَجَ هَذَانِء وَوَلَدَ مَذَا؛ كَكَانَ لِهَذَا وَادِ مِنَ الإيلء وَلِهَذَا وَاِمِنَ البَمَرِ وَلِهَذَا وَادِمِنَ"},{"id":"talib-alilm-p188","text":"1 متون طالب العلع كال: ثم إن أت الأنرّسئ فى وريه الحبَالُ فِي سَفَرِي؛ لا بلاغ لِي الوم إلا بالل نم بكء أَسْأَنّكَ بانَّذِي أغطَاك اللّوْنَ الحَسَّنّء وَالجِلْدَ الحَسَنَّ» وَالمَالَ بَعِيراً َِبلمْ به في سَفْرِي» كال : الحُقُوقُ كبيرة. كَقَالَ لَهُ: كَأَنّي أَغْرِقُكٌ! أَلْمْ تَكُنْ أَبْرَصٌَ يَقدَرّكٌ النَّامنُّ؛ كَقِيراً كَأَعْطَاكٌ اللّهُ؟! كَقَالَ: إِنّمَا وَرِنْتُ هَذَا المَالَ كابراً عَنْ كابرء كَقَالَ: إِنْ كُنْتَ كاذباً؛ تَصَيّرَكَ اللّهُ إلى كَالَ: وَأَنَى الأثْرَعَ ِي صُورَتَهِ وَمَبْكَيِ كَقَالَ لَهُ مِدْلَ مَا ثَالَ لِهَدَاء وَرَدَّ عَلَيْهِ مِنْلَ مَا"},{"id":"talib-alilm-p189","text":"كناب التُؤجيدٍ الي هُوَ حَقُ الله على العَبيدٍ ا رَدّ عَلَْهِ هَذَا كَقَالَ: إِنْ كُنْتَ كاذباً؛ مَصَيرَكَ اللّهُ إلى ما كُنْتٌ . قَالَ: وَأَتَى الأغمى فِي صُورَتِه وَهَيْكيه قَالَ: رَجُلٌ سكين وَآبْنُ سيل اقم بي الجبَال فِي سَمَرِي؛ لا بلع لِي البَوم إلا الله نم بك» أَسأنك بِالّذِي ره عَلَنِكَ بَصَرََء ا نبل ا في سَفرِي . كقال» كلذ قنك أقتبى كر :الله إلى لَا أَجْهَدُكَ اليَوْمَ ِشَيْءٍ أَكَذَْهُ لِلّ. َقَالَ: نيك مَالَكَ؛ كَإِنّمَا أنَِْيتمْ؛ كَقَدْ رْضِيّ عَذْكَ وَسْخظ عَلَى صَاحِبَيْكَ) أُخْرَجَاهُ. د ب نا"},{"id":"talib-alilm-p190","text":"سل متون طالب العلع 61 بَابُ قَوْلٍ الله تَعَالَى: المآ ءَاتنهُمَا صِِسًا جَعَلَا ل شرك يمآ اهما الآية َال أَبْنُ حَزْم : «أتََقُوا عَلَى نَْرِيم كل شم مُعبدِ ِعَْرِ اللو؛ كَمَبدٍ عمْرِوء وَعَبْدٍ الكَْبَق» وَمَا أَشْبَه َك حَاهًا عَبْد المُكللِب» . وََنٍ أبن عباس كا في الآية؛ كَالَ: «لَما َعَنّاهَا آدَم؛ حَمَلَتْء كأَامُمَا إِنلِيسُ» كَقَالَ: ني صَاحِبْكُمَا الذي أخْرَدُكُمَا مِنَ الجَده - يُحَرْفهُمَا ‏ سَنْيَاُعَبْدَ الَارثِ كَبيَا أن"},{"id":"talib-alilm-p191","text":"كِتَابُ التُؤجِيدٍ الّذِي هُوَ حَقُ اللّه عَلَى العبِيدٍ 184 أَنْ يُطيِعَافُ مَخَرَج مَيعا. م حَمَلَثْه كَأَنَاهُمَا فَذَكَرَ لَهُمَاء كََذْرَكَهُمَا حُبُ الوّلّدِء مَسَمَّيَاهُ عَبْدَ الحَارِثِ؛ نَذَلِكَ قَوْلُه: لجعلا له شك نمآ +اتنهمأ»» رَوَاهُ أَبْنُ أبي حَاتِم . وَلَهُ بِسَنَدِ صَحِيح: عَنْ قَعَادَة؛ِ قَالَ: ١«شرَكَاءَ‏ في طَاعَيِه وَلَمْ يَكُنْ في عِبَادََها . وَلَهُ سَئَدٍ صَحِيح: عَنْ مُجَاجِدٍ في قَولِو: « لبن َتنا صَيِسًا4 ؛ قَالَ: أَشْمَقَا أَلَا يَكُونَ دك مَفكاه طن القصهوة الأشعيندة وَغَيْرهِمًا. ات انه"},{"id":"talib-alilm-p192","text":"0 متون طالب العلم 011 بَابُ قَوْلٍ اللَّهِ تَعَانَى: ظوَيةَ الأنهاة التق تادغوة يبا لمعو )مه موه #ابوسيب ب وَدروأ ألذِنَ يلَحدُوت فى أَسْمَنيد 6 الآيَة ذَكْرَ أَبْنُ بي حاتم : عَنٍ أَبْنِ عَبَّاسِ وا : ««يتمثرت ف أتكيد» : يُشْرِكُونه. وَعَنْهُ: «سَمَّوًا اللّاتَ مِنَ الإلّء وَالعُرّى ِنَ لعزي . وَعَنِ الأَعْمَشٍ: ايُدْيِلُونَ فِيهًا ما لَيْسَ مِنْهَا». ها الت ننه"},{"id":"talib-alilm-p193","text":"تاب المؤجيدٍ الي هو حَقُ الله على القبيدٍ لل 011 بَابُ لا يُقَالُ: السََامُ عَلَى اللّه «كُنًا إِذَا كُنّا مَعَ النّبِيَ كله فِي الصَّلَاة؛ قُلْنًا : السَّلَامُ عَلَى الله مِنْ عِبَادِوء السَّلَامُ عَلَى كُلَانٍء قَقَالَ النَّبِيْ لِ: لا تَقُونُوا: السَّلَامْ عَلَى اللو ِنَّ الله هُوَ السّلَام . مون"},{"id":"talib-alilm-p194","text":"1 متون طالب العلم اننا بَابُ َوْلِ: اللُّمُ أَعْضِرْ لِي إن شِنْتَ فِي الصّجيح: عَنْ أبي هُرَيْرَةَ للك أَنَّ رَسْولَ الله يكِِكَالَ: ١لا‏ يَقُولَنَ أَحَدُكُمْ : اللَّهُمّ غْفِرْ لِي إِنْ شِنْتء اللَّهُمَ أَرْحَمْنِي إِنْ شِنْت» لِيَعْزِم المَسْألة؛ كَإِنَّ اللَّهَ لا مُكْرة لَه وَلِمْسْلِم : «َليْمَظُم الرَغْبَة كن اللّه لا يَتَعَاظمُهُ شَيْء أَغطاة» . \" وان ان"},{"id":"talib-alilm-p195","text":"كاب اليد الذي هُوَحَقُ الل على القبيدٍ 1 041 ] بَابُ لا يَقُولُ: عَبْدِي وَأَمَتِي فِي الصّجيح: عَنْ أبي هُرَيْرَةَ له أَنّ رَسُولَ اللِّ يل َال: «لا يَقُلْ أَحَدُكُمْ : أظهِم رَبك وَطَئ وَبّكَء وَلقْل: سَبّدِي وَمَوْلَايَ. ََا يع أحَدُكُمْ : عَبْدِي وَأمِي. وَلْيقْل: َنَايَ وَكْتَاتِي وَعْلَابِي2. الله انه"},{"id":"talib-alilm-p196","text":"14 امتون طالب العلم 1ه ] بَابُ لا يرد مَنْ سَأَنَ باللّه عَن آَبْن عُمَرَ مها قَالَ: قَالَ وَسُوكُ الل كله : ١مَنِ‏ أَسْتَعَادً بالل َأَعِيدُوه وَمَنْ سَأَلَ بالل تَأَعظوهُ وَمَنْ دَعَاكُمْ تَأَجِيبُوهُ؛ وَمَنْ صَنَعّ تك أتقزوها كاير نإن لع مُجَدُوٍ نا تُكَافِبُوهُ؛ نَأَدْمُوا لَهُ حَنَّى نَرَوا أَنَكُمْ كَدْ كان نغوة ونا أثرءذازد» والتقائك + بإتكاد وان"},{"id":"talib-alilm-p197","text":"كِتَابُ التُوْجِيدٍ انّذِي هُوَ حَقُ الله عَلَى العَبِيدٍ 1 6] بَابُ لا يُسْأَلُ بِوَجْهِ الله إلا الجَنَهُ عَنْ جَابِرٍ ضَين كَالَ: كَالَ رَسُولُ الله يلل : دلا ينأل بِوَجْه الله إِلّا الجَنّا رَوَاه بر كاوٌة. ع نا"},{"id":"talib-alilm-p198","text":"143 متون طالب العلع [لاه] بَابُ ا ما جَاءَ فِي اللّو وَكَوْلُ الله تَعَالَى : ©ِبَمُولونَ لو كن لنَا من آلْأَمْرِ مَىَ ما كيلا ههناً» . وَكَوْلْهُ : «الِْينَ الوأ جنوي وَمَسَدُوا ل أملَاعُوكا ما لوا الآية. فِي الصّجِيح: عَنْ أبي هُرَيْرَةَ طلكه أَنَّ رَسُولَ اللَّهِ يل مَالَ: «أخرص عَلَى ما ينقمْكَ» وََسْتصْ بالل وا تفجؤ. وَإِنْ أَصَابَكَ هَيْءٌ: فلا تقّل: لؤ آني كَعَلْتُ؛ٍ كَانَّ كَذَا وَكَذَاء وَلَكِنْ كُلْ: كَدَّرَ اللّهُ وَمَا شَاءَ فَعَلَّ؛ إن لو تفتح عَمَلَ الشَّيْطانِ». ات ننه"},{"id":"talib-alilm-p199","text":"كِتَابُ التُْجِيدٍ الَذِي هُوَ حَق الله عَلَى العَبيدٍ كما | بَابُ التَّهْي عَنْ سَبّ الزيح عَنْ أَبَيْ بْنِ كب يه قَالَ: قَالَ رَسُوَلُ الله ك: «لَامَسْبُوا الوح ؛ فَِذَا رَآنِهُمْ ما هَذِهِ الرّبح» وَحَيْرٍ مَا فِيِهَاء وََيْرِ مَا أُمِرَتْ بو وَنعُودُ بك من شَرَّمَذِهِ ايح وَشَرٌمَا فِيهَاء 2ت"},{"id":"talib-alilm-p200","text":"1 متون طالب العلع 041 ] بَابُ قَوْلٍ اللَّهِ تَعَانَى: «يأثوت لد عالق لهي يَصُولُوت هَل لَنَاِنَ لمر صن وو قل إن الأمر كه يو اهاية وَقَوْلُهُ: «اظَل ينه لب ألتَن' ليم دَايرَة لشو » الآية. قَالَ آَنْنُ القَيّم - فِي الآيةِ الأولّى -: «قُسْرَ هَذَا الح أنه سْبَْائَهُ لا يَنْضْرٌ وَسْولَةُ» وَأَنّ أَمْرَهُ سَيَضْمَحِل وَفْسَْرٌ بِطَنْهِمْ أَنَّ ما أَصَابَهُمْ كَفْسْرَ بِِنْكَارٍ الحِكْمَّةء وَإِنْكَارٍ القَدَرٍ وَإِنْكَارٍ أَنْ يُيِمَ أمرَ وَسُولِوء وَأَنْ يُظْهِرَهُ عَلَى"},{"id":"talib-alilm-p201","text":"الذّينٍ كُلَ وَهَذَا هُوَ طن السَّوْءِ انَّذِي طنَّهُ المَُافِقُونَ وَالمُمْرِكُونَ ني سُورَةٍ المَنح . نّم كَانَ هَذَا طن الّْء؛ لِأنهُ طن غير وَحَمْدِهِ وَوَعْدِهِ الصَّادِقٍ . قَمَنْ طن أنه يِيلُ البَاِلَ عَلَى الحَق إدَالَة تسندةة عبر معها انث أذ انكر أن يَكُونَ ما جَرَى بِقَضَائِهِ وَكَدَرِو أز أَنْكَرٌ أن الحَمْدَ؛ بل رَعَمَ أَنََلِكَ لِمَشِيكَةٍ مُجَرَدة يك نأي كدا نل كوأ ار . وَأكْثَُ النّاسٍ يَطْنُونَ بالل طن السَوْءِ فِيمَا يَخَْصٌُ بِهِمْ» وَفِمًا يَفعلهُ يرجم وَلَا يَسْلَمُ"},{"id":"talib-alilm-p202","text":"0 5205058 مِنْ ذَلِكَ إِلّا مَنْ عَرَفَ الله وَأَسْمَاءَهُ وَصِفَاتِه وَمُوجَبَ حِكْمَيهِ وَحَمْدِو. لين اللَيبُ النَامِحْ فيه هذاه وَلْيْنْنْ إلى اللو وَيَستَغْفِْة من ظله يرب َلنّ السّوء . ولو انق عق اكقك؟ آرايك لقنا عَلَى القَدَرِ وَتَكَامَةٌ لك وَأَنَّهُ ان يَنْبَفِي أن يَكُونَ كَذَا وَكَذَاء كَمُسْتَقِلّ وَمُسْتَكْئِرٌ وَكَنَثلْ تَنْسَكَ هَل أَنْتَ سَالِم؟ وَإِلَا مَإِنْي لَا إِخَائْكَ نَاجِيًاا. و واي"},{"id":"talib-alilm-p203","text":"كِتَابُ التُؤجيدٍ الذي هُوَ حَقُ الله على العَبيدٍ لك 1 بَابُ ما جَاءَ فِي مُنْكِرِي القَدَّرِ وَقَالَ آبْنُ عُمَرَ حك : «وَالَدِي نَفْسُ أبْن عُمَرَ يدوا لَرْكَانَ لِأحَدِيِمْ مِفْلُ أحدٍ تعبا ثم أَنْمَقَهُ في سَبِيلٍ اللَّو؛ مَا قَبِلهُ اللَّهُ مِنْفُ َس يُؤِيِنَ بالقَدَرِء كُمّ آسْتَدَلَ بِقَوْلٍ النَِيَ كل: الإيِمَانُ: أَنْ تُؤْمِنَ بالل وَمَلاتكيو وَكُتُب وَرُسُلِهِ وَاليَوْمِ الآخِرِء وَنؤْيِنَ بِالقَدَرٍ حَيْرِهِ وروا ََاهُ ملم . وَعَنْ عُبَادَةَ بْن الصَّامِتٍ ينه أَنَّهُ كَالَ ِأبيِ: يا بي إِذّكَ لَنْ تح ظَهْمَ الإيمَان"},{"id":"talib-alilm-p204","text":"نهنا متون طالب العلع وَمَا أحظأك لَمْ يَكْنْ لِيُصِيبَكَ سَمِنْتُْ رَسُولَ الله يله يَقُولُ: إِنَ أَوّلَ مَا حَلّقَ اللّهُ: القَلَمَء كَقَالَ لَهُ: آكْتْبْء كَقَالَ: رَبّ! وَمَادًا أَكْْبُ؟ كَالَ: أَكْْبْ مَقَاوِبرَ كُلّ شَيْءِ حَنَّى نَُومَ السّاعَةُ . َا بْنَيّ! سَمِعْتُ رَسُولَ الله كه يقُولُ: مَنْ مات عَلَى غَيْرٍ هَذَاء قلي مِنّي2. وَفِي رِوَايَةٍ لأمّد: «إنَ أَوَكَ مَا حَلّقٌ اللّهُ: القَلَمَ م كالَ: أكْمُبْء كَجَرَى في يَلْكَ السّاعةٍ ما هوَ كان إلى يوم الام . دَفِي رِرَايةِ لبن وَهْب : قَالَ وَسْولُ الل ك: لمن مين بالعدرِ حر وَسرٌو؛ ركه الله بالنار) ."},{"id":"talib-alilm-p205","text":"وَفِي «المُسْئَدِء وَالسّئَنِ): عن أَبْنِ الدَيْلَمِيَ بالقديء وكفلم أَنّمَا أضابك لم يكن ليُحْطَِكَ» وَمَا أخطأَك لَمْ يكن لِيُصِيبَكَ ولو يِتَّ عَلَى غَيْرٍ هَذَا؛ لكُنْتَ مِنْ أهل الئَّار. وَحَدَيْمَة بْنَ اليَمَافِء وَنَيْدَ بْنَ نَابتٍ وك ؛ جات"},{"id":"talib-alilm-p206","text":"1 متون طالب العلم للها بَابُ ما جَاءَ فِي المُصَوْرِينَ عَنْ أبي هُرَيْرَةَ فيه أن رَسُولَ الله ل قَالَ: مَالَ اللّهُ تَعَالَى : وَمَنْ أَظلَمُ مِمَّنْ دب يَخْلْقُ ككاقى؛ كلكغلو] ذرة؛ أذ لكلفرا 2+ أت ليَخلتُوا سَهِيرَة؛ أخرجاة. وَلَهُمَا: عَنْ عَائِسَةَ ونا أن وَسْولَ الل كن كَالَ: «أَسَدُ النّاسِ عَذَاباً يَوْمَ القِيَامَةٍ: الَّذِينَ يُضَاهُِونَ بِحَلْقٍ اللّوا . وَلّهُمًا: عَنِ آَبْنِ عَبَّاسٍ بها سَمِعْتُ رَسُولَ الله 5ه يَقُولُ: هل مُصَوَّرِ فِي الَّار يُجْعَلْ لَهُ ِكل صُورَةٍ صَوَّرَهَا نَفْسٌ يُعَذَّبُ بهَا"},{"id":"talib-alilm-p207","text":"كب افيد الي هو حَقُ الل على الب \" وَلَهُمًا: عَنَهُ ليه مَرْفُوعاً: «مَنْ صَوَّرَ صُورَةٌ نِي الدُنْيًا؛ كُلَف أَنْ يَنْفُحَ فِيهًا الرُوحَ» وَلِمْسْلِم: عَنْ أب الهاج قَالَ: «قَالَ لِي عَلِنَ ذل : ألا أنِعَتُكَ عَلَى مَا بَعَنَني عَلَيْه رَسُولُ الله يك: أَلَا نَدَعَ صُورَةٌ إلا طَمَسْتَهَاء وََا برأ مُشْرِفاً إلا سَوَيِته. نا ال نه"},{"id":"talib-alilm-p208","text":"لحا متون طالب العلع إقنها بَابُ ما جَاءَ فِي كَثْرَةِ الحَلِفٍ وَكَرلُ الل تَعَالَى : «ولخكطرا تك » . عَنْ أبي هُرَيْرَةَ 4ه قَالَ: سَمِعْتٌ رَسُولَ اللَّهِ كله يَقُولُ: «الحَلِف مَنْفَقَةٌ وَعَنْ سَلْمَانَ وله مَرْفُوعَا : طَلائَةٌ لا يكَلّمُهُمْ الله يَوْمَ القيَامَق وا يُرَكيهم» وَلَهُمْ عَدَابٌ أَلِيمٌ: أَعَيْمِظ ران وَعَايِلٌ مُستكيرٌ: وَرَجُلٌ جَمَلَ اللَّهَ بضَاعَئَهُ؛ لا يَشْثَرِي إِلَّا ِيَمِينِهِ» وَلَا يَبِيعُ إِلّا بِيَمِينِه» رَوَاهُ الطَبَرَانِيُ"},{"id":"talib-alilm-p209","text":"تاب المؤجيدٍ الي هو حَقُ الله على القبيدٍ 3“ وَفِي الصّحِيح : عَنْ عِمْرَانَ بن حُصَيْنٍ وها قَالَ: قَالَ رَسُْولُ اللو يكيذ: حير أمِي كَرْنِي» ُمَ الَِينَ يَنُونهُمْ» كُمٌ الَِّينَ يَلُونَهُمْ - كَالَ عِمْرَانُ: فلا أذري أَذْكَرَ بَعْدَ ثَرِْهِ مَرَتَيْنِ أو كلاثا؟ . ثُمَ إن بَعْدَكُمْ قَؤْماً يَشْهَدُونَ وَلَا يُسْتَشْهَدُونَ وَيَحُونُونَ وَلَا يُؤْتَمَنُونَ وينُْرُونَ ولا يُونُونَ ويَظهَرُ يهم السَمَنُ». وَفِيهِ: عَنٍ أَبْنِ مَسْعُودٍ د أن النَبِيّ يله كَالَ: اير الئاس تَرْنِي» 8 الَِّينَ يَلُونَهُمْ َم الَِنَ يَُوَهُم» م بَجِيءُ قوم تين شَهَادَةُ َحَدِحمْ يميه وَيَوينهُ شَهَاَه . قَالَ إِنْرَاهِيمُ: «كَانُوا يَضْرِبُونََا عَلَى الشَّهَادةٍ وَالعَهْدِء وَنَحْنُ صِعَارًا . ها ان ننه"},{"id":"talib-alilm-p210","text":"ينها بَابُ ما جَاءَ فِي ذِمّة اللّه وَذِمَِ نَِيَهِ وَقَوْلُهُ: لوا سهد لنّه ا عهَدثْر وكا تمش يبد وَحيهَا» الآية. عَنْ برَْدَةَ يه : «أنّ وَسُولَ الله يك كان إذَا أَمّرَ أميراً عَلَى جَيِشٍِ أز سَرِيَةِ؛ أَوْصَاهُ بتَقْوَى اللو وَمَنْ مَعَهُ مِنَ المُسْلِمِينَ خَيْرا َم مَالَ: أغْرُوا ْم اللَّو. فِي سيل اللو ثَاتنُوا مَنْ كَفَرٌ بالل أغْرُوا وَلَا تَقُنُواء وَلَا تَفِْرُواء وَكَا تُمَتلُواء وَكَا تَفْلُوا وَليداً. وَإِذًا لَقِيتَ عَدُوَّكَ مِنَ المُشْرِكِينَ؛ كَأَدْعُهُمْ إِلَى نَلاثِ عِصَالٍ ‏ أ خِلَالٍ . فَأيَتَهُنَّ مَا"},{"id":"talib-alilm-p211","text":"كتَابُ التُؤجيدٍ الذي هُوَ حَقْ الله َلَى القبيدٍ 5 ثُمَ آَدْعُهُمْ إِلَى الإشلام» فَإِنْ أَجَابُوكَ؛ٍ ْم آمهم إلى التَحَوٍ من دارم ِلَى كار المُهَاجِرِينَ» وَأَخْيرْهُمْ أَنّهُمْ ِنْ كَعَلُوا ذَلِكَ؛ كَنَهُمْ مَا لِلْمْهَاجِرِينَ» وَعَلَيْهُمْ مَا عَلَى ان أبَا أن يكَحَوّنُوا ِنهاء أخيزهم أَنَّهُمْ يَكُونُونَ كأغرَابٍ المُسْلِمِينَ» يَجْرِي عَلَيْهِمْ وَلَا يَكُونُ لَهُْ في المَنِمَةٍ وَالمَيْءِ شَيْة؛ إِلّا أَنْ يجَاهِدُوا مَعَ المُسْلِمِينَ."},{"id":"talib-alilm-p212","text":"لهذا متون طالب العلع ِنْ هُمْ أَبَوَاء كأسْعَِن بالل وَكاتِلهُم . وَإِذَا حَاصَرْتَ أَهْلَ حضنء فَأَرَادُوكَ أَنْ تختلا لهم ذه اللو ين كلا تل لَه ذه الل وَكَا َه َي وَلكنِ أَجْمَلْ لَهُمْ تك وَْمَة أَضْحَابكء فَإِنَكُمْ أَنْ تُخْفِرُوا ذِمَمَكُمْ وَدْمَمَ أضْحَابِكُمْ» أَهْوَنْ مِن أَنْ تُخْفِرُوا وَإذَا حَاصَرْتٌ أَمْلَ حِضنء كَأرَادُوكَ أَنْ ِنهُمٍ على م الله كلا نهم على كم الله كن رُم على خيك؛ فنك لاتذوي: أتسيث شفع الل نبي أذ لاه رَوَاهُ مُسْلِمْ. #6"},{"id":"talib-alilm-p213","text":"كب افيد الي هو حَقُ الل على الب كن 01 بَابُ ما جَاءَ فِي الإِقُسَام عَلَى اللّه عَنْ جُنْدُبٍ بْنٍ عَبِْدٍ الل ويد قَالَ: قَالَ َسْولُ الله يكه: «قَالَ رَجُلُ: وَاللّه لا يَْفِرُ اللَّهُ لِمُلَانِء كَقَالَ اللَّهُ ك3 : مَنْ دا الَّذِي َه وَأَحْبَظتُ عَمَلَكَ) رَوَاهُ مُسْلِمْ . وَفِي حَدِيثٍ أبي هُرَيْرَةَ ذه : «أنَّ القَائْلَ رَجُلّ عَابِدٌ. كَالَ أَبُو هُرَيْرَةَ: تَكُلّمَ بِكَلِمَةٍ أَوْبَقَتْ ذُنْياهُ وَآخِرَتة. ان نه"},{"id":"talib-alilm-p214","text":"1 متون طالب العلع [10] بَابُ عَنْ جُبَيْرٍ بْنِ مُظمِم ذه قَالَ: عدا َعْرَابِيٌ إِلَى اللي يل كَقَالَ: يا رَسُولَ اللّوا ُهِكَتٍ الأَنْفْسُء وَجَاعَ العِيَالُ وَمَلَكَتِ الأَمْوَالُ؛ كَأَسْمَسْقٍ لا وَبَكَء فَإِنَا نَسْتَشْفِعُ بالل عَلَيِكَ وَبِكَ عَلَى اللو كَقَالَ الي كه : ميان اللّوا يسان اللدا نهنا وَال يقت عَتَّى عُرِف ذَلِكَ فِي وجوه أضحَابدء ثم قَالَ: وَيْحَكَ! أَنَدْرِي مَا اللّه؟ إِنَّ شَأَنَّ الله أَغظمُ مِنْ دْلِكَء إِنَّهُ لا يُْتَسْمَعٌ باللّهِ عَلَى أَحَدٍ ...2 وَذَكَرَ الحَدِيتٌ. رَوَاه أيُو دَاوْدَ. وواني"},{"id":"talib-alilm-p215","text":"تاب وجيب الي هو حَقُ الله على القبي 1 إلذقا بَابُ ما جَاءً في جِمَايَةِ النَبي يكهِ حِمى التَوْحِيد وَسَدْهِ طُرُقَ الشَزكٍ «انطلفث في وَفْدِ بَنِي عَامِر إِلَى رَسُولٍ اللّهِ كك كَقُْنَا : أنْتَ سَيّدْنَاء َقَالَ: السَّيّدُ الله قُلْنَا: وَأَفْضَلْنَا مَضلاً» وَأَعْطَمُنًا طؤلاً» كَقَالَ: قُولُوا يَوْكُمْ أ بَعْضٍ تَولكُمْ. وََا يسْتَبْرِيتَكُمُ الشَيْطانٌ» رَوَاهُ أبُو دَاوْد بسَنَدِ وَعَنْ أس مف : «أنَّ نَاساً كَالُوا: ما وسو اللا يكيرنا وبع عبرا [رَسَيْئَنَا"},{"id":"talib-alilm-p216","text":"لقا متون طالب العلم وَأَبِن تجِيتا! كقآن: يا نهآ النان! كولوا عَبدُ الل وَرسُولةُ ما أَحِبُ أَنْ تَركمُونِي كَْقَ مَنْزِلَتِي الِّي أَنْوَلَنِي اللّهُ 3» رَوَاهُ النَسَائِيُ ونان"},{"id":"talib-alilm-p217","text":"تاب المؤجيدٍ الي هو حَقُ الله على القبيدٍ لق إفنها بَابُ ما جَاءَ فِي قَوْلٍ اللَّهِ تَعَانَى: «وَا دروأ له حنَّ دي وَالرْسُ بيِيحًا قِصَكه بم الِْيَمَةِ» الآية عَنِ أَبْنِ مَسْعُودٍ َه قَالَ: ١جَاءَ‏ حَبْرُ مِنّ الأخبَارٍ إِنَى رَسُولٍ الله يل كَقَالَ: يَا مُحَمّدً! ِنَا تَجِدُ أنَّ الله يَجْعَلُ السَّمَوَاتٍ عَلَى إضْبّع » وَالْأَرَضِينَ عَلَّى إِضْبّع» وَالشَّجَرَّ عَلَى إضْبَع» وَالمَاء وَالقَرَى عَلَى إضْبّعء وَسَائِرَ الخَلَائِقٍ عَلَى إضبّع» فَيَقُولُ: أنَا المَلِكُء مَضَحِكَ رَسُولُ اللو يَكِِ حَنّى بَدَتْ نَوَاجِدَهُ؛ٍ تضدِيقاً لِقَوْلِ الحَبْرٍ كُمَّ كَرَ: وها َدَرُوا له"},{"id":"talib-alilm-p218","text":"عق متون طالب العلع وَألسّمَوْتُ مَطويث ينه الآيةا. وَفِي رِوَايَةِ لِمُسْلِم: «وَالجِبَالَ وَالشَّجَرَ على إطبمء كُمّ يورُهْنَّء فيثك آنا العيك؛» أَنَا اللّه». وَفِي رِوَايَةٍ لِْبْحَارِيَ: «يَجَعَلُ السَّمَوَاتِ عَلَى إِصبّع» وَالمَّاء وَالثَرَى عَلَّى إِصْبَّعء وَسَائِرَ الكَلْقٍ عَلَى إضبّع أَخْرّجَا. وَلمْسْلمِ: عن أبن عمرٌ ويه مرفُوعا : «بَظلوي اللّهُ السّمَوَاتٍ يَوْمَ الام م يَأَذُمُنَ بِيَدِه اليُنتى» ثُمَبقُولُ: آنا المَِك» أَبْنَ الَبّارُونَ؟ أن المتكَبرُونَ؟ ثم بوي الأرَضِبنَ انع مم الجَبّارُون؟ أَيْنَ المتَكَبرُونَ9)."},{"id":"talib-alilm-p219","text":"كِتَابُ التُؤجِيدٍ الّذِي هُوَ حَقُ اللّه عَلَى العبِيدٍ كلف وَرُوِيَ عَنٍ أَبِنٍ عَبَّاسٍ وها قَالَ: «مَا السَّمَوَاتُ السَّبْعُ وَالأَرَصُونَ السَبْعُ في كت الرَّحْمَنِ؛ إلا كَحَرَُلَةٍ في يَدِ أَحَدِكُم». وَقَالَ آَبِنُ جَرِيرٍ : حَدَّنَنِي يُونْسُء أَخْبَرَنا أَبْنُ وَهْبٍء كَالَ: كَالَ أَبْنُ رَيْدِ: حَدَّنَنِي أبي» قَالَ: قَالَ رَسُولُ الله كَلِ: ما السَّمّوَاتُ السَبْعُ في الكُرْسِيٌ ؛ إِلَا كَدَرَاهِمَ سَبَْةٍألْقِيثْ في ترْسٍ). قَالَ: وَقَالَ أَبُو دْرٌ ضه: سَمِفتٌ رَسُولَ اللَّهِ َي يَقُولُ: ما الكُرْسِيُ في العَرْش؛ إلا تَحَلْفَةٍ مِنْ حَدِبدٍ أَلقِيثْ بَينَ َهرَيْ ثَلَاةٍ ون الأَْضٍ». وَعَن أبن مَسْعُودٍ صَقِيه قَالَ: ١بَيْنَ‏ السَّمَاءِ الدُنيَا وَالَِّي تَلِيهَا حَمْسُ مِئة عَام."},{"id":"talib-alilm-p220","text":"03 متون نالب الل وَبَيْنَ كل سَمَاءٍ حَمْسُ مك عَام. وَبَيْنَ السّمَاءِ السَّابعَةِ وَالَكُرْسِيَ خَمْسُ مِكةٍ 5 0 وَبَيْنَ الكَرْسِيّ وَالمَاءِ حَمْسٌ م عَام. وَالعَرْشنُ قَوْقَ المَاءِ. وَاللَهُ نَوْقَ العَرْشٍ لا يَحْمَى عَلَيِْ شَيْءْ مِنْ عْمَالِكُمْ) أخْرَجَة آبْنُ مَهْدِيّ: عَنْ حَمَّادِْنِ سَلَمَةَه عَنْ عَاصِمء عَنْ زِرّء عَنْ عَبْدِ الله . «وَرَوَاةٌ بِنَحْوِوٍ المَسْعُودِيٌ: عَنْ عَاصِم 1 1 9 عَنْ أبي وَائِلء عَنْ عَبْدٍ الله ونا قَالَهُ الحَافِظ الذّهَبِتُ كَالَ: «وَّلَهُ ظَرق1. عَنِ العبّاس بْنِ عَبْدِ المطلِبٍ ضيه كَالَ: كَالَ رَسُولُ الله يَكِ: «مَل نَذْرُونَ كُمْ بَيْنَ"},{"id":"talib-alilm-p221","text":"تاب جيب الذي هو حو اله على القبيد 0 السّمَاءِ وَالأَرْضٍ؟ قُلْنَا: الله وَرَسْولُه أعْلّمُء وَمِنْ كُلَ سَمَاءٍ إلى سَمَاءِ مَِيرَةُ حَمْسٍ مك وَبَيْنَ السَّمَاءِ السَّابمَةٍ وَالعَرْشٍ بَحْرٌء بَيْنَ شين واغلةة قوير الشماء أن وَاللهُ تَعَالَى كَوْقَّ ذلك لَا يَخْفَى عَلَبْوِ شَيْة مِنْ أَعْمَالٍ بَنِي آدمَ) أَخْرّجَهُ دك وَاللّهُ سْبْحَائَهُ وَتعَالَى أغْلّم ."},{"id":"talib-alilm-p223","text":"فهْرِس المَوْضُوعَاتٍ لهذا ف اوبات المقلعة 0 سل ري لظ امون ‎١‏ ‏نهل ريك مرق الشتوو: مسد .ندهه. 16 روات مفترح لفون 4 كُتْبّ مُفْتَرَحَةٌ للْقِرَاءَةٍ 1 ُحْفَُ الأظمَالٍ وَالِلْمَانِ في تَجْوِيدٍ القرآن 7 النْسَخُ المُعْتَمَدَةُ في تَسْقِيقٍ المَمْنٍ 34> أَحْكَامٌ الثُونٍ السَاكِئة وَالتَنوِينٍ 5 أَحْكَامٌ الِيم وَالنُونٍ المُهَدَتيْنِ .......... 78 أَحْكَام الويم السَّاكِئةٍ 39>"},{"id":"talib-alilm-p224","text":"كفا متون طالب العلم أَخْكَامُ لام «ألى. وَلَام الفِغلٍ ... 98 في المِلين والكاري والتتجانتين نف أَنْسَامُ المَدّ قإنا أَحْكَامُ المَدَمَعَ الهَمْزٍ يان أَقْسَامُ المَدَ اللّازِم نذا [حَاتِمَةُ] 1 و8 شُرُوظ الصَلَاٍ وَرْكَائهَاوَوَاجِبَائَا ل النْسَخُ المُعْتَمدَةُ في تَسْقِيقٍ المَمْنٍ 11 شُرُوظ الصَّلَاةٍ : 2 أَرْكَانَُ الصَّلَاةٍ إلى الوَاجِبَاتٌ 8 كِتَابُ التَوْجِيدٍ الي هُوَ حَنُ الل علَى المَبيدٍ 7"},{"id":"talib-alilm-p225","text":"فِهْرِس المَؤْضُوعَاتٍ فقا انح المُعْتَمَدَةُ في تَحْقِيقٍ المَْنٍ 7 1 كِتَابُ التَوْحِيدٍ ا 1 بَابُ مضل التَّرْحِيدٍ وَمَا يُكَفْرُ مِنَ الذنُوبِ 4 1 بَابُ مَنْ حَقَّقَ التَّوْجِيدَ دَخَلَ الجن بمَيْرِ حِسَابٍ 1 [4] بَابُ الحَوْفٍ مِنَ الشّرْكِ 4 بَابُ الدعَاءِ إِلَى شَهَاَة لا لَه إلا الله . 44 7 ]يب تَفْسِير النَوْجِيدٍ وَضَهَاءَ لال الله ‎4١‏ ‏[ بَابٌ مِنَ الشَّرْكِ لْنْسُ الحَلْمَةٍ وَالخَيْط وَتَحْوِجِمًا ؛ لرَفع البَلاء أو دَفْعِهِ 5 61 بَابُ ما ججاء في الى وَالتّمَائْم يل"},{"id":"talib-alilm-p226","text":"تكفا متون طالب العلم 3 بَابُ مَنْ تَبَرَكَ بشَجَرَةِأَوْ حَجَرٍ وَنَشْرِجمًا 4 1] يَابُ مَا جَاء في الذَّبْح لكي اللو ...... ‎٠٠١‏ ‏3 باب لا يذب لله مان يُذْبَحُ فبه لعي الله دل 3 بَابٌ مِنّ الشَرْك النَْرُ لمي الله 1 [1] بَابٌ مِنَ الشَرْكِ السْيعَادة كير الله ‎1١8...‏ ‏1 باب مِنَ الشّرْكِ آَنْ يَسْتَقِيتَ كير اللو َو يَدْعْوَ غَيْرَه حا 1 بَابُ قَوْلٍ اللِّ تَعَالَى : دمالا يك عناوم بل * ولا منتليئوة م تنرا» اليد 04"},{"id":"talib-alilm-p227","text":"فِهْرِس المَؤْضُوعَاتٍ لنفا 7 بَابُ قَوْلٍ اللِّ تعَالَى : طحق إن فيح عن يهن الوأ مد َل ريك الوأ لحن وهر ليخ الكز» ا ] بَابُ الشَّفَاعَةِ 1 1 بَابُ قَوْلٍ الله تَعَالَى : «إنَكَ لا تبّيِى مَنْ حبك وَلكرّ لله يب من مكلذ /1 3 بَابُ مَاجَاء أَنَّ سَبَبَ كُفْرِ بَنِي آكَمَ َتَرْكهمْ دِيتَهُمْ هُوَ اللو في الصَّالِحِينَ .....119 [1*؟] بَابْ مَا جَاءَ مِنَ التَّْلِيظِ فِيمَنْ عبد اللّه عِنْدَ قر رَجُلٍ صَالِح ؛ فَكَيْف إِذ عَبَدَهُ؟! 1 3 يَابُ مَاجَاءأنٌ المُنُوَفِي تُبُورٍ القبالحية بُصَيذعا أوانا تفتذة ذرو د"},{"id":"talib-alilm-p228","text":"لهف متون طالب العلع 31 بَابُ مَا جَاءَ ني حِمَايَةِ المُضطَفَى عَلله جَنَابَ النَوْحِيدِء وَسَدَِ كُلَّ طرِيقٍ يُوصِلٌ ِلَى الشّرْكِ ين
