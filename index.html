<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Матн — заучивание</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&display=swap">
<style>
:root {
  --bg: #fbfaf7;
  --fg: #1f2328;
  --muted: #667085;
  --card: #ffffff;
  --border: #e3e0d8;
  --accent: #0f5c4d;
  --accent-fg: #ffffff;
  --accent-soft: #e2f1ec;
  --text-bg: #f4efe0;
  --good: #1b7a3a;
  --bad: #b42318;
  --bad-bg: #fde8e6;
  --warn: #b25a00;
  --warn-bg: #fff0dc;
  --repl: #6b3fa0;
  --repl-bg: #efe7f8;
  --swap: #0b6aa2;
  --swap-bg: #e0f0fa;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181a; --fg: #e8eaec; --muted: #9aa4ad; --card: #1c2225; --border: #2e373b;
    --accent: #4cc0a3; --accent-fg: #07211b; --accent-soft: #17332d; --text-bg: #242a24;
    --good: #5fd080; --bad: #ff8a80; --bad-bg: #3a1f1d; --warn: #ffb866; --warn-bg: #3a2a14;
    --repl: #c8a2f0; --repl-bg: #2e2340; --swap: #7cc4f0; --swap-bg: #152c3b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181a; --fg: #e8eaec; --muted: #9aa4ad; --card: #1c2225; --border: #2e373b;
  --accent: #4cc0a3; --accent-fg: #07211b; --accent-soft: #17332d; --text-bg: #242a24;
  --good: #5fd080; --bad: #ff8a80; --bad-bg: #3a1f1d; --warn: #ffb866; --warn-bg: #3a2a14;
  --repl: #c8a2f0; --repl-bg: #2e2340; --swap: #7cc4f0; --swap-bg: #152c3b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.ar { direction: rtl; font-family: "Amiri", "Scheherazade New", serif; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.stats { display: flex; gap: 16px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); }

nav { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); padding: 4px; border-radius: 12px; }
nav button { flex: 1; min-width: 0; padding: 9px 8px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
nav button[aria-current="true"] { background: var(--accent); color: var(--accent-fg); }

button, select, textarea, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.rec-on { background: var(--bad); color: #fff; border-color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row > * { min-width: 0; }
.grow { flex: 1; }

select, input[type="text"], textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }
textarea { min-height: 84px; resize: vertical; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.matn { background: var(--text-bg); border-radius: 12px; padding: 18px 16px; font-size: 26px; line-height: 2; min-height: 72px; }
.matn.masked { color: var(--muted); letter-spacing: 0.15em; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.msg { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }

.acc { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.acc.good { color: var(--good); } .acc.mid { color: var(--warn); } .acc.low { color: var(--bad); }
.diff { font-size: 24px; line-height: 2.1; }
.w { padding: 0 3px; border-radius: 4px; }
.w.match { color: var(--good); }
.w.missing { color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }
.w.extra { color: var(--warn); background: var(--warn-bg); }
.w.replace { color: var(--repl); background: var(--repl-bg); }
.w.swap { color: var(--swap); background: var(--swap-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { font-style: normal; padding: 0 6px; border-radius: 4px; margin-inline-end: 4px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.item .t { font-size: 20px; min-width: 0; }
h2 { font-size: 16px; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }

/* ===== Дополнения ===== */
.matn { font-size: var(--matn-size, 26px); }
.diff { font-size: calc(var(--matn-size, 26px) * 0.9); }
.ctx { color: var(--muted); font-size: calc(var(--matn-size, 26px) * 0.7); line-height: 1.9; display: flex; flex-direction: column; }
.ctx small { direction: ltr; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }

.seg { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); padding: 3px; border-radius: 10px; }
.seg button { flex: 1; min-width: 0; padding: 7px 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grade .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; }
.grade small { font-weight: 400; font-size: 12px; opacity: 0.8; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-size: 24px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 13px; }

.bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; }
.barcol { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; }
.bar { width: 100%; background: var(--border); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar.hit { background: var(--accent); }
.barval, .barlbl { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 14px; }

.progress { height: 8px; border-radius: 4px; background: var(--border); position: relative; overflow: hidden; margin-top: 4px; }
.progress i { position: absolute; inset: 0 auto 0 0; display: block; }
.progress .p1 { background: var(--accent-soft); outline: 1px solid var(--accent); outline-offset: -1px; border-radius: 4px; }
.progress .p2 { background: var(--accent); border-radius: 4px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="number"] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }


.pdf-shell{display:grid;gap:12px}.pdf-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pdf-toolbar input{width:74px}.pdf-page{position:relative;overflow:auto;background:#e8e6e0;border-radius:12px;padding:12px;text-align:center;min-height:360px}.pdf-page canvas{max-width:100%;height:auto;display:block;margin:0 auto;box-shadow:0 2px 14px #0002}.pdf-text-layer{position:absolute;inset:12px;overflow:hidden;line-height:1;pointer-events:auto}.pdf-text-layer span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;cursor:text}.pdf-text-layer span::selection{background:#2563eb55}.pdf-chapters{display:flex;gap:6px;flex-wrap:wrap}.pdf-chapters button{font-size:12px;padding:7px 9px}.pdf-translation{position:fixed;z-index:20;max-width:280px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px #0003;text-align:left}.pdf-translation b{display:block;direction:rtl;font-size:20px;margin-bottom:4px}.pdf-translation small{color:var(--muted)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<div id="root"></div>

َجْمَعِينَ. َإِن الِلمَ الشَّْعِيَ من أَجَلْ القُرْبَاتٍء وَبو ُتَالُ الرَفعَةُ في الدَّارَيْنِ ؛ وَالطَمَرُ بالعلّم بِحِفْظٍ أضولِهء وَلِذَا قِيل(\": «مَنْ حَفِط الأصُولَ غيم الؤُصُول رَمَنْ ضَيّعَ الأصُولَ حُرمٌ الرُصُولْء وَأْنْعِدَ عَن الأصُولْء وَطَالَتْ عَلَيْهِ المُصُول» وَكَقَدَ حَتّى القَلِيلَ المَخْصُولء وَلَوْ طن أن لَهُ إِلَى السَّمَاءِ وُصُولْ). (1) القائل: الوالد يكلل."},{"id":"talib-alilm-p8","text":"5 متون طالب العلع وَقَدِ ته لعلَمَاُ لك يوضع مُتُونٍ في كل قن تسْهيلاً لِضَبْطِ العِلْم وَآسْيِحْضَارٍ مَسَائِلِق وَبِحِفْظِهَا آَنْتَمَرَ عِلْمُهُمْ في الآقَاقِء وَسَارَ ظَلَّابُهُمْ فِي الديَارِء كَانْتفَعَتْ بهمْ الأمَةُ عَلَى مَرْ العُضُورٍ. مُعُونا من أَشْمَل المُعُونٍ وَأنْقَِهَاء بَلَمْتِ انين وَعِغْرِينَ (11) مثأء مستا إلى سه مسَويَاتٍ رَاعَيْت فيا التدَمُجَ في الحفْظ مَعَ تو الفُنُونِ. ود أعتَمَدْتُ فِي تَحْقِيقٍ نُصُوصٍ مُتُونٍ المُسَْوَيَاتٍ الحَنْمَة الأولّى مِنْهًا عَلَى مِئكينٍ َتَلَائِينَ ‎)1٠(‏ مَحُطوطة» مُنتَحْبَةَ من أَكْثرَمِنْ وَحَرَائِنَ شَنّى فِي العَالَم» وَأَنْبَتُ وَضْف نُسَع"},{"id":"talib-alilm-p9","text":"المقدمة 1 كما صَبَظْتُ أَلْمَاَهًا بِالشَّكْلِء وَأَعَْئَئِتُ بعَلَامَاتٍ الترْقيم: مرَاعِيا مَعَانيَ الألقَاظِ فيهًا. وَسَمَيتُهَا: «مَعُونُ طَالِبٍ الهلّم) يَحْتَاجُهَا لالب المُكِيء وَلَا يَسْتَْنِي عَنْهَا الرَاغْبُ وَكَد جَرَْتُ هلد الت مِنْ حَوَاشِي الفُرُوقٍ بين سخ المَحْظوطَاتٍ وَعَيْرِ لِك لِيَسَهلَ عَلَى أشرى. وَبََانُ هَذِِ المُثُونِ وَمُسَْويَاتِهَا مَا يَلِي: + المُسْتوى التّمْهِيدِيٌ: الأَذْكَارُ وَالآدَابُ. » المُسْتَوَى الأَوُلُ: وَيَشْمَلُ المُتُونَ التّالِيَة: ‎١‏ الأضول التَلَائهُ الها ‎١‏ - القَوَاعِدُ الأريَُ."},{"id":"talib-alilm-p10","text":"0 امتون طالب العلم - نَوَاقِضٌ الإشْلام. 7ب الازتفوة في تكانى الإسلام وَمَوَاعِدٍ الأخكام (الأَرْبعُونَ الَوَوِية). ّ + الْمُسْتَوَى الثّانِي: وَيَشْمَلُ المُكُونَ التلِيَه ‎١‏ تُحْمَةُ الأظمَالٍ وَالمِلْمَانٍ فِي تَجْرِيدٍ القُرآن. ا ‎١‏ - شُرُوظ الصَّلَاة وَأَرْكَانُهَا وَوَاحِبَاتُهَا. ‏كَِابُ التَرْحِيدٍ الَّذِي هُوَ حَىُ اللو عَلَى العَِيدٍ. ‏؟ - مَنْظُومَةُ أبي إِسْحَاقَ الإِلْبيرِي. ‏المُقَدْمَة الأجرومية. ‏5-الققيدة الرافيعلة"},{"id":"talib-alilm-p11","text":"المقدمة 3 المُسْتَوَى الرَابعُ: وَيَشْملْ المُتُونَ التَالِيَةٌ: اب الؤرّقات: 7 عُيْرَانُ الجكم. *- بُمْيَةُ البَاحِثِ عَنْ جْمَلٍ المَوَارِثِ (الاخينة. 0 5 - العَقِيدَةُ الطَحَاوية. + المُسْتَوَى الخَامِس: وَيَشْمَلُ المُتُونَ التَلِيَةٌ ‎١‏ - بلع المَرّام مِنْ أَدلّةِ الأخكام. - زَادُ المُْتَفيِع في أَخْيِصَارٍ المفيع. \"- الحُلَاصَةُ في النّخر دلْفِيهُ آْنِ مَالِكِ). المُسْتَوَى السّادِس: وَيَشْمَلُ المتُونَ التَالِيَةُ: آ اليجَامِعٌ لِمَا في الصَّحِيِحَيْنِ. ؟ -أفْرَادُ البْخَارِيَ وَمْسْلِم."},{"id":"talib-alilm-p12","text":"المُُونِء وَمُرَاجَعَتِهَاء وَأْسْمَاءَ شرو مُفْتَوَحَةٍ لِمْتُونٍ المُسْتَوَيَاتِ الحَمْسَةٍ الأولّىء وَأَسْمَاءَ الفشتريات: وَلِكْبَرٍ حَجم مُتُونِ «المُسْتَوَى الخَامِس' َالمُسْمَوَى السَّادِسٍ»؛ أَكْرَذثُ كُلَ من فيه على حِدَةٍ أَسْألُ الله لِلْجَمِيع إخلاص النَيّدَه وَصَلَاحَ القَوْلٍ وَالعَمَلِ وَمُرَاقبتَهُ في السّرٌ وَالعَلَنِ. وَصَلَى لله سم على ينا محم وعلَى اط الا"},{"id":"talib-alilm-p13","text":"أسهل طريقة لحفظ المتون ‎1١‏ المُدَاوَمَةُ عَلَى حِفْظٍ المُتُونِء وَعَدَمْ الإكْئَارٍ مِنَ المَحْفُوظٍ اليَرْمِيَ» وَالتَأَنّي فِي الجفْظ : هُرَ تَهْجُ لعُلَمَاِ كَالَ الزغريُ كله: «إنَمَا جمَعْنَا هَذَا العِلْمَ الحَدِيثِ وَالحَدِيئِينَء وَالمَسْأَلَةِ وَالمَسأَلئيْنَ». وَالمَمْنُ: إِمّا أَنْ يَكُونَ حَدِيفاً عَن الب يكللوء وَإِمّا أنْ يَكُونَ تثراء أو نَظماً. + وَمِقْدَارُ مَا تَحْمَظٌ مِنَّ المُتُونِ ما يَلِيه ‎١‏ - إِذَا كَانَ المَْنُ المَحْفُوظ مِنْ مُتُونٍ الحَدِيثِ؛ تَأَخْمَظ كُلَ يَْم ثََاةَ أَحَادِيتٌ."},{"id":"talib-alilm-p14","text":"عضا همرسعسبسم - وَإذًا كان تقراء فالشمّطظ ذل مفيدة ِنْهُ لا يَِيدُ عَلَى حَدْسَةٍ أَسْظر. * - وَإِذَا كَانَ مَنْظُوماً؛ قَلَا تَزدْ عَلَى َبهَدَا المَقْدَارٍ المُتأني مَعّ التَكرَارٍ يَرْسَحُ المَحْفُوظ ‏ بِإِذْنٍ الله . + وَطَرِيقَةٌ جف المتُون مَا يليه ‎١‏ - كير المِقْدَارَ انّذِي تُرِيدُ حِفْطَهُ بَعْدَ صَلَاةٍ المُجر. ‏-كر بهد\" العضر آز\"كنة العنرب ما ‏* - مِنَ امد َكَل أذ تبأ فِي جِنظ المِقْدَارٍ الجَدِيدِ؛ أَمْرَأمَا حَفِظْتَهُ أنس"},{"id":"talib-alilm-p15","text":"اهل طريفه تحمس المتون: 1 ؛ - ْم آفرَأ حفْظاً مَا حَفِظتَهُ مِنْ أَرّلٍ المَئْنِ حَتَّى تَصِل إِلَى مَوْطِنٍ الحِفّْظٍ الجَدِيد. « - بَعْدَ ذَِكَ أَبِدَأْ فِي حِفْظٍ الدَّرْسِ الجَدِيدٍ بالطرِيقَةِ نَفْسِهًا. ‎١‏ - كَرْرْ هَذْهِ الطَرِيِقَةَ يَْمِيَاً حَنَّى تَنتَهِيَ مِنْ حِفْظِ المَثْنِ وَيَرْسَحَّ المخفوظ. ‏وَبِهَذِهِ الطَرِيقَةِ سِرْ فِي كُل مَئْنٍ تَحْمّظة مَعَّ ضَرُورَةٍ مُدَاوَمَةٍ مُدَارَسَةٍ الهِلْمٍ حِفْظاً وَمْرَاجَمَةَ وَقِرَاَهُ لِلَكُْبِء وَحُضُورٍ دُرُوسِ العُلَمَاءِ وَمُلَارّمَتِهُمْء وَالسُوَالٍ عَمَّا أشْكَلٌ مِنْ مَسَائِلٍ العلم. ‏وَالحِفْظ إِنَمَا هُوَ بِالتَكْرَا وَرْسُوحٌ المَخَفُوظ بِكَتئْرَة تَكْرَار وَعَذَا دَأَثْ الرَّاسِحِينَ فِي العِلّمء وَكَدْ كَانَ أَبُو إِسْحَاقَ"},{"id":"talib-alilm-p16","text":"14 متون طالب العلم الشَّيرَازِيُ يكل يُِيدُ مِقْدَارَ الحفْظ «مئة مَرَقَاء وَِلْكِيَا الهَرَّاسِيُ كله يُعِيدُ مِقْدَارَ الحِفْظٍ قَالَ أَبْنُ الجَوْزِيّ لله: «رَحَكَى لَنَا الحَسَنُ - يَغِي : آبْنَ أبي بَكرٍ النيِسَابُورِيَ ‏ أن كَقِيهاً أَعَادَ الدَّرْسَ فِي بَيْتِهِ مِرَاراً كَثِيِرَة ََالَث لَهُ عجُورٌ فِي بَِهِ: كَذ وَاللو حَفِظفه أنَاء فَقَالَ: أَعِيدِيه تَأَعَادَيْهُ كَلَمَّا كَانَ يَعْدَ يام قَالَ: يَا عَيُورُ أعِيدِي ذَلِكَ الدّرْسَء الحِفْظ ؛ للا يُصِبَي ما أَصَابَكِ)\". ‎)١(‏ الحث على حفظ العلم ص5"},{"id":"talib-alilm-p17","text":"إِذا حَفِظْتَ مُُوناً مُتَترَعَةَ في قُنُونِ العلم َرَاجِْهَا؛ لتَكُونَ أَرْسَمَ فِي الحِفْظ وَأَظْهَرَ فِي الأسْيِخضارء وَأسْرَّعَ فِي الِأَسْيَذْلالٍ» وَهِمّا يعِينُ عَلَى إِنْقَانٍ المَحَفُوظِ : قِرَاءَهُ عَلَى غَيْرِكَ حفْظاً. + وَطَرِيمَةٌ مُرَاجَعةٍ المُثُونِ ما يَلِي: ‎١‏ - رَاجِعْ كُلَّ يَوْمِ صَفْحَمَيْنء وَأفْرَأهَا حِفْظاً ١عِشْرِينَ‏ مَرَّها. ‏؟ - وَفِي العَدِ وَقَْلَ أنْ تَبْدَأْ في المُرَاجَعَةٍ البجَدِيدَةِ؛ آفرَأ جِمْظاً ما رَاجَعْتَهُ أَمْسٍ «حَمْسَ مَرَّاتا."},{"id":"talib-alilm-p18","text":"1 متون طالب العلم * - كُمَ بدأ في المُرَاجَعَةٍ الجَدِيدةٍ يِقْدَارٍ صَفْحَبَيْن حِفْظأً ١عِشْرِينَ‏ مَرَّه0 وَهَكَذَا سِر lilm-p30","text":"58 نتون طالب العام أَحْكَامُ الميم وَالنُونٍ المُشَدَّدَتَيْنَ روه فا 8 ف لوك ‎1١‏ وَعْنّ ميمائثمنوناشلدا ‏عو ون سقس سوس د ف وس م وَسَم كلا خرف غنةبّدا وهاي"},{"id":"talib-alilm-p31","text":"تْمَةُ الأطمَالٍ وَالفِلمَانٍ في تَجويدٍ القزآن 4 أَحْكَامُ الميم السَاكتة وَالمِيمإنْتَْكُنْتَجِي مَبْلَ لهجا لَاأَبِفٍ لَينَةٍلِذِيالحِجَا 9 أَحْكَامُهَا ئَلَائَةٌ لِمَنْ ضَبَظ إِخْمَاء أَدْعَامٌ وَإِظْهَارٌ قَمَظ ‎٠‏ قَالأرَّلُ الإِنمَاءعِنْدَالبَاءِ ‎\"١‏ وَالئَانٍإِدْهَام بِمِئْلِهَا أتى وَسَمْ إِذهَاماً صَغِيراً يا فَتَى ‎٠‏ وَالئََاِتُ الإظْهَارُ فِي البَقِبَّهُ مِنْأَخْرْفٍ َسَمْهَامَئْوية 3 لَدَى وَاوِ وَنَا أَنْ تَحْتَفِي لِمُرْبِهَاوَالِانَحَاهٍ فَأَعْرِفٍِ"},{"id":"talib-alilm-p32","text":"02 متون طالب العلم أَخْكَامُ لام 5 وَلَام الفِغلٍ 14 للام «أل» حَالان قَبْلَ الأخرفٍ أُولَامُما إِظْهَارُمَا مَلْمَمْرِفٍ . ‏كَبْلَ أيع مخ عَطْرَة شد عِلْمَهُ‎ ٠ ‏مِن «أنْخ حَجِّكَ وَحَفْ عَقِيمَه)‎ #الدتانميها إِدْعَامُهًا فِي أَرْبَع وَعَشْرَةِ نضا وَرَمْرَمَامَعِ طب ُمَ صِلْ رَخما تفْرْ ضف ذَانِعَمْ دَعْ سُوء طن زُرْ شَرِيفاً لِلْكَرَمْ) 4 وَاللَامَ الْأولَى سَمَّهَا قَمْرِيَة رَاللاالأخرئ سْمْهاسَنيِكا"},{"id":"talib-alilm-p33","text":"تُحْمَةٌ الأَطمَالٍ وَالغِلمَانِ فِي تَجويدٍ الشْآن 0 4 وَأَظهِرَنَ لام فِغل مُظَلْمًا فِي نَحْو قل نَعَمْ وَقَلْنَا وَألْعََ ا اه"},{"id":"talib-alilm-p34","text":"ف متون طالب العلم إِنْ في الصَّمَاتِ وَالمَحَارِج أنَمَقْ اد وَآن يعون كشْوّجاً كَقَاوْبًا دَفِي الصَنَاتٍ آخْعلنَابْلمَبَا م مُبْقَارِبَيْنٍ أَؤْيَكُوَا أآَنَمَنَا 64 أو خُرّكَ الحَرْنَانِ فِي كُلَ َقُلْ"},{"id":"talib-alilm-p35","text":"ُحْمَةُ الأطمَالٍ وَالفِلمانٍ في تَجوِيدٍ الشزآن فقا أَقْسَامُ المَنْ 8ه :والهدٌ أضبئة وتزعولة وَسَمْأوَلاَ ظبِيهِيَاًوَمْو دما لا تَوَن ل دُعَلَى تبث وَلَا بِدُوتِهِ الخرُوف تُجِْتَلَثْ - بَل أي حَرْفٍ عَيْرهَمْزٍ أذ سُكُونْ 8 وَالآخَرُ الَرْعِيُ مَوْقُوفٌ عَلَى سَبَبْ كَهَمْزْ أؤ سُكُونٍ مُسْجَلَا 5 مروف هئَلاكَة؛ عيقا مِنْ لَفْظِ «وَاي' وَهْيَ فِي انوحِيهًا'"},{"id":"talib-alilm-p36","text":"4 متون طالب العلم :4 - وَالكْسْرٌ قَبْ و ظ للد وَأَرَوانهاووَاجِبَائا لهام ادغو المع عمَةُ اله (زت3١1م)‏ ا 5"},{"id":"talib-alilm-p44","text":"* الخ المعتمّدة في تحقيق هذا المتن: - نسخة خظية بمركز الملك فيصل - السعودية - برقم (0108)» تاريخ نسخها: /1017اه العامّة بالرّياض - السعودية - برقم (470)» تاريخ نسخها: 173510ه. - نسخة خظية بمركز الملك فيصل - السعودية - برقم (0170)» تاريخ نسخها: 1718ه. - نسخة خظية بجامعة الملك سعود - السعودية - برقم (07378). - نسخة خطّية بجامعة الملك سعود - السعودية - برقم (81/9)."},{"id":"talib-alilm-p45","text":"شُرُوظٌُ الصّلاة وَأَرْكَانُهَا ووَاحِبَانُهَا هذا جل كين * شُرُوظ الصّلاة يشْعَة: الإِسْلَامُ وَالعَقْلُ» وَالتَّمييرُ . وَرَفُمُ الحَدَثْء وَإِزَالَةُ النجَاسَةٍي وَسَثْرُ العَْرَو وَدُُولُ الوَقْتٍِ وَآسْيِمْبَالُ القبلق وَاله."},{"id":"talib-alilm-p46","text":"الشَّرْظ الأَوَّلُ: الإِسْلَامُ؛ وَضِدَهُ الكْفْنُ وَالكَافِرُ عَمَلْهُ مَرْدُود وَلَا تُقْبَلُ الصَّلَاهٌ إلا َالدَلِيلُ قله تََالَى : «وَمن يني عر الاشكع ِينًا هن يِقبَلَ ِنْهُ وهو في الْآِخْرٌَة ين الْكَيِرَ» . وَالكَافِرُ عَمَلْهُ مَرْدُود وَلَو عَهِلَ أيّ عَمَلٍ . وَالدَلِيلٌ تَوْلهُ تَعَالَى : ما كن ِلْممْرِكِينَ أن يمرا متدجد الله سَهِدِينَ ع أنشيهم يالكثر يك حك أفتئمط ون رهم حيئوت». وَكَوْلَهُ َعَالَى: لفيا لما ين عمل مَجَملكه هجة تَنثُرر > ."},{"id":"talib-alilm-p47","text":"شُرُوطُ الصَالاة وَركائّهَا وََاجِبَانُهَا ُ الشَّرْظ النَّانِي: العَقْلُء وَضِدَُهُ الجُوتُ وَالمَجنُونُ مرمُوعٌ عَنُْ اقلم حَنَى يُفِيقَ . وَالدَلِيلُ الحَدِيثُ : «رُفِعَ القَلَمُ عَنْ ثََانَوٍ:"},{"id":"talib-alilm-p48","text":"4 متون طالب العلم الشَّرْظ الثَّالِتُ: التعييق: وَضِدُهُ الصّعَنُ وَحَدَّهُ: سَبْعٌ سِئِينَ ثُمَّ يُؤْمَرُ بالصَّلَاةَ؛ لِقَولِهِ لة: «مُرُوا أَبْنَاءكُمْ بالصَّلَاة لِسَبْعِء وَآضْرِبُومُمْ علَيْها لِمَشْرِء وَكَرتُوا بَبنَّهُمْ ني المَضَاجِع)."},{"id":"talib-alilm-p49","text":"شُرُوظٌُ الصّلاة وَأَرْكَانُهَا ووَاحِبَانُهَا 4 الشَّرْظ الرّابِعٌ: رَفْعُ الحَدَثٍ ‏ وَمُوَ الؤْضُوءٌ المَعْرُوفُ -. وَمُوجِيْهُ : الحَدَّثٌ. وَشْرُوظهُ عَشَرَةٌ: الإِسْلَامُ وَالعَقْلُء وَالتَميزُ وَالئَيّةُ وَآسْيِضْحَابُ حَكُيهًا ‏ بألا ينرِيَ قَظعَهَا حَنَّى تيم ظْهَارَتُهُ -. وَأنْقِطاعٌ مُوجِبٍ» وَأَسْيِنْجَاءٌ أو أسْتِجْمَارٌ َظهُورِية مَاو وَيَاحَتهُ. وَإزَالَةُ مَا يَْتَُ وُصُولَهُ إِلَى البَكَرَةٍ. وَمُخُولُ الوَقْتٍ عَلَى مَنْ حَدَئْهُ دَاِمْ لمَرْضِه ."},{"id":"talib-alilm-p50","text":"44 متون طالب العلع 1 فُرُوضُهُ نَسِئَةٌ: عَسْل الوَّجْهِ وَيِبْهُ: المَضْمَصَةٌ وَالِأَسْتنْشَاقُ . وَحَدُهُ ظولاً: مِنْ مَنَابتِ شَعْرٍ الرَّأسٍ إِلَى الذَّمْنِ وَعَرْضاً: إِلَى فُرُوعٍ الأدين . وَغَسْلْ اليدَيْنِ إِلَى المِرْكََيْن . وَعَشح ميغ الرّأضٍ.- ونه : الأدُنَانْ -. َعَسْلٌ الرَجلَينٍِ إَِى الكَغْيين. وَالتَرْتِيبُء. وَالمُوَالَاة. َالدَلِل كَرنهُ تعالى : <كاكا اديت متو إدَا َُثْمَ إِلَ الصلزة مَأَغْيِلوا وَجُوهُم دك إل مراف وَأمسحُوا روسك وَأرملحكُم إِلَ الكنيان» ."},{"id":"talib-alilm-p51","text":"شَرُوطٌ الصّلاة وَرْكَائها وَوَاِبَاتهَا 5 وَدَلِيلُ التَرْتيب؛ الحَدِيتُ: «أَبْدَؤُوا بمَا بدا الله بها . وُكليةالغدالاة؟ عديك ضاعب اللمعة عَنِ لني يكل : «أَنَّهُ لَمَا رَأَى رَجَادٌ فِي قَدَمِهِ ُمْعَدٌكَذْرَ الدَرْمَملَّمْ يُصِبْهَا المَاءُ؛ أَمَرَُ بالإِعَادَةا . وَوَاجِهُ : التّسمِيةُ مَعَ الذكْر."},{"id":"talib-alilm-p52","text":"5 متون طالب العلم وََوَاقِضْهُ تَمَايةٌ: الحَارِج مِنَّ السَّييلين. وَالْكَارِجُ الفَاحِسْنُ النّحِسُ مِنّ المجَسَدٍ. وَزَوَالُ العَقْلِء وَمَسٌ المَرأة بشَهْوَة. وَمَسُ المَرْج بِاليَدٍ ‏ قبلا كانَ أؤ ذُبْراً -. وَأَكل لخم الجَرُورِء وَتَفْسِيلٌ الميّتِ. وَالدكةٌ عن الإشلام ‏ أَعَادَنَا اللَّهُ مِنْ"},{"id":"talib-alilm-p53","text":"شُرُوطُ الصَالاة وَركائّهَا وََاجِبَانُهَا لذ الشَّرْظ الحَامِسٌ: إِزَالَةُ النَّجَاسَةٍ مِنْ نَلاثِ: مِنّ البَدَنِء وَالئَّوْبء وَالبُقُعَةٍ؛ٍ وَالدَلِيلٌ مَولهُ تعالى : «رَيَلِكَ لجز ."},{"id":"talib-alilm-p54","text":"0 متون طالب العلم الشَّرْظ السَّاوِسُ: سَيْرٌ المَوْرَة أَجْمَعَ أَمْلُ العلم عَلَى مَسَادٍ صَلَاةٍ مَنْ صَلَّى عُرْياناً وَهْرَ يَقِر. وَحَدُ عَرَةٍ الل : مِنَ السُرّةِ إِلَى الوبق وَالأَمَةُ كَدَيِكَ. وَالحُرَةُ: كُلَّهَا عَرْرَة إِلَّا وَجْهَهَا فِي الصَّلَّاة. وَالدَّثِيلٌ قَوْلُهُ تَعَالَى: «يبّج مادم حُدُوأ ريتك ند كن منجو» أي: عِنْدَ كُلّ صَلَاة."},{"id":"talib-alilm-p55","text":"شَرُوطٌ الصّلاة وَرْكَائها وَوَاِبَاتهَا قدا الشَّرْظ السَّابِعُ : دُخُولُ الوَقْتِ. وَالدَلِيلٌ مِنَ السُنَةِ: حَدِيتُ جِبْرِيلَ :ل : نُمَّ قَالَ: يَا مُحَمَّدُ! الصَّلَاهُ ما بَيْنَ هَذَّيْنٍ الوَقْتيْن) . وَكَوْلُهُ تَعَالّى: «إنّ صل كت عل التؤبيت كتبا تزفوكا4 أي: مَفْرُوضاً ني الأَوْنَاتِ. وَدَلِيلُ الأَوْمَاتِ؛ قَوْلّهُ تَعَالَى : «آقِر الصَلَرة دك الشِّين إِك عَمَقِ ايل وَمْرَنَ الْقَجرّ إِنَّ قرا الْشَجْرِ نت مَشهودًا 4 ."},{"id":"talib-alilm-p56","text":"04 امتون طالب العلم الشَّرْظ النَّامِنُ : أَسْتعْبَالُ القبلة. وَالدَِّيِلٌ قَوْلْهُ تَعَالَى: همد رك تَقَِ عا فرعم كللل»."},{"id":"talib-alilm-p57","text":"شُرُوطُ الصَالاة وَأَركَاها ووَاجبَاتُهَا نك الشَّرْظ التَّاسِعٌ: اليه وَمَحَلّهَا القَلْبُء وَالتَلقْ يها بذعَةٌ. وَالدَِّيِلُ الحَدِيتُ: (ِنَمَاالأَعْمَالُ بِالنَيّاتِ وَإِنَمَا لكل أمْرىءٍ مَا نَوَى) . 0-0"},{"id":"talib-alilm-p58","text":"0 متون طالب العلم * وَأَرْكَانُ الصَّلاةٍ أَربَعَةَ عَشَرَ: القيّامُ مَعّ القُذْرَة وَتَكْبِيرَةٌ الإخرّامء وَقِرَاءَةٌ القَاتَحَةِ. َالرُكُوعٌ» وَالرَفُعُ مِْهُ. وَالسجُودُ عَلَى سَبْعَةٍ الأغضاء وَالِأعْتِدَالُ وَالظمَأَنِيَةٌ في ججِيع الْأَرْكَانِء وَالتَرتيبُ. وَالتَّمَهُدُ الأخجين والشلوية كه وَالصَّلَاةٌ عَلَى لني يلق وَالتَسْلِيمَتَانٍ."},{"id":"talib-alilm-p59","text":"شُرُوظٌُ الصّلاة وَأَرْكَانُهَا ووَاحِبَانُهَا 3 الرُكْنٌالأَرَّلُ : القِام مَعَ القُدْرَ؛ وَالدَِّيلُ وله تَعَالَى : «وَفومرا كه فَنِتِ) . الرّكنٌُ الثاني : تَكْبِيرَةٌ الإخرّام؛ وَالدَلِيلٌ الحَدِيتٌ: مَحْرِيمُهًا: التكبيرٌ وَتَحْلِيلُهًا: التَسْلِيم. وَبَعْدَهَا: الِأَسْيَفْتَاحُ ‏ وَهُوَ سْنَةُ - قَوْلُ: سْبْحَائَكَ الهم وَبِحَمْدِكَ وَتَبَارَكَ آسْمْك» وَتَعَالَى جَدُكَ وَل إِلَهَ غَبْرْكَ. وَمَعْنَى سُبْحَائَكَ اللَّهُمَ» أي: أُتَرْمُكَ التَرِيهَ اللّائِقَ بجَلَالِكَ يا اللّهُ. «وَبِحَمْدِكَ؛ أي : نَاءَ عَلَيِكَ. وَتَبَارَكَ أسَمُك1 أي : البَرَكَةٌ 1 يذكركه"},{"id":"talib-alilm-p60","text":"5 متون تعالية الف «وَتَعَالَى جَدُدَ؛ أي: أرْتَقَعَ كَذْرْكَ وَعَظمَّ «وَلَا إِلَهَ غَيْرْكَه أيْ: لا مَعْبُودَ في الأض ولاق الشماء بعَنق سوا الله َعُودُ بالل من الشَيْطَانِ الرّجِيم»» مَعْنَى «أَعُود»: أَنُودُ وَألْمَجِئْ رَأَعْمَصِمْ بكَ يَا الله هين الشَّيْطانِ الرّجِيم»: الْمْظرُوو القيكد عَنْ رَحْمَةٍ اللو لا يَضُرْنِي في دينيء وَلَا في"},{"id":"talib-alilm-p61","text":"وَتِرَاءَةُ الَاتِحَةٍ رُكُنٌ فِي كُلَ رَكْعَةٍ؛ كما نِي الحَدِيثِ: ١لا‏ صَلَاة لِمَنْ لَمْ يَفْرَأْ بِفَاتِحَةٍ الكتّاب» وَحِيَ م القُرآن. وَآَسْيِعَانة. «الحمد ينه : الحَمْدُ نتاف وَالأليث وَاللّامُ لِأسْتِغْرَاقٍ جَمِيع المَحَايِدٍ. وَأَمَا وَتكُويك الا يوثقتى كذسا ا يدا «رَبّ الَْلَيِيَ4: الب هُوَ: المَعْبُودٌ المَالِكُء المَُصَرّفُء مُرَبّي جَمِيع العَالَمِينَ"},{"id":"talib-alilm-p62","text":"5 متون طالب العلم «الْسَلَينَ4: كُلّ ما سِرَى اللَّهِ عَالَمُ وَهْرَ رب الجمِيع . اسمن : رَحْمَةعَامَةبجَمِيع المَخْلُوفَاتٍ. «ألييِم 4: رَحْمَةخَاصَةبِالمُؤْمِنِينَ؛ وَالدَلِيلُكَولَهُتَعَالَى : «(وَكان بالْمؤِْنَ يَسمًا» . ميك يوم ألئين»: يوم الجَرَاءٍ وَالحِسَابء يَوْمُ كُلَّ يُجَارَّى بِعَمَلِهء إِنْ خَيْراً حير إن شَرَا فر وَالدَلِيلٌ َوْلّهُ تَعَالَى: ظوبا درك مَايومُ لين * ثم مآ درك ما بَومُ لين * بَنمَ لا تنك وَالحَدِيتٌ عَنْهُ يَلِهِ: «الكَيِّسُ مَنْ دَانَّ"},{"id":"talib-alilm-p63","text":"َفْسَهُ وَعَمِلَ لِمَا بَعْدَ المَْتِء وَالعَاجِوُمَنْ أنبَعَ َْسَهُ هَوَاهَاء وَتَمَنّى عَلَّى اللَّ الأَمَانِيً» . «إَِاكَ تحْبْدُ» أي : لا تَعْبْدُ غَيْرَكَ ‏ عَهْدُ بيْنَ ابد وََْنَ ْو ألا يَمْْدَ إِلَا َه -. «دَإيَاكَ مْتَيِيثْ»: عَهْدُ بَيْنَ المَبدٍ َبيْنَ وب ألا يَستَعِينَ أحَدٍ سِوَاه. اهدي الوَمطلٌ لْمَسِيمَه مَعْنَى «أَهْينَا» : دُلَنَاء وَأَرْشِدْنَاء ونا . وَ«الصٌّرَاظ) : الإِسْلام وَقِيِلَ: الوتمولة. وَقِيلَ: القُرَآنُء وَالكُلُ حَقٌ. وَهلمْسْتَقِيمٌ»: الَّذِي لَا عِوَجَ فيه. «صرط انيت منت م4 ريق"},{"id":"talib-alilm-p64","text":"وَالدَِّيلُ كَوْلهُ تَعَالَى: «إوّس ميلع الله اَل أزكيت م دن امم لَه عَم يِنّ وْلَهِكَ دَفِنًا4 . لعَرِ المنشرب طَْهمْ4 وَهُمْ: اليَهُو3ٌ مَعَهُمْ عِلْمٌ وَلّمْ يَعْمَنُوا بو تَسْألُ اللّه أَنْ ولا صَآاِنَ4 وَهُمْ: النَصَارَىء يَعْبْدُونَ الله عَلَى جَهْلٍ وَضَلَالِء تدأل الله أن يُجتبَكَ دَدَلِيلُ الصَّالّينَ؛ تَوْلُهُ تَعَالَى: طقل هَل ديا وم يسو َم يحون شنم * ولك ادن"},{"id":"talib-alilm-p65","text":"كوأ لت َيه وَلقآيو. حيطت الهم هلاثم وَالحَدِيتٌ عَنْهُ يكِ: تتبن سَنَنَ مَنْ كَانَ َبْلَكُمْ حَذْوَ القُذَّةِ ِالقُدّو حَنَّى لَوْ مَحَنُوا جُخْرَ ضَبٌٍّ لَدَكَلْتْمُوه َانُوا: يَا رَسُولَ اللّوا اليَهُودُ وَالنَصَارَى؟ كَالَ: كَمَنْ؟!2 أخْرّجَاة. وَالِحَدِيتُ النَّانِي : «أَنْتَرَكَتِ اليَهُودُ عَلَى إِحدى وَسَبْعِينَ وه َرَت النُصَارَى عَلَى نين وَسَبْعِينَ فِرْكَة وَسَتَفْكَرقُ هَذِو الأمَةُ عَلَى ثَلَاثِ وَسَبْعِينَ فِْئَةه كُلّهَا في النَّارٍ إِلّا وَاحِدَةٌ قُلْنَا: مَنْ حِىَ يا رَسُولَ اللَّد؟ كَالَ: مَنْ كَانَ عَلَى مِثْلٍ ما أنَا عَلَبْهِ وَأَضْحَابي)."},{"id":"talib-alilm-p66","text":"وَالركُوعٌ: وَالرَّنْعُ مِنْهُ وَالسُّجُودُ عَلّى العمَناء الكتققة وَالاغتتال كف وَالجلمَةٌ ينَ الَجدئينِ. َالدَليلُقَوْلهُتَعَالَى : ظيَتليهًا ايت اصثوأ أكَعُوا وأنْجْدُوأ». وَالحَدِيتُ عَلْهُ وله: «أهرْتُ أن أُسْجْدَ عَلَى سَبْعَةَِظم»."},{"id":"talib-alilm-p67","text":"شَرُوطٌ الصّلاة وَرْكَائها وَوَاِبَاتهَا 36 وَالطمَأْنِيئَةُ ني جمِيع الأثْمَالِء وَالتَرْتِيبُ بَيْنَ الأركان. وَالدَلِيلُ: حَدِيتٌ المْسِيءء عَنْ أبي هُرَيْرََ ضيه فَالَ: ابَيْنَمَا نَحْنْ جُلُوسْ عِنْدَ الب يله إِذْ مَخَلَ رَجُلُ مَصَلَّىء كَسَلَّمَ عَلَى لني كلل تلاثاً . ثُمَّ َالَ: وَانَّذِي بَعَنَكَ بالحَقّ نَبِيَا لا أَخسِنٌ غَيْرَ هَذَاء كَعَلَمنِي. قَالَ: إِذَا ثُمْتَ إِلَى الصَّلَاةٍ فُكَبّن كم آفرَأ مَا َيسّرَ مَعَكَ مِنَ القرْآنء ثم أزكغ حَتَّى تَظمَيْنٌ اكع ثم أزئغ حَتَّى تَعْتَدِلَ كَايِماً» ثُمَ أشجُذ"},{"id":"talib-alilm-p68","text":"وَالتََهُدُ الأخيرٌ رٌُُ؛ كُمَا فِي الحَدِيثِ عَن أبن مَسْعُودٍ ويه ثَالَ: «كُنّا نَقُولُ قَبْلَ أنْ عِبَاده السَّلَام عَلَى جِبْرِيلَ وَميِكَانِيلَ» فَقَالَ النَِّيْ يكةِ: لَا تَقُونُوا: السَّلَامُ عَلَى اللَّهِ مِنْ عبَادِِ؛ كَإِنَّ اللّهَ هُوَ السَّلَامُ وَلَكَنْ قُونُوا: التَّحِبَّاتُ لِلَِ وَالصَّلَوَاتُ وَالطَببَاتُ؛ السَّلامْ عَلَيِكَ أَيَُا اليَّيْ وَرَحْمَةُ الل وَبَرَكَاةُ السام عَلَيْنَا وعَلَى عبَادِ اللّو الصَّالِحِينَ» أَشْهَدُ ألا إَِه ِّا الله وَأَشْهَدُ أنَّ مُحَمّدا عَبْدُهُ وَرَسُولُهُ . وَمَعْنَى «التّحيَّاتُ»: جَمِيمُ التَمْظِيمَاتٍ لِلَّو مُلكاً وَسْتِسْفَاقاً ‏ مِثْلُ : الِأنْحِنَاءِ» وَالخُضوع وَالرُحُوع» وَالسجُووء وَالبقَاهِوَالَّوَام -. ."},{"id":"talib-alilm-p69","text":"شُرُوطُ الصَالاةٍ وَأَْكَائهَا وََاجبَائهَا 3 وَجَمِيعُ ما يُعَظَلمُ به رَبُ العَالَمِينَ؟ فَهُوَ لل «وَالصَلَوَاتُ) مَعْنَاهًا: جَمِيعُ الدَّعَوَات وَقِيلَ: الصَّلَوَاتُ الحَمْسٌ. «وَالطَيبَاتُ): اللَّهُ ظيبة وَل 0 مِنَّ الأَمْوَالٍ وَالأَْمَالٍ إِلّا طيََهَا . «السَّلَامُ عَلَيِكَ أَيُهَا النَِيُ وَرَحْمَةُ اللو وَبَركَائهُ»: تَذعُو لِلئِّيَ يل بالسّلَامَةِ وَالوَحْمَةٍ بالتركةتوولم التحعق, والزي تذعى لذن يُذْعَى مع اللو. «الشلؤم نينا وعلى عاد الله الصَالِحِينَ»: تُسَلْمُ عَلَى تَْيِكَ وَعَلَى كُلَ عَبْدٍ صَالِح مِنْ هل السَّمّاءِ وَالأْضٍ."},{"id":"talib-alilm-p70","text":"328 متون طالب العلم وَالسَلَامُ دُعَاء» وَالصَالِحُونَ يُدْعَى لَمُمْ وَلَا يُدعَرْنَ مَعَ اللّ. «أَشْهَدُ ألا إِلَه إلا الله وَأَشْهَدُ أن مُحَمّداً عَبْدُهُ وَوسُولُه»: تَشْهَدُ شَهَادَة اليَقِينِ ألا يُمْبَدَ فِي السَّمَاءِ وََا في الأرْض بِحَقّ إِلّا الله . وَسَهَادَةٌ أنّ شهدا عَبِذة وَرَسُوله عند لا يُعْبَكُ وَرَسُولُ لَا يُكَذْبُ؛ بَلْ يُطَاعٌ وَيُتَبَعْ شَرَكَهُ الله بالُبُودِيّة وَالرّسَالَة. َالدَِِلُ فَوْلْهُ تَعَالَى : طِتََرَدَ الى يل لْروانَ عل عَبَدِوء لكرْنَ نكيت )»> ."},{"id":"talib-alilm-p71","text":"شُرُوطُ الصَالاة وَركائّهَا وََاجِبَانُهَا ذه «اللّهُمَ صَلَّ عَلَى مُحَمّدِ وَعَلَى آل مُحَمَد كَمَا صَلَيْتٌ عَلَى آل إِبْرَاهِيمَ» إِنّكَ حَمِيدٌ مَجِيدٌ) . الصَّلَاةٌ مِنَ اللّو: َنَاؤْهُ عَلَى عَبْدِهِ فى العلا الآغتى. كنا حكى التخارئ في «صَحِيجِوا عَنْ أبي العَالِيَةِ: ١صَلَاةٌ‏ اللّ: ََاوْهُ عَلَى عَبْدِهِ في المَلا الأغلّى. وَمِنَ المََائِكَة : الِأَسْتِغْفَارُ. وَمِنَ الآدَمِيّينَ : الذّعَاءُ. «وَبَارِكُ) وّمَا بَعْدَمَا مِنَ الدّعَاءِ: سُئَنُ أَقْوَالٍ."},{"id":"talib-alilm-p72","text":"07 امتون طالب العلم * وَالوَاجِبَاتٌ ثَمَانِية : جَحِيعٌ التَكْبِيرَاتِ غَيْرَ نَكبِيرَةٍ الإِخْرام. وَقَولُ: 'سْبْحَانَ رَبِي العظيم» في الرُكوع . وَكَوْكُ: «سَمِعَ اللّهُ لِمَنْ حَمِدَها للإِمَام وَالمُْمّردٍ. وَكَوْلُ: «رَيَنَا وَلَكَ الحَمْد) لِلْكلُ. وَكَوْلُ: 'سْبْحَانَ رَبِْيَ الأغلّى' في الشْجُودٍ. 1 1 وَقَولُ: «رَبَ أَغْفِرْ ِي» بَيْنَ السّجْدَئَيْن . وَالتَّشَهُدُ الأرّكُء وَالْجلُوسُ لَهُ."},{"id":"talib-alilm-p73","text":"شُرُوطُ الصَالاة وَركائّهَا وََاجِبَانُهَا لف كالآزكان ما سَقظ نيا سَهوا أن عندا؟ بَطلّتِ الصَّلَاةٌ بتزكه . وَالوَاجِبَاتُ ما سَقَط مِنْهَا سَهُواً جَبَرَهُ سْجُودُ السَّهُوء وَعَمْداً بَطَلَّتِ الصَّلَاةٌ بتزكه. وَاللَهُ غلم . سَرَصَمَ اَن"},{"id":"talib-alilm-p75","text":"2111111000 لمر قط وو أَلَّذِي هوَحقٌ أسْوعق العريّدٍ لهام ادغو المع ين عََدِالوَمَادِبِسْليَمَدَ لمن حمَةالته لت5٠كام).‏ ا 5"},{"id":"talib-alilm-p77","text":"* النْسَخ المعتمّدة في تحقيق هذا المتن: - نسخةخظية بجامعة لايدن- هولندا- برقم (6+7499): بخطٌ المصتف الشيخ محمد بن بخ ٍِ عبد الوهاب كلل. - نسخة خحظية بدارة الملك عبد العزيز - السعودية - برقم (مجموعة آل عبد اللّطيف 07)» تاريخ نسخها: 0ه - نسخة خظّية بالمكتية المحموديّة» بمكتبة الملك عبد العزيز - السعودية - برقم ‎»)191١0(‏ تاريخ ين\" - نسخة خظية بدارة الملك عبد العزيز ‏ السعودية - برقم (مجموعة ابن إسحاق 45)» تاريخ نسخها ه/ء بخط حفيد المصنف سليمان بن عبد الله لله - نسخة خظية بالمكتبة المحموديّة» بمكتبة الملك عبد العزيز - السعودية - برقم (4)1894 تاريخ تخي اقلت - نسخة خظية بالمكتبة المحموديّة» بمكتبة الملك عبد العزيز - السعودية - برقم (18980): تاريخ نسشها: 1595م"},{"id":"talib-alilm-p78","text":"- نسخة خظية بالمكتبة المحمودية» بمكتبة الملك عبد العزيز - السعودية - برقم (18957)» تاريخ انسخها: 175اه - نسخة خظية بالمكتبة المحموديّة» بمكتبة الملك عبد العزيز - السعودية - برقم (735): تاريخ نااك عبد العزيز - السعودية - برقم (0174: تاريخ انسكها::1995اف - نسخة خطّية بالمكتبة المحموديّة بمكتبة الملك عبد العزيز - السعودية - برقم (3174 مكرّر)» تاريخ نسخها: 1175م - نسخة خظّية بمكتبة مجلس الشُورى - إيران - برقم (4415)» تاريخ نسخها: 1177ه - نسخة خظية بالمكتبة المحموديّة» بمكتبة الملك عبد العزيز - السعودية - برقم (18951). - نسخة خظية بالمكتبة المحموديّة» بمكتبة الملك عبد العزيز - السعودية - برقم (551414)."},{"id":"talib-alilm-p79","text":"كِتَابُ التوجِيدٍ الذي هُوَ حَقُ الله عَلَى اليد كذ در 111 كِتَابُ التُوْحِيدٍ وَكَوْلُ الل تَعَالَى : طإومَا حلفت الى والادق إِذّا تدوز » . وَكَوْلُهُ: ِرَلِتَد ياف كل أي يَُولًا أن لتنذرا لله وكيوا المت 4 الآية. وَقَوْلَّهُتَمَالّى: طقل تصالا ألما حي بكم عحكم ألا روا بر. حجنا » إِلَى وله : َأ هذا صر مُسَمَقِمَا و4 الآية. وَكَُوْلُه: وَتصَى رَيْكَ ألا سَبدُأ إلا |2 بالود سا4 الآية."},{"id":"talib-alilm-p80","text":"7 متون طالب العلم وَكَولَهُ تَعالى : «واضذوا لله ]ا ترا يه كيم بالود إخسنا» الآية. كَالَ آبْنُ مَسْعُودٍ فيه : «مَنْ أَرَادَ أن يَنْظرَإِلَى وَصِبِّ محمد َل لي عَلَِهَا حَائمة؛ كفا : ل تكالا أل ما حرم وبحم عَقِسطمٌ ألا ترا بد. تبئاً» إلى قَوْلِه : وك مدا صر تَتتَقِيمًا قاتبخرة وَل نِمو الشقل؟ الآية. وَعَنْ مُعَاذِ بْنِ جَبَلٍ ينه قَالَ: «كُنْتُ رديت الي بك عَلَى حِمَارٍ» َقَالَ: يا مُعَادً! أَتَدْرِي مَا حَنٌ الله عَلَى العِبّادِء وَمَا حَنُ الهِبَادِ عَلَى اللّ؟ قُلْتُ : الله وَرَسُولُهُ غلم . قَالَ: فَإِنَّ حَقّ الل على العبَادِ أَنْ يَمْبْدُوهُ وَلَا يُشْرِكُوا به شَيْعاًء وَحَنٌ الهِبَادِ عَلَى اللَّ"},{"id":"talib-alilm-p81","text":"َقُلْتُ: يا رَسُولَ اللا ألا أَبَمْرُ النّاسَ؟ قَالَ: لا تَبَشْرْهُمْ كتككلواء كاه في الف ويوابي"},{"id":"talib-alilm-p82","text":"7 متون طالب العلم اذا بَابُ فَضْلٍ التّوْجِيبِ وَمَا يُكَمْرُ مِنّ الدُوبٍ َكَوْلُ اللَّو َعَالَى : ان :مثا وك يوا إيستهر بظثر اوليك كم الَكَنُ وَهم مُمْتَدُوَ)» . عن عتاةةازن الضايي :2ه 015: 013 رَسُولُ الله ك: «من سهد ألا إِلَه إلا اللَّهُ وُخْدَهُ اهربك لَه وَآنْ مُحَمُدا عَبْنَهُ وَرَسُولُة؛ وََنَ عِيِسَى عَبْدُ اللّهِوَرسُولُةُ َكَلِمَمهُ آَلقَاهَا إِلَى مَرْيمَ وَرُوحٌ ونه وَالِجَنَّ حَقٌه وَالتَارَحَقٌ: دنه الله الحَنّة عَلَى انا كَانَّ يِنَ المَمَلِ» أخراة."},{"id":"talib-alilm-p83","text":"ير على القار 2 1010 لا إِلَه إِّا اللَّهُ يتفي بدَلِكَ وَجْه اللّه . وَعَنْ أبي سَعِيدٍ ضيه مَرْفُوعَا: «قَالَ قزق ارا عَلْنِِي َبْعاً أَدكُرْكٌ وَأَذعُوة 0 آل كل يحشرم تدبإله إلد الله َالَ: يَارَبَ! كُلَ عِبَاوِكَ يقُونُونَ هَذا. قَالَ: يَا مُوسَى! لَوْ أَنَّ السّمَوَاتٍ السَبْعَ وَعَامِرَمْنَّ غَْري وَالأََضِينَ السَبْعَ في كِلّوِ. وَلا إِلَه إِلّا اللّهُ في كِمَّةِِ مَالَتْ بهن لا إِلَهَ إلا الله رَوَاهُ آبْنُ حِبّانَ وَالْحَاكِمْ وَصَححَهُ."},{"id":"talib-alilm-p84","text":"41 متون طالب العلم وَلِلتَّرْمِذِيَ وَحَسَّئَهُ: عَنْ أنّس فيه قَالَ: سَمِعْتٌ رَسُولَ اللَّهِ ل يَقُولُ: «ثَالَ اللَّهُ تَعَالَى: يا أَبْنَ آدَمَ! إِنَّكَ لَوْ أَنَيْتَيِي بِقُرَابٍ الأْض حَطَايّاء ثم لبي لا تُشْرِكُ بي شَيناً؛ ايم بقْرَايهَا مغفرَة. »و واي"},{"id":"talib-alilm-p85","text":"اليا بَابُ مَنْ حَمَّقَ التَوْجِيدَ؛ دَخَلَّ الجَنَةُبِمَيْرٍ حِسَابٍ وَكَوْكُ اللو تَعالّى: «إنّ تير 6ك أَبدٌ ًا َه جتنا وَل يَكُ بن الناركي» . وََال: «َايّنَ م ريم 1 فرت ». عَنْ حُصَّيْنٍ بْنِ عَبْدٍ الرَّحْمَنٍ قَالَ: ضف الكرْكُبٌ الَّذِي آنْقَضٌ البَارِحَة؟ قُلْتُ: أن رْتقيِتْء كال : فَمَا حَمَلَك على دَلِكَ؟ كُلتُ:"},{"id":"talib-alilm-p86","text":"44 'متون طالب العلم كَالَ: لا رُفْيَة إِلّا مِنْ عَيْنِء أو مُق كَقَالَ: َدْ أَحْسَنَ مَنِ آْتهَى إِلَى ما سَمِعَ . وَلْكِنْ حَدَئنَا أن عَبّاسٍ يها عَنِ الل كله َالَ: عُرِضك عَلَيَ الأمَمُ» كرَآيْتُ البِيّ وَمَعَهُ 7 58 اءق..م. و الرَّمْظء وَالتَبِيَ وَمَعَهُ الرَّجُلْ وَالرَّجْلَانِ إِدْ رُفَِ لِي سَوَادُ عَظِيمٌ» َطَئَئْتُ أَنَهُمْ مني كقِيلٌ لي : هَذَا مُوسى وَكَوْمُهُ. كَنَظَرْتُ فَإِذًا سَوَادُ عَظِيمٌ» كُقِيلَ ِي: هَذِهِ أَمَتْكَء وَمَعَهُمْ سَبْمُونَ ألفاً يَدْخُلُونَ الجَنَة ِمَيْرٍ حِسَابٍ وَلَا عَذَّاب."},{"id":"talib-alilm-p87","text":"كِتَابُ التُْجِيدٍ الَذِي هُوَ حَق الله عَلَى العَبيدٍ و4 َم َعَضء كَدَخَلَ مَنْزِلَفُ قَخَاضَ النَاسُ فِي أُولَيِكَء نَقَالَ بَعْضُهُمْ: تَلَعَلّهُمُ الّذِينَ صَجوا بول اللو كلة. وَقَالَ بَعْضَهُمْ: تَلَعَلّهُمْ انَْذِينَ وُلِدُوا 5 الإسلام وَلَمْ يُشْرِكُوا بالل شَيْباً ‏ وَذْكَرُوا أَشْيَاة . مَكَرَجَ عَلَيِهِمْ رَسُولُ الله كله فأَخبَروة قَالَ: هُمْ الَِّينَ لا يَسْتَرقُونَ» ولا يمون َلا يتطيَرونَ» وَعَلَى بهم يكوَكَلُونَ. َمَامَ مكَاَةُ بْنُ مِحْصَنء فَقَالَ: أذ الله ثُمَّ كَامَ رَجُلٌ آحَرُ فَقَالَ: أذعٌ اللَّه أَنْ"},{"id":"talib-alilm-p88","text":"43 متون طالب العلم 141 بَابُ الكَوْفٍِ مِنَّ الشَرْكٍ وَكَوْلُ اللَّهِ تَعَالَى: «إِنّ لله لا يَنْيْدُ أن رك > . وَقَالَ الخَلِيل نل: «رأجبن ون أن بد الأضتام » . وَفِي الحَدِيثِ: أَحْوَفُ مَا أحاف عَلَيِكُمْ: الشَّرْكُ الأَضمَرٌُ كَسْئْلَ عَنْهُ؟ قَقَالَ: الرّيَاكه. وَعَنٍ آَبْنِ مَسْعُودٍ ذه أن رَسُولَ اللو وك م اي 1 00 الت 1 9 قَالَ: «مَنْ مَاتَ وَهوّ يَدْعُو لِلهِ نِذَاً؛ دَخَلَ الثَّارَ رَوَاهُ البُخَارِيُ."},{"id":"talib-alilm-p89","text":"كِتَابُ التُوجِيدٍ الذي هُوَ حَقُ اللّهِ َلَى العَبيدٍ فد وَلِمْسْلم : عَنْ جَابِرٍ يه أذ مَسُولَ اله كك ام اص ولد يي و اس و بطر كال نح الندان كرك بو مكنا جل ع 0 ا الجَنّدٌ وَمَنْ لقِيْهُ يُشْرِكُ به سَيْعاً دَخَلَّ الثَارَ . ووانة"},{"id":"talib-alilm-p90","text":"م2 متون طالب العلم 1[ بَابُ الدُعَاءِ إِلَى شَهَادَةٍ آلا إِنَهَ إن اللّهُ وَكَوْلُ اللَّو تَعَالَى: طثل مَذِو سَبِيِقَ أَدهْوَا ِل أله عَلَ بَصِررَةِ نا وم تمق » . َعَنٍ أبْنِ عبَّاسٍ يها أن وَسُولَ الل يك ما بَعَتّ مُعاذا إَِى اليم َال لَهُ: «ِنّك تأي كَؤْماً مِنْ أَمْل الكِتَابٍ؛ َلْيَكْنْ أَوََ مَا تَدْعُومُمْ إلَبْه: شَهَامةُ أل إِلَهَ إِلّا اللّهُ - وَفِي ِوَايَةِ : إِلَى أَنْ يُوَحَدُوا الله . ِنْ هُمْ أطاعُوك لِدَلِكَ؛ كأَعْلِنْهُمْ أنَّ اللّه فْتَرَضَ عَلَيْهِمْ تحمس صَلَّوَاتٍ فِي كُلّ يَوْمٍ وَليْلَةٍ."},{"id":"talib-alilm-p91","text":"كِتَابُ التُْجِيدٍ الَذِي هُوَ حَق الله عَلَى العَبيدٍ لله َإِنْ هُمْ أطاعُوك لِدَلِكَء تَأَعلِمْهُمْ أنَّ الله ْترَضَ عَلَيهمْ صَدََةٌ ند من أَخَْاِهمْ كر عَلَى فُقَرَائِهِمْ . كن هُمْ أطاغوث لِدَلِكَ؛ فاك وكرَاِمَ أَنْوَالِهِمْ» وَنّقِ دَعْوَةٌ المَظلُوم؛ كَإِنّهُ لَيِسَ بَيْنَا وَيَيْنَ الل حِجَابٌ) أَخْرَجَاةُ. وَلَهُمَا: عَنْ سَهْلٍ بْنِ سَعْدٍ 5ه أَنَّ َسُولَ اللَّهِ يك قَالَ يَوْمَ تبر «لَأطينَ الَايَهَ دا رَجُلا يُحِبُ الله وَرسُولَهُ؛ وَيحِبه الله وََسْولُه ؛ بَفْتَحُ الله عَلَى يَدَيْ. كَبَاتَ النَامنُ يَدُوكُونَ لَيْلَمَهُمْ؛ أَيُهُمْ يُعْظَاهَا ."},{"id":"talib-alilm-p92","text":"0 متون طالب العلع َلَمَا أَصْبَحُوا؛ عَدَوْا عَلَى رَسُولٍ اللَّدِ يلق كُلْهُمْ يَرْجُو أَنْ يُعْطَامَاء كَقَالَ: أَيْنَ عَلِئْ بن أبن طَالِب؟ كَقِيلَ: هُوَ يشْتكي عَيتنه . وَدَعَا لَه قَبَرَآ حَنَّى كَأَنْ لَمْ يَكنْ به وَجَمْ تََعْطَاءُ الرَايَة» وَثَالَ: أَنْقدْ عَلَى رِسْلِكَ حَنّى رك بشاعوهن, كم نعم إلى الإشلارء َأخرْهُم يمَا يَجبُ عَلَهمْ منْ حَقَ الل َال فيو كَوَاللوا لَأنْ يَفْدِيَ اللّهُ بكَ رَجُلاً وَاجِداً ات نه"},{"id":"talib-alilm-p93","text":"إلذا بَابُ تَفْسِيرٍ التّوْجِيدٍ وَشَهَادةٍ ألا إِنَهَ إلا اللّهُ وَكَوْلُ النَّهِ تَعَالَى : «الليِك لذن يدغوت يتوت إل نَيهِمُ الوسيلة أَمُمْ أْربُّ» الآية. وَكَونْهُ تَعَالَى : يل تل انهم له وَكَرَيوه ِنَّى برك يمَا سنَمدُونَ * إلا الى مَطرَن) الآية . وََولهُ تعالى : «لقصذوا لتسابخم ورفكته رابا ين دوس ألو الآية . وَقَولْهُ: «ويرت آلتّاين من بيد ين ثوب آَل كَدَادًا موي كشت أله > الآية."},{"id":"talib-alilm-p94","text":"ل متون طالب العلع \"من كَالَ: لا إِلَه إِّا الله وَكَفَرٌ يما يُعْبَدُ مِنْ دُون اللَّ؛ حَرْمَ مَالَهُ وَدَمَهُ وَحِسَابْهُ عَلَى اللّده . وَشَرْحُ هَذِهِ الَّْجَمَةِ ما بَعْدَهَا مِنَ الأبْوَاب. ون ان"},{"id":"talib-alilm-p95","text":"ناب اليب الذي هُوَحَقُ الله على القبيد 1 افا يَابُ ولخ مِنَ الشزكِ لَبْسُ الحَلْقَةِ وَالخَيْطٍ وَتَحْوجِمَاِ ِرَفْع البَلَاءِ َو دَفْعِهِ وَكَوْلُ الله تَعَالَى : «ثُل مم ما تدمح ين ذون آَل إِنْ لاد لَه ِصْرٍ هَلْ هُنّ كَنِسَتُ روه الآيه. عَنْ عِمْرَانَ بْنِ حُصَيْنٍِ ؤها: «أنّ اللي له رَأَى رَجُلاً ِي يَدِِ حَلْقَةُ مِنْ صُفْرِ كَقَالَ: ما هَذِه؟! قَالَ: مِنَ الوَاهِنَةَء قَالَ: أَنْرْغهًاء ِِنََّا لا تَِيدَُ إِلّا ونا كَإِنكَ لَو مِتَّ وَهِيَ عَلَيْكَ؛ مَا أَنْلَخت أبداً» رَوَاهُ أَحْمَدُ بِسَنَدِ كا بَأسَ به."},{"id":"talib-alilm-p96","text":"وَلَهُ: عَنْ عُفَبَةَ ْنِ عَامِرٍ ذه مَرْفُوعاً: مَنْ وَدَعَة؛ قَلَا وَمَعّ الله لَه وَعَنْ حُدَيْقَة ضله : أنه رَأَى رَجُلاً في يَدِِ «ينا يون حرم يلد إلا مهم مترقه»' رَوَاُ أَْنُ أبي حَاتِم . هج انان"},{"id":"talib-alilm-p97","text":"ثاب الفؤجيدٍ اندي هوق اله على القبيد 1 41 بَابُ ما جَاءَ فِي الرُقَى وَالتَمَائِمِ فِي الصَّحِيح : عَنْ أبِي بَشِيرٍ الأَنْصَارِيَ طظلله : «أنّهُ كانَ مَعَّ رَسُولٍ اللَّهِ بك فِي بَعْضٍ أسْنَارِوء كَأَرْسَلَ رَسُولاً: ألا يََِيَنَ في رَكَبَةٍ بَعِير قِلَادةٌ مِنْ وَئرِ أَوْ قَِادةٌ؛ إِلّا قُطِعَث)2. وَعَنٍ آَبْنِ مَسْعُودٍ نه قَالَ: سَمِعْتُ رَسُولَ الله يك يَقُولُ: «إنَّ الرنَى وَالتّمَايِمَ وَالتَولة؛ قله 1155 امد واب ل كاذ وَعَنْ عَبْدٍ الله بْنِ عُكَيِمٍ يه مَرْفُوعاً: «مَنْ تَعَلَّقَ شَيْعَاً؛ وُكِل إِلَيْوا رَوَاهُ أَحْمَدٌُ وَالتَرْمِذِيُ ."},{"id":"talib-alilm-p98","text":"له متون طالب العلم 7 201000 التَمَائِمُ: شَيْءٌ يُعَلَقُ عَلَى الأَؤْلَادٍ عَنِ امي اع ود عو اي كوي ا العَيْنء لكِنْ إذا كان مِنَ القَرْآن؛ فرَخصٌ فيه “اوم بتو فاومة الى حر ع 217 بغضهو وَبَعْضَهُمْ لم يُرَحْصٌ فِيوء وَيَجَعَلهُ ال ا 000 مِنَ المَنْهِيَ عَنْه - منهم ابن مَسْعودٍ ذل -. 5 ل سور ايده وَالرنَى : حي الَتِي تُسَمَى العَرَاقِم» وَخَصٌّ ل ل الى وق 2 دع مِنْهُ الدَّلِيل ما خلا مِنَ الشَرْك؛ فَقَدْ رَخَصٌ فيه َسْولُ الل يك مِنّ الَيْنِ وَالحمَة . روعا مك مطياريه ‏ ر 00 وَالنوَلةُ: شَيْءٍ يَصَعُوتَهُ يَرْعْمُونَ أنه يُحَبْبُ المَرْة إلى زَرْجِهَاء وَالرّجُلَ إِلَى أمْرَأَيه. وَرَوَى المَامٌ أَخمَدُ: عَن رُوَنِفِع طلله كَالَ: كَالَ لِي رَسُولُ الله كله: يا رُوَيْفِمُ! لَمَلَّ الحَيّاةَ سَتَظُولُ بِكَ؛ تَأَخْبرٍ النَاسسَ"},{"id":"talib-alilm-p99","text":"كب لمُؤجيدٍ الذي هُوَحُقُ الله على البيٍ 3 اع يود رمه ال وهار غ1 ورعه أن مَنْ عَمَدَ لِخيتهُ: أز تَقَلَدَ وترأء أو أسْتنجى يرَجيع دَابَةِ أو عَظم ؛ كَإِنَ دا بَرِية هله وَعَنْ سَعِيدٍ بْنِ جُبَيْرٍ قَالَ: «مَنْ قَطِمَّ تَمِيمَةَ مِنْ إِنْسَانِ؛ٍ كَانَ كَعِذْلٍ رَقبَقا رَوَاهُ وَكِيمٌ . وَلَهُ: عَنْ إِنْرَاهِيمَ َالَ: «كَانُوا يَكْرَمُونَ التَمَائِمَ كُلّهَا مِنَ القُرآنٍ وَغَيْرٍ القُرآن) . * انان"},{"id":"talib-alilm-p100","text":"1 متون طالب العلع إلذا بَابُ مَنْ تَبَوَكَ بِشَجَرَةٍ أ حَجَرٍ وَنَحْوِهِمَا وَكَوْلُ الله تَعَالَى : طلْرَميم للّتَ وَالفرّك» الآيَاتِ. عَنْ أبي وَاقِدٍ اللَِّيَِ حَقِه كَالَ: «حَرَجْنًا مَعَ وَسُولٍ الله إلى حُتيْنِء وَنَسنْ حُدنَاء عَهْدٍ بِكُفْرِ وَلِلْمْشْرِِينَ سِذرَةٌ يَْكُفُونَ عِنْدَهَا وَيَنُوظونَ بها أَسْلِحَمَهُمْ يُقَالُلَهًا: ذَاتُ أَنْوَاطِ . َمَرَرَْا بسِدْرَ كَقُْنَا: يا رَسُولَ اللا آجْعَلْ لَنَا ذَاتَ أَنْوَاطٍ كما لَهُمْ ذَاتُ أَنْوَاط قَقَالَ رَسُولُ الل يكة: اللَّهُ أكبرً! إِنّهَا السّكَمُ"},{"id":"talib-alilm-p101","text":"لم وَالدِي َي يدوء كما قلت ينو إسرَايِيلَ لِمُوسَى: طاجَمل لَنآ إلا كا لم هه تل لك د 4 لَعَْكبُن سكن من كان تَبْلكُمْا رَوَاه الْْمذِيُ وَصَححَهُ. ها انه نه"},{"id":"talib-alilm-p102","text":"61 بَابُ ما جَاءَ فِي الدَّبْح لِغَيْرِ اللّه وَكَوْلُ اللَِّ تَعَالَى: قل إِنَّ صَلَاقِ وَمُتى كيك وماق يورت اَن * لا شرِيك أذ الآية. َكَل : «ِضصَلٍ بَيَكَ وانحز». لَمَنَ اللَّهُ مَنْ لَمَنَ وَالِدَيْوء لَعَنْ الله من أو مُخيثاً لَعَنّ الله مَنْ ف مَنَارَ الأزض» زو"},{"id":"talib-alilm-p103","text":"كاب التؤجيدٍ الي هو حَقُ الله على القبيبٍ لك وَعَنْ طَارِقٍ بْنِ شِهَابٍ أَنَّ رَسُولَ الله يله قَالَ: ««َكَل الجَنَة رَجُلٌّ ِي دَُابٍ وَدَحَلَ النَارَ مَجُلُ فِي دُبَابٍِء كَانُوا : وَكَيْفَ ذَلِكَ يَا رَسْولَ اللّهه 00 قَالَ: مر رَجْلَانِ عَلَى نَوْمٍ لَهُمْ صَنَمْ لا َقَانُوا لأَحَدِهِمًا: كَرَْء كَالَ: لَيْسَ عِنْدِي سَيْء أَرّبُ تَانُوا لَهُ: َرّبْ وَلَوْ دُبَاباً كََرّبَ دُبَاباً» كحلا سَبيلهُ؛ كَدَكَلَ الَارَ وَكَالوَ للآخحر: ترك قا كنيثك ِأكربَ لِأحَدٍ سَبْعاً دُونَ اللِّ وك مَصَرَبُوا عُْقَهُ؛ نَدَخَلَ الجَنّها رَوَاهُ أَحْمَدُ. الله انه"},{"id":"talib-alilm-p104","text":"1 متون طالب العلع 11 بَابُ وَقَوْلُ اللَّهتَعَالَى : طلا كم فيد بدا» الآية. عَنْ نَابتٍ بْنِ الضَّحَاكِ ديه قَالَ: «تَذَرَ مَجُلّ أن يَنْحرٌ إبلاً برَاَة» قَسَأَلَ النَِىّ لذ؟ كَقَالَ: هَل كَانَ فِيهًا وَنَنّ مِنْ أَوْنَانِ الجَاجِليّةِ يُعْبَدُ؟ ثَالُوا: لا. كَالَ: مَل كَانَ فِيِهَا عد من أَعْيَاِهِمْ؟ كَالوا: له كَقَالَ رَسُولُ الله بككه: أَوْفٍ بِنَذْرِكَ؛ كَإِنّهُ ا وكا لِتذْر فِي مَعْصِبّةٍ اللو وََا ما لَا"},{"id":"talib-alilm-p105","text":"كِتَابُ التُْجِيدٍ الَذِي هُوَ حَق الله عَلَى العَبيدٍ » يَمْلِكُ أَبْنُ آدَم) رَوَاُ أَبُو دَاوُدَه وَإِسْنَادُهُ عا ال اله"},{"id":"talib-alilm-p106","text":"0 متون طالب العلم 11 بَابُ مِنَ الشَرْكِ النَدْرُ لِكَيْرِ اللّهِ لِقَْلِهِ : يون يللد ر» . وَكَوْلِهِ: «رَمَآ الَمَفَيُر يِن تَمَقَةٍ آَوَ كَدَرْثُم افرع ص ايل ماكر سم موت مْن ندر فَإِكَ الله يلمه.» . وَفِي الصّحجِيح: عن عَائِسَةً ويا أَنَّ رَسُولَ اللَِّ يله كَالَ: من نَذَرَ آَنْ يُطِيعَ الله لَه وَمَْ ندر أن يَْصِيَ الله فلا يَْصوا. واواني"},{"id":"talib-alilm-p107","text":"تا لوجي الي هوق الله على القبيد إليلةا بَابُ مِنّ الشَرْكٍ الِأسْتِعَادَة بِمَيْرِ الله وَكَوْلْهُ تَعَالَى: «وأنه كن يبال ين لاض بود يكال ين لبن الآية. رك الله كله يَقُولُ: \"مَنْ نَرَلَ مَْزِلاً كَقَالَ: َعُودُ بكَلِمَاتِ الل النَّائّاتِ مِنْ شَرّ مَا خَلّقَّ؛ َم يَصْرَهُ شَيْء حَنَّى يَرْنَحِلَ مِنْ مَنْزِلِهِ ذِك» 1 الله ان"},{"id":"talib-alilm-p108","text":"هلا متون طالب العلم إقلقا بَابُ مِنّ الشَرْكِ أَنْ يَسْتَفِيتَ بِكَيْرِ الله أو يَدهُوَ غَيْرَهُ وَقَوْلُ الل تَعَالَى : طولا مدع ين ذو ألما ل يَمَمكَ زا يديد ون كت يَنَّكَ 5 يِنّ طَِينَ * وَإِد ينك أمَهُ بسر ألا كاف له ا مرّ4 الآية. وَفَوْلْه: «كبتوا عند لله ارك وَأعْدو؛» الآية. َكَوْلْهُ: ومن أسَلْ من َدَعُوأ ون دون لله من لا ميِيبُ له إِلَ يور الْقِيمَة» الآيتين ."},{"id":"talib-alilm-p109","text":"كِتَابُ التُؤجيبٍ الي هُوَ حَقُاللّهِ عَلَى العَبِيدٍ 1 وَكَوْلُه :آمل ريت القنطق | 5ها” ويكيت لشو > الآية . رَوَى الطَّبرَانُ : «أَنّْهُ كَانَ في رَمَنِ النَِيِ لل مُنَاِقُ يُؤْذِي المُؤمنِينَ» كَقَالَ بَعْضْهُمْ : قُومُوا ِنَا نَستَغِيتُ بِرَسُولٍ الله َك مِنْ هَذَا المُنَافِقٍ ؛ َقَالَ النَِّيْ يله إِنّهُ لا يُسْتَمَاتُ بيء وَإِنّمَا نا ال نه"},{"id":"talib-alilm-p110","text":"مل متون طالب العلع ] بَابُ قَوْلٍ اللَّهِ تَعَانَى: «لترة نا لا جك نا و وة * وَلا يسْتَطِيعُونَ للم َصرَا» الآية وَكَوْلُه: لم تشورت من ذونه. ما تكرت ين فَظمِيرٍ 4 الآية. شَجُوا نَِنّهُمْ؟! فَنَرَلّتثْ: «يِدنَ لك ين الأثر 01 رَسُولَ الل كه ذا رَكَعَ َأْسَهُ من الركُوعٍ في الرَكعَةٍ الآخِرَة مِنَ المَجْرٍ - يَقُولُ: اللَّهُمّ لْعَنْ"},{"id":"talib-alilm-p111","text":"ثُلاناًء وَفُلَاناً. وَفُلاناً؛ بَعْدَمَا يَقُولُ: سَمِعَ اللقتلمة نب زعا وناك السهد َنْرَلَ اللّهُ: إن لك ين الأتر كَن44. وَفِي رِوَايَةِ: 'يَدْمُو عَلَى صَفْوَانَ بن أَمَيّك وَسْهَيْلٍ بْنِ عَمْرِوء وَالحَارِثٍ بْنِ هِشَامٍ؛ كَرَلَثْ: «لِدْنَ اك ين الأ عَن146. وَفِيه: عَنْ أبي هُرَيْرَةَ ذه قَالَ: «قَامَ رَسُولُ الله يك جين أنِْل عَلَنْهِ: «تأيز عَثِريَكَ الأويب»؛ قَالَ: يا مَعْشَرَ ُرَيْشنِ! - أذ كَلِمَة تَحْوَهًا ‏ آشتَرُوا أنْفُسَكُمْ؛ لا أخني عَنْكُمْ ين اللو شيعا . ا عبَاسُ بن عبد المطلبٍ! لا أي عَذكَ"},{"id":"talib-alilm-p112","text":"1 متون طالب العلع يا صَفِيّةُ َم رَسُولٍ اللا لا أي عَنْكِ مَالِي ؛ لا أَغني عَنْكِ من الل شَيْنأ». وساي"},{"id":"talib-alilm-p113","text":"تا التُؤجيدٍ الي هوق الله على القبيب الا إلذذا بَابُ قَوْلٍ اللَّهِ تَعَانَى: دح إِدا فرْمَ عن مويه قَاثُوأ مادا َال وسوس وه سد كا موود . مول و ميلك يكم َالو لحن وهو ألْعنُ الكَيرُ» فِي الصَّحِيح: عَنْ أبي هُرَيْرَةَ طليه عَنِ النَّبي يلل َالَ: «إذا كَضَى اللَّهُ الأَمْرَ ذ لني وك قال: «إذ ا الكماي)فريت القلائكة باخنصتها سعاناً مل السداة؛ مريت الولائة وجري شل لِمَوْلِ كأنْهُ سِلْسِلَةٌ عَلَى صَفْوَانِ يَنْقُدُهُمْ دَلِكء ظعي إدَا 5 عن لوبهم قَالوأْ مادا قَالّ 2 م 9 حون سو يكم تلوأ لحن وهر الْمنُ الجَيرُ4. كَيَسْمَعْهَا دي العئى ث2 1 0 مكرًاء تنظة لوق به بَعْضٍ وَصَفَهُ سيان بكي فَحَرَفَهًا يندع أقاليت. 00"},{"id":"talib-alilm-p114","text":"1 متون طالب العلع يُلْقِيهَا الآحَرُ إَِى مَنْ تَحمَه حَتَّى يلْقِيَهَا على لِسَانِ السّاحِرٍ أو الكَاهِنِ. ريما أنركة الشْهَابُ كبل أن يلْقِيَقاء وَرْبمَا آَلْقَامَا كَبْلَ أنْ يُدرِكَهٌ مِكْذِبُ مَعَهَا كد وَكَذًا: كذَا وَكَذَا؟ كَيُصَدَّقُ بتِلْكَ الكَلِمَةِ الَتي سُمِعَتٌ مِنّ السَّمَّاءِ . ‎١ ١‏ وَعَنِ النّوّاسِ بْنِ سَمْعَانَ ويه قَالَ: قَالَ رَسُولُ النَّهِ لِ: «إدًا أَرَادَ اللّهُ أَنْ يُوحِيَ بالأمر ؛ تكلم بالوخي» أَحَدّتٍ السَمَوَاتٍ من يَجْفَةٌ ‏ أ ثَالَ: رِعْدَةٌ شَدِبدَةٌ ‏ خَؤناً مِنَ اللّدِ كن ."},{"id":"talib-alilm-p115","text":"كِتَابُ التُوْجِيدٍ الَذِي هُوَ حَق الله عَلَى العَبِيدٍ لدلنا 5 7 لصوو ميق ذا سَمِمَ ذَّلِكَ أَهلّ السّمُوَاتِءٍ صَعِقُواء ىس و2 008 530110 وَخَرَوآ لله سبد فيكون أَوَّلَ مَنْ يَرْفْعُ رَأْسَهُ ف و 1و2 كو جد مسيم رب ع دس عتريل» ركلف اللذ بين وكيد يك را 1 كر بعيله و لعل 7 سس خ رمم لسعلل اع يشر عتريل على العلويكق كلا مر م ع تر مر وَقَدْ بَيّنَ النَبِئُ يله أنهَا لا تَحُون إِلَا لِأَهلٍ 5-7"},{"id":"talib-alilm-p119","text":"تاب الُؤجيدٍ اي هوق الل لى القبيد 1 141] بَابُ قَوْلٍ الله تَعَالَى: <إَِكك لا جَرى من كيت تلك أله يي من يتكذ» ول القتسيم: قن أثن االققيل صخ أسه يي ف شرك الل ل عل عبد الل أبي أميّة وَأَبُو جَهْلٍ» قل له: يا عَمّ! قُل: لا إِله إلا الله كَلِمَةٌ أَحَاحٌ لَكَ بِهَا عِنْدَ الل . كَفَاَا لَهُ: أَتَرْعَبٌ عَنْ مِلَةِ عَبْدِ المُمَلِيِب؟! َأَعَادَِعَلَيِهِ رَسُوَلُ الل يك كَأعَاءَاء َكَانَ اد تا0: ف على ينه عدر القنطلب: وَأبى أن يَقُوْلَ : لا إِله إِلّا اللّه."},{"id":"talib-alilm-p120","text":"لله متون طالب العلم كَقَالَ النَبِيْ يلِ: لَأْسْتَغْفِرَنَ لَك مَا لم أنه عَنْكَ؛ كَأَنْرَلَ اللَّهُ عق : «إما كرك للدي ولت ما ل يستَنفنوأ بلشذركي وَل كنا أل تق » وَأَنْرَكَ اللّهُ في أبي طَالِب: «إِنَّكَ لا َبَوِى من تدك ولع أنه يجَدى من يتنه . ا اه"},{"id":"talib-alilm-p121","text":"انما كم باب 1 مر ون 7 ل ما جَاءَ أن سَيَبَ كر بَتِي آدمَ وَتَرْكهمْ دِيتهُمْ هُوَ العْلوُ فِي الصَّالِجِينَ , 7 “اعرد ورم وَمَوْلُ الله كك : آمل الحتب لا صَْنُوأ في دِينِكُم 4 . َوْلٍ اللَّهِ وق : ««ركاثرا لا نديد لمتكي ولا دس ون ولا سوا ولا يكوك وَيَعُوقَ وَشرَا) ؛ كَالَ: هَذِهٍ آَسْمَاءُ رِجَالٍ صَالِحِينَ مِنْ قَوْم نُوحء قَلَّمّا مَلَكُوا؛ أَوْحَى الشَّيْطَانُ إِلَى َْمهمْ : أن َنْصِبُوا إِلَى مَجَالِسِهِمٌ الي كَانُوا يَجْلِسُونَ فِيهًا أَنْصَاباً» وَسَمُومَا بأَسْمَائِهِمْ"},{"id":"talib-alilm-p122","text":"3 متون طالب العلم تَمَعَنُواء تَلَمْ تُمْبَد حَنَّى إِذَا مَلَكَ أُولَيكَ وَنْسِيَ العِلم؛ عُِدَث)2. وََالَ آَبْنُ القَيِّم: «قَالَ غَيْرُ وَاحِدٍ مِنَّ السَّلَفٍ : لَمّا مَانُوا؛ عَكَهُوا عَلَى قُبُورِهِمْ» ثُمّ صَوَرُوا تَمَائِيلَهُمْء ثُمَ ظَالَ عَلَيْهِمُ الأَمَدُ؛ كَعَبَدُوَهُمْ). وَعَنْ عُمَرَ ظلِ أن رَسُولَ اللَّهِ كَل كَالَ: ١لا‏ تُظرُونِي كَمَا أظرّتٍ النّصَارَى أَبْنَ مَرْيَم ِنَمَا آنا عَبْدٌء كَقُونُوا: عَبْدُ اللّهِ وَرَسُولُةُ ا وَعَنِ أبن عباس #ه قَالَ: قَالَ رَسُولُ الله يك: «إِيّاكُمْ وَالغُلُوٌ كَإِنَمَا أَهْلَكَ مَنْ كان مَبْلكُمُ القُلوُا حَدِيثُ صَحِيحٌ ."},{"id":"talib-alilm-p123","text":"كِتَابُ التوجِيدٍ الذِي هُوَ حَقُ اللّهِ َلَى العَبِيدٍ لفل وَلِمُسْلِم: عَنٍَأبِنٍ مَسْعُودٍ ذه أن رَسُولَ اللَّهِ يك َالَ: «مَلَكَ المُتَتَظَعُونَ ‏ َالَهَا تلاثاً ). ‎١‏ ا اه"},{"id":"talib-alilm-p124","text":"1 متون طالب العلم لقنا بَابُ كاين سكل قيدة هيه الله عِنْدَ قَبْرِ رَجْلِ صَالِح ؛ فَكَيْفَ إِذَا عَيَدَهُ5! فِي الصَّحِيح: عَنْ عَائِشَةَ ينا : «أَنَّ م سلَمَة دكرث لِرَسُولٍ الل بك كيس ئها بأَْضٍ الحَبَفَة وَمَا فيهًا مِنَ الصُوَرِ فَقَالَ: زنك ذا مَاتَ فِيِهِمُ الرَّجُلُ الصَّالِحُ ‏ أو العَبْدُ الصَّالِحُ ‏ بَنَوْا عَلَى كَبْرِهِ مَسجدا يَضَوَررا فيوولك الضوي» أرلمك هذا الحَلْقٍ عِنْدَ اللّه."},{"id":"talib-alilm-p125","text":"تاب الُْحِيدٍ الي هُوَ حَنُ الله على القبيد ندل عساوع \"1 .ا و د .0 وتوسسه وَلْهُمَا: عَنْهَا ويا كَالَتْ: «لْمَانزل و 60 ل موس رسع مر بِرَسُولٍ الله يلو طَفِقَ يَظرَحُ خمِيصّة له عَلى 8 رخو\" وي ”سرود را كنس ري اب روم وَجْهِوء فَإِذًا أعْتَمْ بها كَمَقَهَاء كَقَالَ ‏ وُعُوَ كذلك + لَقثَة الله عَلَى يقد وَالتضَارء م ل 5ه أتحَذوا فَبُورَ أَنبِيّائِهِم مَسَاجِدَ ‏ يُحَذْرُ ما صَتَقُواء وَلَوْلَا دَاكَ أَبْررَ قَبرة عَبْرَ أنّهُ خُشِيَ أَنْ يُتَكَدَّ مَمْجداً ) أَخْرّجَاه. رَسْولَ الل كله َبْلَ أن يَمْوتَ بِخَمْسٍ وَمُوَ لو وسملل وب اوعد ع ةجومل وو جاه يَقُولٌ: «إني أبرَأ إلى الله أن يَكُونَ لي مذكم' ا | سي الع ا ان خبيلء فإن الله قد اتخذني خَلِيلا كما اتخذ وير ل ا الا مط رعتعوتن ل سوسم رايم حَلِيلاًء وُلَوْ كُنت مُنْخِذا مِنْ أمِي خَلِيلاً ؛ لَأتَحَذْتٌ أبَا بكر كَلِيلاً ."},{"id":"talib-alilm-p126","text":"ا هتوصيصصم «ورتوتت يملع ار اعون اشام ان عومهان وسيب ألا وإِنَ مَنْ كان قَبْلَكُمْ كانُوا يَتَخْذُونَ قبُورَ 1 3 كي اليه ا مواق عشعومم أنِْيَائِهِمْ مَسَاِجِدَء ألا نَلَا نَتَخْذُوا القبُورَ 2 كر لعسيو ال إعنذ مَسَاجِدَ؛ إن أَنْهَاكُمْ عن لِك . ا عر ف قر فَقَدْ نهى عَنْهُ فِي آخِر حَيَّاتِهِ» ثم إِنهِ لَعَنَّ فر في الصراق د من قعلة. زر يبي اين بن الست ا عه ع ريع وَالصَّلَام عِنْدَهًا مِنْ ذَلِكَ ‏ وَإِنْ لَمْ يبن ا ل الم اليد مَسْجِدٌ ‏ وَهُوّ مَغْنََ كَوْلِهاً : «حَشِيّ أنْ بُنَخَ” ل ف ل سدم كسم كسم هذ مَسُجد
